; ==========================================================
; 4. 节点池
; 国家组只保留两路生产订阅实际出现的八个地区；未来其他地区由全局池和“其他地区”承接。
; 实用组按专线、原生/住宅、流媒体和低倍率标签交叉筛选，同一节点可同时属于多个组。
; 所有自动池均为 url-test，默认使用 Cloudflare HTTPS 测速；流媒体节点改用 Netflix HTTPS 实际连通探测。
; 统一使用 300 秒间隔和 100 ms 容差降低抖动。
; 国家和线路叶子组加入 REJECT 作为空组安全兜底；手选节点组以稳定自动兜底。
; ==========================================================

; 排除机场用伪节点发布的流量、到期、官网和刷新提示。
custom_proxy_group=🧭 手动选择`select`[]🛟 稳定自动`(?i)^(?!.*(剩余流量|重置剩余|下次重置|套餐到期|官网|邮箱|节点异常|刷新订阅|刷新失败|更新失败|取消订阅时限)).+
custom_proxy_group=♻️ 自动选择`url-test`[]REJECT`(?i)^(?!.*(剩余流量|重置剩余|下次重置|套餐到期|官网|邮箱|节点异常|刷新订阅|刷新失败|更新失败|取消订阅时限)).+`https://cp.cloudflare.com/generate_204`300,,100

; 优先选择当前订阅中较稳定的日本/新加坡 CUCM、专线流媒体线路；自动选择组作为非 DIRECT 兜底。
custom_proxy_group=🛟 稳定自动`url-test`(?i)(🇯🇵|日本|Tokyo|Osaka|(^|[\s_-])JP([\s_0-9-]|$)|🇸🇬|新加坡|Singapore|(^|[\s_-])SG([\s_0-9-]|$)).*(CUCM|专线.*流媒体)`[]♻️ 自动选择`https://cp.cloudflare.com/generate_204`300,,100

; R4-HA 业务可用性池：使用真实业务 HTTPS 入口探测全部有效节点。
; 900 秒低频探测降低风控和限流概率；稳定自动作为非 DIRECT 兜底。
custom_proxy_group=🤖 ChatGPT 专用节点池`select`[]🧠 人工智能`(?i)^(?!.*(剩余流量|重置剩余|下次重置|套餐到期|官网|邮箱|节点异常|刷新订阅|刷新失败|更新失败|取消订阅时限)).+
custom_proxy_group=🟠 Claude 专用节点池`url-test`[]🛟 稳定自动`(?i)^(?!.*(剩余流量|重置剩余|下次重置|套餐到期|官网|邮箱|节点异常|刷新订阅|刷新失败|更新失败|取消订阅时限)).+`https://claude.ai/favicon.ico`900,,100
