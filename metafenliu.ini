ruleset=🐟 漏网之鱼,[]FINAL

; ==========================================================
; 2. 应用策略组
; 海外功能父组默认走隐私代理；Apple、Microsoft 延续直连优先，支付交易默认手选。
; ==========================================================

; >>> custom groups injection point <<<
; >>> generated custom groups start <<<
; 这里放 custom/rules.ini 对应的用户专用策略组。
; 名称必须和 ruleset= 后的目标名称完全一致。

custom_proxy_group=🌍 境外网站`select`[]🔒 隐私代理`[]DIRECT`[]🛟 稳定自动`[]♻️ 自动选择`[]🧭 手动选择`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇰🇷 韩国`[]🇺🇸 美国`[]🇬🇧 英国`[]🇩🇪 德国`[]🎬 流媒体节点`[]REJECT`[]🔐 自定义节点 · 🌍 境外网站`[]🔐 自定义节点组 · 🌍 境外网站

; 只承接五个出口归属查询域名。默认继承隐私代理，校验脚本会逐节点切换并在结束时恢复。
custom_proxy_group=🔬 节点归属校验`select`[]🔒 隐私代理`(?i)^(?!.*(剩余流量|重置剩余|下次重置|套餐到期|官网|邮箱|节点异常|刷新订阅|刷新失败|更新失败|取消订阅时限)).+

custom_proxy_group=🇸🇬 指定新加坡`select`[]🇸🇬 新加坡`[]🌐 默认策略`[]🇭🇰 香港`[]🇯🇵 日本`[]🇺🇸 美国`[]DIRECT

; muse.ai 强制走美国节点。
custom_proxy_group=🇺🇸 指定美国`select`[]🇺🇸 美国`[]🌐 默认策略`[]🛟 稳定自动`[]🔒 隐私代理`[]🇭🇰 香港`[]🇯🇵 日本`[]🇸🇬 新加坡`[]DIRECT
; <<< generated custom groups end <<<

; 功能父组定义默认行为；品牌子组默认继承父组，同时保留单独改路由的入口。
custom_proxy_group=🏠 本地网络`select`[]DIRECT`[]REJECT`[]🔐 自定义节点 · 🏠 本地网络`[]🔐 自定义节点组 · 🏠 本地网络
custom_proxy_group=🌐 联网检测`select`[]DIRECT`[]🔒 隐私代理`[]🔐 自定义节点 · 🌐 联网检测`[]🔐 自定义节点组 · 🌐 联网检测
custom_proxy_group=🧠 人工智能`select`[]🇸🇬 新加坡`[]DIRECT`[]🔒 隐私代理`[]🛟 稳定自动`[]♻️ 自动选择`[]🧭 手动选择`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇰🇷 韩国`[]🇺🇸 美国`[]🇬🇧 英国`[]🇩🇪 德国`[]🎬 流媒体节点`[]REJECT`[]🔐 自定义节点 · 🧠 人工智能`[]🔐 自定义节点组 · 🧠 人工智能
custom_proxy_group=📞 即时通讯`select`[]🔒 隐私代理`[]DIRECT`[]🛟 稳定自动`[]♻️ 自动选择`[]🧭 手动选择`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇰🇷 韩国`[]🇺🇸 美国`[]🇬🇧 英国`[]🇩🇪 德国`[]🎬 流媒体节点`[]REJECT`[]🔐 自定义节点 · 📞 即时通讯`[]🔐 自定义节点组 · 📞 即时通讯
