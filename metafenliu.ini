ruleset=🎧 音乐服务（Spotify）,[]GEOSITE,spotify
ruleset=🎞️ 海外影音,[]GEOSITE,category-entertainment

; 开发生态：官方品牌规则优先，本仓库列表补齐 PyPI、软件源和镜像站。
ruleset=🛠️ 代码托管（GitHub）,[]GEOSITE,github
ruleset=🦊 代码托管（GitLab）,[]GEOSITE,gitlab
ruleset=🐳 容器服务（Docker）,[]GEOSITE,docker
