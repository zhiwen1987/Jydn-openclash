ruleset=🔎 谷歌服务（Google）,[]GEOIP,google,no-resolve
ruleset=☁️ 网络服务（Cloudflare）,[]GEOSITE,cloudflare
ruleset=☁️ 网络服务（Cloudflare）,[]GEOIP,cloudflare,no-resolve
