; ==========================================================
; 4. 节点池
; 国家组覆盖当前及历史订阅中出现过的全部国家，地区组用于缩短上层手动选择列表。
; 实用组按专线、原生/住宅、流媒体和低倍率标签交叉筛选，同一节点可同时属于多个组。
; 所有自动池均为 url-test，使用 Cloudflare HTTPS 测速，120 秒间隔和 10 ms 容差加快故障切换。
; 国家和线路叶子组加入 REJECT 作为空组安全兜底；手选节点组以稳定自动兜底。
; 如果需要严格最低延迟，可把每行最后的 10 改为 0。
; ==========================================================

