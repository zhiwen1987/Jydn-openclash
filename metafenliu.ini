[custom]
; ==========================================================
; OpenClash /优化模板
; 目标：节点组最低延迟、精细分流、国内直连、默认不裸连
; 重要：OpenClash「Smart 策略自动切换」应开启，让这些 url-test 节点池在运行时转换为 Smart。
; ==========================================================

enable_rule_generator=true
overwrite_original_rules=true

; 清理机场的流量/公告/订阅说明条目
exclude=(?i)(流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|公告|通知|Telegram|电报|频道|使用说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official|Website)

; ==========================================================
; 1. 分流规则（从上到下匹配）
; ==========================================================

; Adobe 默认阻断；如需联网可在面板切换该组
ruleset=🟥 创意软件（Adobe）,[]GEOSITE,adobe

; 广告分类默认拒绝，但保留在面板临时放行的能力。
; 智能家居白名单高优先级直连：只对 rules/smarthome-direct.yaml 明确域名放行。
; 该区由 scripts/build.py 生成，必须早于广告、WebRTC 与宽泛海外分类。
; >>> generated smarthome rules start <<<
ruleset=DIRECT,[]DOMAIN-SUFFIX,tuya.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,tuyacn.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,tuyaus.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,tuyaeu.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,tuyain.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,iotbing.com
; <<< generated smarthome rules end >>>

ruleset=REJECT,[]GEOSITE,category-ads-all

; 本地网络先用精确域名和 IPv4/IPv6 保留网段阻止误入代理。
; 再用 GEOSITE/GEOIP private 覆盖更完整的私网分类。
ruleset=🏠 本地网络,[]DOMAIN,localhost
ruleset=🏠 本地网络,[]DOMAIN-SUFFIX,lan
ruleset=🏠 本地网络,[]DOMAIN-SUFFIX,local
ruleset=🏠 本地网络,[]DOMAIN-SUFFIX,home.arpa
ruleset=🏠 本地网络,[]IP-CIDR,127.0.0.0/8,no-resolve
ruleset=🏠 本地网络,[]IP-CIDR,10.0.0.0/8,no-resolve
ruleset=🏠 本地网络,[]IP-CIDR,172.16.0.0/12,no-resolve
ruleset=🏠 本地网络,[]IP-CIDR,192.168.0.0/16,no-resolve
ruleset=🏠 本地网络,[]IP-CIDR,169.254.0.0/16,no-resolve
ruleset=🏠 本地网络,[]IP-CIDR6,::1/128,no-resolve
ruleset=🏠 本地网络,[]IP-CIDR6,fc00::/7,no-resolve
ruleset=🏠 本地网络,[]IP-CIDR6,fe80::/10,no-resolve
ruleset=🏠 本地网络,[]GEOSITE,private
ruleset=🏠 本地网络,[]GEOIP,private,no-resolve
ruleset=DIRECT,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml,10800
ruleset=DIRECT,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,10800

; 仅对 10.88.0.0/24 的客户端 WebRTC STUN/TURN 生效，排除路由器本机 10.88.0.254。
; classical provider 使用 SRC-IP-CIDR + NETWORK + DST-PORT + AND/OR/NOT，避开转换器的逻辑规则兼容问题。
; 会影响部分网页语音/视频；需要时把「🛡️ 实时通信（WebRTC）」切到「🔒 隐私代理」。
ruleset=🛡️ 实时通信（WebRTC）,clash-classic:https://raw.githubusercontent.com/zhiwen1987/Jydn-openclash/refs/heads/main/rules/webrtc-client.yaml,86400

; 用户维护的代理补丁
ruleset=🚀 手动选择,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.yaml,10800
ruleset=🚀 手动选择,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,10800

; 明确可在中国大陆直连的服务子集
ruleset=DIRECT,[]GEOSITE,google-cn
ruleset=DIRECT,[]GEOSITE,apple-cn
ruleset=DIRECT,[]GEOSITE,microsoft@cn
ruleset=DIRECT,[]GEOSITE,steam@cn
ruleset=⬇️ 游戏下载,[]GEOSITE,category-game-platforms-download
ruleset=DIRECT,[]GEOSITE,category-games@cn
ruleset=DIRECT,[]GEOSITE,category-public-tracker

; 银行、政务公共服务和国内网盘优先直连。
; category-bank-cn 为银行专类；geolocation-cn 补齐非 gov.cn 政务及其他中国站点；
; aliyun-drive / 115 进入网盘组；百度网盘由自维护域名先命中，其他百度服务继续直连。
ruleset=DIRECT,[]GEOSITE,category-bank-cn
ruleset=DIRECT,[]GEOSITE,aliyun-drive
ruleset=DIRECT,[]GEOSITE,115

; >>> custom rules injection point <<<
; >>> generated custom rules start <<<
; 这里放你自己新增的分流规则。
; ruleset= 后的目标名称必须与策略组名称完全一致。

; 自定义规则始终排在通用国内/海外兜底之前。
; AMD 开发者站显式直连，避免诊断或后续分类调整改变其出口。
ruleset=DIRECT,[]DOMAIN,developer.amd.com.cn

; 所有 .cn 顶级域名显式直连，避免被海外分类或后续规则误代理。
ruleset=DIRECT,[]DOMAIN-SUFFIX,cn

; 节点出口校验域名必须最先进入专用校验组。
ruleset=🔬 节点归属校验,clash-domain:https://raw.githubusercontent.com/zhiwen1987/Jydn-openclash/refs/heads/main/rules/node-geo-check.yaml,86400

; 系统联网状态、门户检测和对时：用 classical 集合精确表达域名、后缀、关键字、通配符和正则。
ruleset=🌐 联网检测,clash-classic:https://raw.githubusercontent.com/zhiwen1987/Jydn-openclash/refs/heads/main/rules/connectivity-check.yaml,86400

; 国内重点服务规则精确命中后统一 DIRECT；策略组保留用于面板人工切换，不再作为规则目标。
ruleset=DIRECT,clash-domain:https://raw.githubusercontent.com/zhiwen1987/Jydn-openclash/refs/heads/main/rules/bank-cn.yaml,86400
ruleset=DIRECT,clash-domain:https://raw.githubusercontent.com/zhiwen1987/Jydn-openclash/refs/heads/main/rules/government-cn.yaml,86400
ruleset=DIRECT,clash-domain:https://raw.githubusercontent.com/zhiwen1987/Jydn-openclash/refs/heads/main/rules/securities-cn.yaml,86400
ruleset=DIRECT,clash-domain:https://raw.githubusercontent.com/zhiwen1987/Jydn-openclash/refs/heads/main/rules/cloud-drive-cn.yaml,86400
ruleset=DIRECT,clash-domain:https://raw.githubusercontent.com/zhiwen1987/Jydn-openclash/refs/heads/main/rules/music-cn.yaml,86400

; 用户维护的专用分流。
ruleset=🌍 境外网站,clash-domain:https://raw.githubusercontent.com/zhiwen1987/Jydn-openclash/refs/heads/main/rules/mygw.yaml,1800
ruleset=🇸🇬 指定新加坡,clash-domain:https://raw.githubusercontent.com/zhiwen1987/Jydn-openclash/refs/heads/main/rules/singapore.yaml,86400

; muse.ai 为 Meta 产品（解析到 star.c10r.facebook.com / Meta ASN），强制走美国节点。
ruleset=🇺🇸 指定美国,[]DOMAIN-SUFFIX,muse.ai

; 最后的自定义直连补丁仍作为分类规则的安全补充。
ruleset=DIRECT,clash-domain:https://raw.githubusercontent.com/zhiwen1987/Jydn-openclash/refs/heads/main/rules/direct.yaml,1800

; 开发生态补充规则在 upstream 模板中位于 GitHub/GitLab/Docker/NPM 专类之后。
; <<< generated custom rules end <<<

; 自定义国内分类处理完后，再用完整中国域名集直连兜底。
ruleset=DIRECT,[]GEOSITE,baidu
ruleset=DIRECT,[]GEOSITE,geolocation-cn

; AI 与云端办公：品牌规则在前，通用分类在后。
ruleset=📦 笔记协作（Notion）,[]GEOSITE,notion
ruleset=🤖 对话助手（ChatGPT）,[]GEOSITE,openai
ruleset=🟠 对话助手（Claude）,[]DOMAIN-SUFFIX,claude.ai
ruleset=🟠 对话助手（Claude）,[]DOMAIN-SUFFIX,claude.com
ruleset=🟠 对话助手（Claude）,[]DOMAIN-SUFFIX,anthropic.com
ruleset=🔵 对话助手（Gemini）,[]DOMAIN,gemini.google.com
ruleset=🔵 对话助手（Gemini）,[]DOMAIN,ai.google.dev
ruleset=🔵 对话助手（Gemini）,[]DOMAIN,generativelanguage.googleapis.com
ruleset=⚫ 对话助手（Grok）,[]DOMAIN-SUFFIX,grok.com
ruleset=⚫ 对话助手（Grok）,[]DOMAIN-SUFFIX,x.ai
ruleset=🔎 智能搜索（Perplexity）,[]DOMAIN-SUFFIX,perplexity.ai
ruleset=🔎 智能搜索（Perplexity）,[]DOMAIN-SUFFIX,pplx.ai
ruleset=🪟 办公助手（Microsoft Copilot）,[]DOMAIN,copilot.cloud.microsoft
ruleset=🪟 办公助手（Microsoft Copilot）,[]DOMAIN,copilot.microsoft.com
ruleset=🧑‍💻 编程助手（GitHub Copilot）,[]DOMAIN-SUFFIX,githubcopilot.com
ruleset=🧑‍💻 编程助手（GitHub Copilot）,[]DOMAIN,copilot-proxy.githubusercontent.com
ruleset=🧑‍💻 编程助手（GitHub Copilot）,[]DOMAIN,origin-tracker.githubusercontent.com
ruleset=🧠 人工智能,[]GEOSITE,category-ai-!cn

; 即时通讯：品牌可单独选路，未列出的通讯应用进入通用组。
ruleset=📨 电报通讯（Telegram）,[]GEOSITE,telegram
ruleset=📨 电报通讯（Telegram）,clash-classic:https://raw.githubusercontent.com/zhiwen1987/Jydn-openclash/refs/heads/main/rules/telegram-ip-asn.yaml,86400
ruleset=📨 电报通讯（Telegram）,[]GEOIP,telegram,no-resolve
ruleset=💬 聊天社区（Discord）,[]GEOSITE,discord
ruleset=🟢 通讯工具（WhatsApp）,[]GEOSITE,whatsapp
ruleset=🔐 安全通信（Signal）,[]GEOSITE,signal
ruleset=🟩 通讯工具（LINE）,[]GEOSITE,line
ruleset=📞 即时通讯,[]GEOSITE,category-communication

; 社交平台：具体品牌优先于通用海外社交分类。
ruleset=📸 图片社交（Instagram）,[]GEOSITE,instagram
ruleset=🐦 社交平台（X）,[]GEOSITE,twitter
ruleset=🐦 社交平台（X）,[]GEOIP,twitter,no-resolve
ruleset=👥 社交平台（Facebook）,[]GEOSITE,facebook
ruleset=🗨️ 社区论坛（Reddit）,[]GEOSITE,reddit
; Meta 各业务共享 ASN，IP-only 流量无法再区分 Facebook/Instagram/WhatsApp。
ruleset=🌐 Meta 平台,clash-classic:https://raw.githubusercontent.com/zhiwen1987/Jydn-openclash/refs/heads/main/rules/meta-ip-asn.yaml,86400
ruleset=💬 社交平台,[]GEOSITE,category-social-media-!cn

; 海外影音：保留品牌级选区，其他娱乐服务进入通用影音组。
ruleset=🎬 视频平台（YouTube）,[]GEOSITE,youtube
ruleset=🎥 流媒体（Netflix）,[]GEOSITE,netflix
ruleset=🎥 流媒体（Netflix）,clash-classic:https://raw.githubusercontent.com/zhiwen1987/Jydn-openclash/refs/heads/main/rules/netflix-ip-asn.yaml,86400
ruleset=🎥 流媒体（Netflix）,[]GEOIP,netflix,no-resolve
ruleset=🎵 短视频（TikTok）,[]GEOSITE,tiktok
ruleset=🏰 流媒体（Disney+）,[]GEOSITE,disney
ruleset=📺 流媒体（HBO）,[]GEOSITE,hbo
ruleset=📦 流媒体（Prime Video）,[]GEOSITE,primevideo
