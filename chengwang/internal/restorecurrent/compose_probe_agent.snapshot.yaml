name: ${M2B_PROBE_PROJECT_NAME:?set an isolated candidate project name}

services:
  probe-agent:
    profiles:
      - active-probe-candidate
    build:
      context: ../..
      dockerfile: deploy/m2b-candidate/Dockerfile.probe-agent
    image: chengwang-m2b-probe-agent:${M2B_PROBE_RELEASE_ID:?set a traceable candidate release id}
    entrypoint:
      - /app/probe-agent-entrypoint.sh
    restart: "no"
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 20s
    user: "10001:10001"
    read_only: true
    privileged: false
    stdin_open: false
    tty: false
    environment:
      TZ: UTC
      M2B_PROBE_ACTIVE_APPROVAL: ${M2B_PROBE_ACTIVE_APPROVAL:?candidate approval must be explicit}
      M2B_PROBE_DOT_UPSTREAM: ${M2B_PROBE_DOT_UPSTREAM:?fixed DoT IP and port are required}
      M2B_PROBE_DOT_SERVER_NAME: ${M2B_PROBE_DOT_SERVER_NAME:?DoT TLS server name is required}
      M2B_PROBE_EXPECTED_CATALOG_SHA256: ${M2B_PROBE_CATALOG_SHA256:?catalog SHA-256 is required}
      M2B_PROBE_EXPECTED_DOT_CA_SHA256: ${M2B_PROBE_DOT_CA_SHA256:?DoT CA SHA-256 is required}
      M2B_PROBE_EXPECTED_EGRESS_POLICY_SHA256: ${M2B_PROBE_EGRESS_POLICY_SHA256:?egress policy SHA-256 is required}
    command:
      - /app/probe-agent
      - --catalog
      - /run/chengwang-probe/catalog.json
      - --spool-dir
      - /var/lib/chengwang-probe/results
      - --ledger-dir
      - /var/lib/chengwang-probe/ledger
      - --dot-upstream
      - ${M2B_PROBE_DOT_UPSTREAM:?fixed DoT IP and port are required}
      - --dot-server-name
      - ${M2B_PROBE_DOT_SERVER_NAME:?DoT TLS server name is required}
      - --dot-ca
      - /run/chengwang-probe/dot-ca.pem
      - --health-file
      - /run/m2b-probe-health/health.json
      - --resolver-timeout
      - 5s
      - --runner-timeout
      - 10s
      - --concurrency
      - "2"
      - --queue-size
      - "256"
      - --starts-per-minute
      - "20"
    volumes:
      - type: bind
        source: ${M2B_PROBE_CATALOG_FILE:?absolute catalog path is required}
        target: /run/chengwang-probe/catalog.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${M2B_PROBE_DOT_CA_FILE:?absolute DoT CA path is required}
        target: /run/chengwang-probe/dot-ca.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${M2B_PROBE_EGRESS_POLICY_FILE:?absolute egress policy path is required}
        target: /run/chengwang-probe/egress-policy.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${M2B_PROBE_SPOOL_DIR:?absolute probe spool path is required}
        target: /var/lib/chengwang-probe/results
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ${M2B_PROBE_LEDGER_DIR:?absolute probe ledger path is required}
        target: /var/lib/chengwang-probe/ledger
        read_only: false
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=4m,mode=1777,nosuid,nodev,noexec
      - /run/m2b-probe-health:size=1m,mode=0700,uid=10001,gid=10001,nosuid,nodev,noexec
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 96m
    mem_reservation: 48m
    cpus: 0.25
    ulimits:
      nofile:
        soft: 256
        hard: 256
    networks:
      - m2b_probe_quarantine
    healthcheck:
      test: ["CMD", "/app/probe-agent", "health", "--health-file", "/run/m2b-probe-health/health.json", "--catalog", "/run/chengwang-probe/catalog.json", "--max-age", "20s"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"
    labels:
      com.jydn.chengwang.component: m2b-probe-agent-candidate
      com.jydn.chengwang.active-probes: "true"
      com.jydn.chengwang.advisory-only: "true"
      com.jydn.chengwang.egress-approved: "false"

networks:
  m2b_probe_quarantine:
    driver: bridge
    internal: true
    attachable: false
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
