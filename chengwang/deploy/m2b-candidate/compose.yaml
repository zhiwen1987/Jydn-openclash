name: chengwang-m2b-${M2B_INSTANCE_ID:-local}-candidate

services:
  candidate-guard:
    build:
      context: ../..
      dockerfile: deploy/m2b-candidate/Dockerfile
    image: chengwang-m2b-candidate-guard:${M2B_RELEASE_ID:-local}
    restart: "no"
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 20s
    user: "10001:10001"
    read_only: true
    privileged: false
    stdin_open: false
    tty: false
    environment:
      TZ: UTC
    volumes:
      - type: bind
        source: ${M2B_CATALOG_FILE:-./catalog.example.json}
        target: /run/chengwang-probe/catalog.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${M2B_SPOOL_DIR:-./runtime/spool}
        target: /var/lib/chengwang-probe
        read_only: false
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=4m,mode=1777,nosuid,nodev,noexec
      - /run/m2b:size=1m,mode=0700,uid=10001,gid=10001,nosuid,nodev,noexec
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 64m
    mem_reservation: 32m
    cpus: 0.25
    ulimits:
      nofile:
        soft: 256
        hard: 256
    networks:
      - m2b_quarantine
    healthcheck:
      test: ["CMD", "/app/m2b-candidate-guard", "health", "--health-file", "/run/m2b/health.json", "--max-age", "20s"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"
    labels:
      com.jydn.chengwang.component: m2b-candidate-guard
      com.jydn.chengwang.active-probes: "false"
      com.jydn.chengwang.advisory-only: "true"

networks:
  m2b_quarantine:
    driver: bridge
    internal: true
    attachable: false
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
