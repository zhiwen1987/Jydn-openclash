; 这里放你自己新增的分流规则。
; 写法参考：
; ruleset= 应用名,[]GEOSITE,规则名
; ruleset= 应用名,clash-domain:https://example.com/domain.yaml,10800
; ruleset= 应用名,clash-classic:https://example.com/classical.yaml,10800

; 示例：如果以后想单独管理 Discord，可以取消下面这一行注释
; ruleset= Discord,[]GEOSITE,discord

; 示例：如果某个网站没有 GEOSITE，可自己维护一个 yaml
ruleset=走国外,clash-domain:https://raw.githubusercontent.com/zhiwen1987/Jydn-openclash/refs/heads/main/rules/mygw.yaml,1800
; 你的自定义规则
ruleset=DIRECT,clash-domain:https://raw.githubusercontent.com/zhiwen1987/Jydn-openclash/refs/heads/main/rules/direct.yaml,1800
ruleset=访问新加坡,clash-domain:https://raw.githubusercontent.com/zhiwen1987/Jydn-openclash/refs/heads/main/rules/singapore.yaml,86400
ruleset=🧑‍💻 开发服务,clash-domain:https://raw.githubusercontent.com/zhiwen1987/Jydn-openclash/refs/heads/main/rules/development.yaml,86400
