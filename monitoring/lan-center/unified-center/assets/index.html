<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4f7fb">
  <meta name="description" content="进源Clash Center 统一管理面板，提供业务分流、节点检测、订阅同步、本地自建订阅、DNS、监控和备份状态。">
  <title>进源Clash Center</title>
  <link rel="icon" type="image/png" href="/center-assets/logo.png">
  <link rel="stylesheet" href="/center-assets/app.css">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>

  <svg class="svg-sprite" aria-hidden="true" focusable="false">
    <symbol id="i-overview" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M5.5 10v9h13v-9M9.5 19v-5h5v5"/></symbol>
    <symbol id="i-routing" viewBox="0 0 24 24"><path d="M6 5.5h8a3 3 0 0 1 3 3v7M14 12l3.5 3.5L21 12M10 18.5H6a3 3 0 0 1-3-3v-7M6.5 12 3 8.5 6.5 5"/></symbol>
    <symbol id="i-nodes" viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="7.5" ry="3"/><path d="M4.5 5.5v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6M4.5 11.5v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/></symbol>
    <symbol id="i-sync" viewBox="0 0 24 24"><path d="M20 7h-5V2M4 17h5v5M19 8a8 8 0 0 0-13.7-2.3L4 7M5 16a8 8 0 0 0 13.7 2.3L20 17"/></symbol>
    <symbol id="i-dns" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.3 2.4 3.5 5.2 3.5 8.5s-1.2 6.1-3.5 8.5M12 3.5C9.7 5.9 8.5 8.7 8.5 12s1.2 6.1 3.5 8.5"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><path d="M4 4.5h16v13H4zM8 21h8M12 17.5V21M7 12l2-2 2 2 4-5 2 2"/></symbol>
    <symbol id="i-backup" viewBox="0 0 24 24"><path d="M4 5.5h16v14H4zM8 5.5v5h8v-5M8 19.5v-5h8v5"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M6 3.5h9l3 3v14H6zM15 3.5v4h4M9 12h6M9 16h6M9 8h2"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7h-5V2M19.1 8A8 8 0 1 0 20 14"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.6-4 3-6 7-6s6.4 2 7 6"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M13 5h6v6M19 5l-8 8M18 14v5H5V6h5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7.5 10.5 12 15l4.5-4.5M5 20h14"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2.7 20h18.6zM12 9v5M12 17.5v.2"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v.2"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
    <symbol id="i-empty" viewBox="0 0 24 24"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5zM4 7.5l8 4.5 8-4.5M12 12v9"/></symbol>
  </svg>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <a class="brand" href="#/overview" aria-label="进源Clash Center">
        <img class="brand-logo" src="/center-assets/logo.png" alt="">
        <span class="brand-text" aria-hidden="true"><span>进源</span><span>Clash Center</span></span>
      </a>
      <nav class="primary-nav" id="primary-nav">
        <a href="#/overview" data-page="overview"><svg><use href="#i-overview"/></svg><span>总览</span></a>
        <a href="#/routing" data-page="routing"><svg><use href="#i-routing"/></svg><span>业务分流</span></a>
        <a href="#/nodes" data-page="nodes"><svg><use href="#i-nodes"/></svg><span>节点管理</span></a>
        <a href="#/subscriptions" data-page="subscriptions"><svg><use href="#i-sync"/></svg><span>订阅与同步</span></a>
        <a href="#/dns" data-page="dns"><svg><use href="#i-dns"/></svg><span>DNS</span></a>
        <a href="#/monitors" data-page="monitors"><svg><use href="#i-monitor"/></svg><span>业务监控</span></a>
        <a href="#/backups" data-page="backups"><svg><use href="#i-backup"/></svg><span>备份与恢复</span></a>
        <a href="#/activity" data-page="activity"><svg><use href="#i-activity"/></svg><span>操作记录</span></a>
      </nav>
      <div class="sidebar-foot">
        <span class="sidebar-foot-mark"><svg><use href="#i-lock"/></svg></span>
        <span>统一管理入口</span>
      </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

    <div class="workspace">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="mobile-menu" type="button" aria-label="打开导航" aria-controls="sidebar" aria-expanded="false">
          <svg><use href="#i-menu"/></svg>
        </button>
        <div class="breadcrumb" aria-label="面包屑">
          <svg><use href="#i-overview"/></svg>
          <svg class="breadcrumb-chevron"><use href="#i-chevron"/></svg>
          <span id="breadcrumb-label">总览</span>
        </div>
        <div class="topbar-actions">
          <span class="updated-at" id="updated-at">尚未获取数据</span>
          <button class="button button-secondary" id="refresh-button" type="button">
            <svg><use href="#i-refresh"/></svg><span>刷新</span>
          </button>
          <button class="button button-secondary" id="session-button" type="button">
            <svg><use href="#i-user"/></svg><span>管理登录</span>
          </button>
        </div>
      </header>

      <main id="main-content" tabindex="-1">
        <div class="page-loading" id="page-loading" role="status">
          <span class="spinner" aria-hidden="true"></span>
          <span>正在读取中心实时状态…</span>
        </div>
      </main>
    </div>
  </div>

  <dialog class="login-dialog" id="login-dialog" aria-labelledby="login-title">
    <form method="dialog" class="dialog-close-form">
      <button class="icon-button" type="submit" aria-label="关闭登录窗口"><svg><use href="#i-close"/></svg></button>
    </form>
    <form id="login-form">
      <div class="dialog-icon"><svg><use href="#i-lock"/></svg></div>
      <h2 id="login-title">解锁管理操作</h2>
      <p>用于路由选择、节点测速和备份。密钥仅用于本次登录请求，不会写入页面存储。</p>
      <label for="admin-token">管理密钥</label>
      <input id="admin-token" name="token" type="password" autocomplete="off" required>
      <p class="form-error" id="login-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button class="button button-secondary" type="button" id="login-cancel">取消</button>
        <button class="button button-primary" type="submit" id="login-submit">登录</button>
      </div>
    </form>
  </dialog>

  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="/center-assets/app.js" defer></script>
</body>
</html>
