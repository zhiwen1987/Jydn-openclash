name: lan-center

services:
  failover:
    build: ./failover
    image: lan-center-failover:4
    restart: unless-stopped
    env_file: .env
    environment:
      DRY_RUN: "1"
      OPENCLASH_API: "http://10.88.0.254:9090"
      CHATGPT_CONTROL_INTERVAL: "300"
      CHATGPT_PASS_THRESHOLD: "2"
      CHATGPT_MAX_CANDIDATE_TRIALS: "5"
      CHATGPT_REJECT_COOLDOWN: "3600"
      CAPABILITY_ENABLED: "1"
      CAPABILITY_MODE: "shadow"
      CAPABILITY_GROUP: "🧪 节点能力检测"
      CAPABILITY_PROXY: "http://10.88.0.254:7895"
      CAPABILITY_PROXY_AUTH: "${CAPABILITY_PROXY_AUTH}"
      CAPABILITY_NODE_INTERVAL: "10"
      CAPABILITY_DISCOVERY_INTERVAL: "600"
      CAPABILITY_BUSINESS_RECHECK: "21600"
      CAPABILITY_HEALTHY_RECHECK: "900"
      CAPABILITY_UNHEALTHY_RECHECK: "300"
      CAPABILITY_STALE_MULTIPLIER: "2"
      ROUTE_AUDIT_INTERVAL: "300"
      CAPABILITY_GENERAL_ATTEMPTS: "2"
    volumes:
      - ./data/failover:/data
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    expose:
      - "8080"
      - "8081"
    ports:
      - "10.88.0.249:3102:8081"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  uptime-kuma:
    image: louislam/uptime-kuma@sha256:9912da7d7d9b6ddc0c2d904beb84d24689c1ed9c33b81419eb9008663a92a329
    restart: unless-stopped
    depends_on:
      failover:
        condition: service_healthy
    environment:
      NODE_OPTIONS: "--max-http-header-size=65536"
    ports:
      - "3101:3001"
    volumes:
      - ./data/uptime-kuma:/app/data
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
