# OpenClash v0.47.156 覆写模块（不是完整的 Mihomo 配置文件）
# 使用位置：服务 → OpenClash → 运行状态 → 覆写模块 → 新增/编辑模块。
# 整份粘贴；不要粘到订阅 YAML，也不要再启用“覆写设置 → DNS 设置 → 自定义 DNS”。

[YAML]
ipv6: false
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

# 为转换后的 Smart 组补充健康检查参数和 100 ms 防抖容差。
# 失败阈值从 Mihomo 默认 5 降为 2，并要求探测端点返回 HTTP 204。
<proxy-groups>*:
  where:
    type: smart
  set:
    interval: 120
    tolerance: 100
    timeout: 5000
    max-failed-times: 2
    expected-status: 204

# 合并 OpenClash 已生成的 tun 块，只改严格路由与 53 端口劫持。
# strict-route 若造成 Docker、虚拟机或旁路网关异常，改为 false 后测试。
tun:
  strict-route: true
  dns-hijack!:
    - any:53
    - tcp://any:53

# OpenClash 覆写模块的 ! 操作符：强制替换整个 dns 值，不与原 dns 合并。
<dns>!:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  cache-algorithm: arc
  prefer-h3: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  # 只有局域网与系统联网检测使用真实 IP；其他查询使用 Fake-IP。
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - GEOSITE,private,real-ip
    - DOMAIN,localhost,real-ip
    - DOMAIN-SUFFIX,lan,real-ip
    - DOMAIN-SUFFIX,local,real-ip
    - DOMAIN-SUFFIX,msftconnecttest.com,real-ip
    - DOMAIN-SUFFIX,msftncsi.com,real-ip
    - DOMAIN,captive.apple.com,real-ip
    - DOMAIN,connectivitycheck.gstatic.com,real-ip
    - MATCH,fake-ip

  # 仅用于解析 DoH/节点服务器域名，避免建立代理前出现解析死循环。
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 公共 DNS 查询经“🔒 隐私代理”访问境外加密 DNS。
  nameserver:
    - "https://1.1.1.1/dns-query#🔒 隐私代理"
    - "https://8.8.8.8/dns-query#🔒 隐私代理"

  # 节点服务器域名建立代理前用境内 DoH 直连解析。
  proxy-server-nameserver:
    - "https://223.5.5.5/dns-query#DIRECT"
    - "https://120.53.53.53/dns-query#DIRECT"

  # DIRECT 域名重新使用境内 DNS，改善中国大陆 CDN 命中。
  direct-nameserver:
    - "https://223.5.5.5/dns-query#DIRECT"
    - "https://120.53.53.53/dns-query#DIRECT"
  direct-nameserver-follow-policy: false

  # 刻意不配置 fallback，避免国内外 DNS 并发查询和结果混用。

<sniffer>!:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
