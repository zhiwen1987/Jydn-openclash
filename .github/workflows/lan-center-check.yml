name: lan-center Check

on:
  pull_request:
    paths:
      - ".github/workflows/lan-center-check.yml"
      - "monitoring/lan-center/**"
      - "scripts/patch_node_capability_probe.rb"
      - "scripts/jydn_node_capability_hook.sh"
      - "scripts/install_node_capability_hook.rb"
  push:
    branches:
      - "codex/**"
      - main
    paths:
      - ".github/workflows/lan-center-check.yml"
      - "monitoring/lan-center/**"
      - "scripts/patch_node_capability_probe.rb"
      - "scripts/jydn_node_capability_hook.sh"
      - "scripts/install_node_capability_hook.rb"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install validators
        run: sudo apt-get update && sudo apt-get install -y ruby shellcheck sqlite3 python3-yaml

      - name: Check shell syntax
        run: sh -n monitoring/lan-center/failover/*.sh monitoring/lan-center/tests/*.sh

      - name: Run ShellCheck
        run: shellcheck monitoring/lan-center/failover/*.sh monitoring/lan-center/tests/*.sh scripts/jydn_node_capability_hook.sh

      - name: Test node capability evaluator
        run: python3 monitoring/lan-center/failover/node-capability.py --self-test

      - name: Test subscription release controller
        run: python3 monitoring/lan-center/failover/subscription-controller.py --self-test

      - name: Test independent local subscription transactions and URI parsing
        run: python3 monitoring/lan-center/local-subscription/test_local_source.py

      - name: Test isolated OpenClash probe patch
        run: sh monitoring/lan-center/tests/test_node_capability_patch.sh

      - name: Test idempotent database migration
        run: sh monitoring/lan-center/tests/test_migration.sh

      - name: Validate Compose
        working-directory: monitoring/lan-center
        run: |
          cat > .env <<'EOF'
          IKUAI_URL=http://10.88.0.1
          IKUAI_TOKEN=ci-placeholder
          PROXY_AUTH=ci-placeholder
          OPENCLASH_SECRET=ci-placeholder
          CAPABILITY_PROXY_AUTH=ci-placeholder
          SUBSCRIPTION_PUBLISH_TOKEN=ci-placeholder-at-least-24-characters
          SUBSCRIPTION_HMAC_KEY=ci-hmac-placeholder-at-least-24-characters
          EOF
          docker compose config --quiet
