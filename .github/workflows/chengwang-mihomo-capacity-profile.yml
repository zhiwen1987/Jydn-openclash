name: Chengwang Isolated Capacity CPU Diagnosis

on:
  workflow_dispatch:
  push:
    branches: [codex/chengwang-mihomo-lifecycle-20261024, codex/chengwang-unified-20261102]

permissions:
  contents: read

concurrency:
  group: chengwang-capacity-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  development-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the fixed isolated development branch
        env:
          REQUEST_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REQUEST_REF" = refs/heads/codex/chengwang-mihomo-lifecycle-20261024 ||
            test "$REQUEST_REF" = refs/heads/codex/chengwang-unified-20261102

  profile-contract-models:
    needs: development-only
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify the independent formatter source contract
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          set -euo pipefail
          cd chengwang/deploy/mihomo-capacity-profile
          python3 -B -m unittest -v test_profile_contract

  profile:
    needs: [development-only, profile-contract-models]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: 1.23.12
          cache: false
      - name: Preserve original host and immutable source bindings
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mihomo-capacity-profile-public"
          test ! -e "$root"
          install -d -m 0755 "$root"
          helper=chengwang/deploy/mihomo-capacity-profile/check_profile.py
          python3 -B "$helper" host --out "$root/host-before.json"
          python3 -B "$helper" source --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" --out "$root/source-before.json"
      - name: Diagnose the unchanged original race case in a private offline namespace
        run: |
          set -euo pipefail
          go_exe="$(command -v go)"
          go_root="$(dirname "$(dirname "$(readlink -f "$go_exe")")")"
          # This outer600s contains compilation and local pprof too. It does
          # not replace/extend the original test's own unchanged180s timeout.
          # Namespace init exit kills every descendant; no numeric PID adopt.
          timeout --signal=TERM --kill-after=15s 600s \
            sudo unshare --net --mount --pid --fork --mount-proc --kill-child=SIGKILL \
            bash "$GITHUB_WORKSPACE/chengwang/deploy/mihomo-capacity-profile/run_profile.sh" \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/mihomo-capacity-profile-public" "$go_root" "$GITHUB_SHA"
      - name: Observe host after attempt and independently verify diagnostic originals
        id: single_verify
        if: ${{ always() }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mihomo-capacity-profile-public"
          test -d "$root"
          helper=chengwang/deploy/mihomo-capacity-profile/check_profile.py
          python3 -B "$helper" host --out "$root/host-after.json"
          python3 -B "$helper" source --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" --out "$root/source-after.json"
          safe_dir="$RUNNER_TEMP/mihomo-capacity-safe-rejection-single"
          test ! -e "$safe_dir"
          install -d -m 0755 "$safe_dir"
          safe_report="$safe_dir/capacity-single-safe-rejection.json"
          verify_code=0
          python3 -B "$helper" verify --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" \
            --evidence "$root" --report "$RUNNER_TEMP/mihomo-capacity-profile-verification.json" \
            --safe-rejection-report "$safe_report" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" || verify_code=$?
          if test "$verify_code" -ne 0 && test -f "$safe_report"; then
            safe_check_code=0
            python3 -B "$helper" safe-rejection-check --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" \
              --safe-rejection-report "$safe_report" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --lane SINGLE_CASE || safe_check_code=$?
            if test "$safe_check_code" -eq 0; then
              printf '%s\n' 'safe_rejection_ready=true' >> "$GITHUB_OUTPUT"
            fi
          fi
          exit "$verify_code"
      - name: Preserve actual diagnostic originals even when the original test fails
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mihomo-capacity-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mihomo-capacity-profile-public/host-before.json
            ${{ runner.temp }}/mihomo-capacity-profile-public/host-after.json
            ${{ runner.temp }}/mihomo-capacity-profile-public/source-before.json
            ${{ runner.temp }}/mihomo-capacity-profile-public/source-after.json
            ${{ runner.temp }}/mihomo-capacity-profile-public/sandbox.json
            ${{ runner.temp }}/mihomo-capacity-profile-public/go-version.txt
            ${{ runner.temp }}/mihomo-capacity-profile-public/gofmt.patch
            ${{ runner.temp }}/mihomo-capacity-profile-public/gofmt.stderr
            ${{ runner.temp }}/mihomo-capacity-profile-public/capacity.json
            ${{ runner.temp }}/mihomo-capacity-profile-public/capacity.stderr
            ${{ runner.temp }}/mihomo-capacity-profile-public/commands.jsonl
            ${{ runner.temp }}/mihomo-capacity-profile-public/execution.json
            ${{ runner.temp }}/mihomo-capacity-profile-public/profile-state.json
            ${{ runner.temp }}/mihomo-capacity-profile-public/cpu-profile.json
            ${{ runner.temp }}/mihomo-capacity-profile-public/pprof-top.txt
            ${{ runner.temp }}/mihomo-capacity-profile-public/pprof-top.stderr
            ${{ runner.temp }}/mihomo-capacity-profile-public/pprof-cum.txt
            ${{ runner.temp }}/mihomo-capacity-profile-public/pprof-cum.stderr
            ${{ runner.temp }}/mihomo-capacity-profile-verification.json
          retention-days: 14
          if-no-files-found: error
      - name: Preserve only the independently checked SINGLE rejection summary
        if: ${{ always() && steps.single_verify.outputs.safe_rejection_ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mihomo-capacity-safe-rejection-single-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mihomo-capacity-safe-rejection-single/capacity-single-safe-rejection.json
          retention-days: 14
          if-no-files-found: error

  profile-fresh:
    needs: [development-only, profile]
    if: ${{ !cancelled() && needs.development-only.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mihomo-capacity-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/capacity-originals
      - name: Reconstruct profile bytes and exact case result without executing Go
        run: |
          set -euo pipefail
          safe_dir="$RUNNER_TEMP/mihomo-capacity-safe-rejection-single-fresh"
          test ! -e "$safe_dir"
          install -d -m 0755 "$safe_dir"
          safe_report="$safe_dir/capacity-single-safe-rejection.json"
          verify_code=0
          python3 -B chengwang/deploy/mihomo-capacity-profile/check_profile.py verify \
            --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" \
            --evidence "$RUNNER_TEMP/capacity-originals/mihomo-capacity-profile-public" \
            --report "$RUNNER_TEMP/mihomo-capacity-profile-fresh.json" \
            --safe-rejection-report "$safe_report" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" || verify_code=$?
          if test "$verify_code" -ne 0; then
            if test -f "$safe_report"; then
              safe_check_code=0
              python3 -B chengwang/deploy/mihomo-capacity-profile/check_profile.py safe-rejection-check \
                --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" --safe-rejection-report "$safe_report" \
                --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --lane SINGLE_CASE || safe_check_code=$?
            fi
            exit "$verify_code"
          fi
          cmp "$RUNNER_TEMP/capacity-originals/mihomo-capacity-profile-verification.json" \
            "$RUNNER_TEMP/mihomo-capacity-profile-fresh.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: mihomo-capacity-profile-fresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mihomo-capacity-profile-fresh.json
          retention-days: 14
          if-no-files-found: error

  full:
    needs: [development-only, profile-contract-models]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      timeline_ready: ${{ steps.go_timeline_check.outputs.timeline_ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: 1.23.12
          cache: false
      - name: Preserve full-diagnosis host and immutable source bindings
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mihomo-capacity-profile-full-public"
          test ! -e "$root"
          install -d -m 0755 "$root"
          helper=chengwang/deploy/mihomo-capacity-profile/check_profile.py
          python3 -B "$helper" host --out "$root/host-before.json"
          python3 -B "$helper" source --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" --out "$root/source-before.json"
      - name: Diagnose the unchanged six-package race command in private offline namespaces
        run: |
          set -euo pipefail
          go_exe="$(command -v go)"
          go_root="$(dirname "$(dirname "$(readlink -f "$go_exe")")")"
          # Go retains its original180s timeout. Only the fixed diagnostic tag
          # and ^Test filter are inserted; no package/order/concurrency change.
          # The120s CPU profile belongs solely to mihomodeploy, not all6pkgs.
          timeout --signal=TERM --kill-after=15s 600s \
            sudo unshare --net --mount --pid --fork --mount-proc --kill-child=SIGKILL \
            bash "$GITHUB_WORKSPACE/chengwang/deploy/mihomo-capacity-profile/run_profile.sh" \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/mihomo-capacity-profile-full-public" "$go_root" "$GITHUB_SHA" FULL_CONTRACTS
      - name: Independently decode full-suite partial or complete originals and resource observations
        id: full_verify
        if: ${{ always() }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mihomo-capacity-profile-full-public"
          test -d "$root"
          helper=chengwang/deploy/mihomo-capacity-profile/check_profile.py
          python3 -B "$helper" host --out "$root/host-after.json"
          python3 -B "$helper" source --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" --out "$root/source-after.json"
          safe_dir="$RUNNER_TEMP/mihomo-capacity-safe-rejection-full"
          test ! -e "$safe_dir"
          install -d -m 0755 "$safe_dir"
          safe_report="$safe_dir/capacity-full-safe-rejection.json"
          verify_code=0
          python3 -B "$helper" verify --diagnostic-mode FULL_CONTRACTS \
            --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" \
            --evidence "$root" --report "$RUNNER_TEMP/mihomo-capacity-profile-full-verification.json" \
            --safe-rejection-report "$safe_report" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" || verify_code=$?
          if test "$verify_code" -ne 0 && test -f "$safe_report"; then
            safe_check_code=0
            python3 -B "$helper" safe-rejection-check --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" \
              --safe-rejection-report "$safe_report" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --lane FULL_CONTRACTS || safe_check_code=$?
            if test "$safe_check_code" -eq 0; then
              printf '%s\n' 'safe_rejection_ready=true' >> "$GITHUB_OUTPUT"
            fi
          fi
          exit "$verify_code"
      - name: Independently validate the bounded capacity timeline
        id: go_timeline_check
        if: ${{ always() }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mihomo-capacity-profile-full-public"
          sudo python3 -B chengwang/deploy/mihomo-lifecycle-lab/check_go_timeline.py \
            --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" --evidence "$root" \
            --lane CAPACITY
          if ! printf '%s\n' 'timeline_ready=true' >> "$GITHUB_OUTPUT"; then
            exit 1
          fi
      - name: Keep an unaccepted full Go result failed even when diagnostic capture is valid
        if: ${{ always() }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/mihomo-capacity-profile-full-verification.json" <<'PY'
          import json,sys
          from pathlib import Path
          v=json.loads(Path(sys.argv[1]).read_bytes())
          assert v['diagnosticMode']=='FULL_CONTRACTS' and v['captureVerified'] is True
          assert v['fullGoAccepted'] is True
          PY
      - name: Preserve original full-suite diagnostics including failed test outcomes
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mihomo-capacity-profile-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mihomo-capacity-profile-full-public/host-before.json
            ${{ runner.temp }}/mihomo-capacity-profile-full-public/host-after.json
            ${{ runner.temp }}/mihomo-capacity-profile-full-public/source-before.json
            ${{ runner.temp }}/mihomo-capacity-profile-full-public/source-after.json
            ${{ runner.temp }}/mihomo-capacity-profile-full-public/sandbox.json
            ${{ runner.temp }}/mihomo-capacity-profile-full-public/go-version.txt
            ${{ runner.temp }}/mihomo-capacity-profile-full-public/gofmt.patch
            ${{ runner.temp }}/mihomo-capacity-profile-full-public/gofmt.stderr
            ${{ runner.temp }}/mihomo-capacity-profile-full-public/capacity.json
            ${{ runner.temp }}/mihomo-capacity-profile-full-public/capacity.stderr
            ${{ runner.temp }}/mihomo-capacity-profile-full-public/commands.jsonl
            ${{ runner.temp }}/mihomo-capacity-profile-full-public/execution.json
            ${{ runner.temp }}/mihomo-capacity-profile-full-public/profile-state.json
            ${{ runner.temp }}/mihomo-capacity-profile-full-public/cpu-profile.json
            ${{ runner.temp }}/mihomo-capacity-profile-full-public/pprof-top.txt
            ${{ runner.temp }}/mihomo-capacity-profile-full-public/pprof-top.stderr
            ${{ runner.temp }}/mihomo-capacity-profile-full-public/pprof-cum.txt
            ${{ runner.temp }}/mihomo-capacity-profile-full-public/pprof-cum.stderr
            ${{ runner.temp }}/mihomo-capacity-profile-full-public/resource-before.json
            ${{ runner.temp }}/mihomo-capacity-profile-full-public/resource-after.json
            ${{ runner.temp }}/mihomo-capacity-profile-full-verification.json
          retention-days: 14
          if-no-files-found: error
      - name: Preserve only the independently checked FULL rejection summary
        if: ${{ always() && steps.full_verify.outputs.safe_rejection_ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mihomo-capacity-safe-rejection-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mihomo-capacity-safe-rejection-full/capacity-full-safe-rejection.json
          retention-days: 14
          if-no-files-found: error
      - name: Preserve only the independently checked bounded capacity timeline
        if: ${{ always() && steps.go_timeline_check.outcome == 'success' && steps.go_timeline_check.outputs.timeline_ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mihomo-capacity-go-timeline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mihomo-capacity-profile-full-public/timeline-public/capacity-go-top-observation-timeline.json
          retention-days: 14
          if-no-files-found: error

  full-fresh:
    needs: [development-only, full]
    if: ${{ !cancelled() && needs.development-only.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mihomo-capacity-profile-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/capacity-full-originals
      - name: Establish runner-owned fresh timeline custody
        if: ${{ needs.full.outputs.timeline_ready == 'true' }}
        run: |
          set -euo pipefail
          timeline_public="$RUNNER_TEMP/capacity-full-originals/mihomo-capacity-profile-full-public/timeline-public"
          test -d "$(dirname "$timeline_public")"
          test ! -e "$timeline_public"
          install -d -m 0755 "$timeline_public"
          test "$(stat -c %u "$timeline_public")" -eq "$(id -u)"
          test "$(stat -c %g "$timeline_public")" -eq "$(id -g)"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: ${{ needs.full.outputs.timeline_ready == 'true' }}
        with:
          name: mihomo-capacity-go-timeline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/capacity-full-originals/mihomo-capacity-profile-full-public/timeline-public
      - name: Reconstruct full-suite profile events and resources without executing Go
        run: |
          set -euo pipefail
          safe_dir="$RUNNER_TEMP/mihomo-capacity-safe-rejection-full-fresh"
          test ! -e "$safe_dir"
          install -d -m 0755 "$safe_dir"
          safe_report="$safe_dir/capacity-full-safe-rejection.json"
          verify_code=0
          python3 -B chengwang/deploy/mihomo-capacity-profile/check_profile.py verify \
            --diagnostic-mode FULL_CONTRACTS --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" \
            --evidence "$RUNNER_TEMP/capacity-full-originals/mihomo-capacity-profile-full-public" \
            --report "$RUNNER_TEMP/mihomo-capacity-profile-full-fresh.json" \
            --safe-rejection-report "$safe_report" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" || verify_code=$?
          if test "$verify_code" -ne 0; then
            if test -f "$safe_report"; then
              safe_check_code=0
              python3 -B chengwang/deploy/mihomo-capacity-profile/check_profile.py safe-rejection-check \
                --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" --safe-rejection-report "$safe_report" \
                --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --lane FULL_CONTRACTS || safe_check_code=$?
            fi
            exit "$verify_code"
          fi
          cmp "$RUNNER_TEMP/capacity-full-originals/mihomo-capacity-profile-full-verification.json" \
            "$RUNNER_TEMP/mihomo-capacity-profile-full-fresh.json"
          python3 -B chengwang/deploy/mihomo-lifecycle-lab/check_go_timeline.py \
            --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" \
            --evidence "$RUNNER_TEMP/capacity-full-originals/mihomo-capacity-profile-full-public" \
            --lane CAPACITY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: mihomo-capacity-profile-full-fresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mihomo-capacity-profile-full-fresh.json
          retention-days: 14
          if-no-files-found: error
