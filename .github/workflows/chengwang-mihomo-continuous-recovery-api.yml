# Isolated continuous Recovery API only; never production or private-WAL acceptance.
name: Chengwang Isolated Continuous Recovery API
'on':
  workflow_dispatch: null
  push:
    branches:
      - codex/chengwang-mihomo-lifecycle-20261024
permissions:
  contents: read
concurrency:
  group: chengwang-continuous-recovery-api-${{ github.ref }}
  cancel-in-progress: false
jobs:
  development-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Reject use outside the isolated development branch
        env:
          REQUEST_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REQUEST_REF" = refs/heads/codex/chengwang-mihomo-lifecycle-20261024
  source-models:
    needs: development-only
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run bounded producer and independent-reader models only
        run: |
          set -euo pipefail
          cd chengwang/deploy/mihomo-lifecycle-lab
          python3 -B -m unittest -v test_continuous_recovery_api_model
          git -C "$GITHUB_WORKSPACE" diff --exit-code
          test -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain=v1 --untracked-files=all)"
  continuous-fault-model:
    needs: [development-only, source-models]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: 1.23.12
          cache: false
      - name: Bind the exact run HEAD before the isolated fault MODEL
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/mihomo-continuous-fault-model"
          test ! -e "$out"
          install -d -m 0755 "$out"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git write-tree)" = "$(git rev-parse "$GITHUB_SHA^{tree}")"
          python3 -B chengwang/deploy/mihomo-lifecycle-lab/check_continuous_recovery_api.py \
            --source-manifest "$GITHUB_WORKSPACE" "$GITHUB_SHA" \
            "$RUNNER_TEMP/mihomo-continuous-fault-source-before.private.json" \
            > "$out/source-before.json"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Run only the exact-tag continuous fault MODEL top
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/mihomo-continuous-fault-model"
          cd chengwang
          code=0
          GOWORK=off GOENV=off GOTOOLCHAIN=local GOFLAGS=-mod=vendor GOPROXY=off GOSUMDB=off CGO_ENABLED=1 \
            /opt/hostedtoolcache/go/1.23.12/x64/bin/go test -json -count=1 -shuffle=off -p=1 \
              -tags linux,chengwang_mihomo_service,chengwang_mihomo_recovery_native,chengwang_mihomo_recovery_continuous_fault \
              -run '^TestLabContinuousRecoveryFaultZeroAndDebugRemainNonAuthorityMODEL$' -timeout=30s \
              ./internal/mihomodeploy > "$out/go-test.json" 2> "$out/go-test.stderr" || code=$?
          python3 - "$out/exit.json" "$code" "$GITHUB_SHA" <<'PY'
          import json,os,sys
          value={'schema':'chengwang.mihomo-continuous-fault-model-exit/v1','sourceCommit':sys.argv[3],
                 'exitCode':int(sys.argv[2]),'production':False}
          with open(sys.argv[1],'x') as f:
              json.dump(value,f,sort_keys=True,separators=(',',':'));f.write('\n');f.flush();os.fsync(f.fileno())
          PY
          test "$code" -eq 0
          python3 - "$out/go-test.json" "$out/verification.json" "$GITHUB_SHA" <<'PY'
          import json,os,sys
          target='TestLabContinuousRecoveryFaultZeroAndDebugRemainNonAuthorityMODEL'
          package='chengwang/internal/mihomodeploy'
          rows=[]
          with open(sys.argv[1],encoding='utf-8') as source:
              for line in source:
                  if line.strip(): rows.append(json.loads(line))
          relevant=[row for row in rows if row.get('Test')==target]
          assert sum(row.get('Action')=='run' for row in relevant)==1
          assert sum(row.get('Action')=='pass' for row in relevant)==1
          assert not any(row.get('Action') in ('fail','skip') for row in rows)
          assert all(row.get('Package')==package for row in rows)
          assert all(row.get('Test',target).split('/')[0]==target for row in rows)
          assert sum('Test' not in row and row.get('Action')=='pass' for row in rows)==1
          value={'schema':'chengwang.mihomo-continuous-fault-model-verification/v1','sourceCommit':sys.argv[3],
                 'package':package,'topTest':target,'runCount':1,'passCount':1,'production':False}
          with open(sys.argv[2],'x') as f:
              json.dump(value,f,sort_keys=True,separators=(',',':'));f.write('\n');f.flush();os.fsync(f.fileno())
          PY
      - name: Rebind the exact run HEAD and prove the MODEL left source unchanged
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/mihomo-continuous-fault-model"
          python3 -B chengwang/deploy/mihomo-lifecycle-lab/check_continuous_recovery_api.py \
            --source-manifest "$GITHUB_WORKSPACE" "$GITHUB_SHA" \
            "$RUNNER_TEMP/mihomo-continuous-fault-source-after.private.json" \
            > "$out/source-after.json"
          cmp "$RUNNER_TEMP/mihomo-continuous-fault-source-before.private.json" \
            "$RUNNER_TEMP/mihomo-continuous-fault-source-after.private.json"
          cmp "$out/source-before.json" "$out/source-after.json"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: mihomo-continuous-fault-model-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mihomo-continuous-fault-model/*
          if-no-files-found: error
          retention-days: 14
  continuous-bound-credentials-model:
    needs: [development-only, source-models]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: 1.23.12
          cache: false
      - name: Bind the exact run HEAD before bound-credential MODEL tests
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/mihomo-continuous-bound-credentials-model"
          test ! -e "$out"
          install -d -m 0755 "$out"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git write-tree)" = "$(git rev-parse "$GITHUB_SHA^{tree}")"
          python3 -B chengwang/deploy/mihomo-lifecycle-lab/check_continuous_recovery_api.py \
            --source-manifest "$GITHUB_WORKSPACE" "$GITHUB_SHA" \
            "$RUNNER_TEMP/mihomo-continuous-bound-credentials-source-before.private.json" \
            > "$out/source-before.json"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Run only the exact-tag bound-credential MODEL tops
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/mihomo-continuous-bound-credentials-model"
          cd chengwang
          authn_code=0
          runtime_code=0
          GOWORK=off GOENV=off GOTOOLCHAIN=local GOFLAGS=-mod=vendor GOPROXY=off GOSUMDB=off CGO_ENABLED=1 \
            /opt/hostedtoolcache/go/1.23.12/x64/bin/go test -json -count=1 -shuffle=off -p=1 \
              -tags linux,chengwang_mihomo_service,chengwang_mihomo_recovery_native,chengwang_mihomo_recovery_continuous_fault \
              -run '^TestContinuousRecoveryBoundCredentialsV2MODEL$' -timeout=30s \
              ./internal/authn > "$out/authn-go-test.json" 2> "$out/authn-go-test.stderr" || authn_code=$?
          GOWORK=off GOENV=off GOTOOLCHAIN=local GOFLAGS=-mod=vendor GOPROXY=off GOSUMDB=off CGO_ENABLED=1 \
            /opt/hostedtoolcache/go/1.23.12/x64/bin/go test -json -count=1 -shuffle=off -p=1 \
              -tags linux,chengwang_mihomo_service,chengwang_mihomo_recovery_native,chengwang_mihomo_recovery_continuous_fault \
              -run '^TestContinuousRecoveryBoundCredentialsSourceArmMODEL$' -timeout=30s \
              ./internal/serverruntime > "$out/runtime-go-test.json" 2> "$out/runtime-go-test.stderr" || runtime_code=$?
          python3 - "$out/exit.json" "$authn_code" "$runtime_code" "$GITHUB_SHA" <<'PY'
          import json,os,sys
          value={'schema':'chengwang.mihomo-continuous-bound-credentials-model-exit/v1','sourceCommit':sys.argv[4],
                 'authnExitCode':int(sys.argv[2]),'runtimeExitCode':int(sys.argv[3]),'production':False}
          with open(sys.argv[1],'x') as f:
              json.dump(value,f,sort_keys=True,separators=(',',':'));f.write('\n');f.flush();os.fsync(f.fileno())
          PY
          test "$authn_code" -eq 0
          test "$runtime_code" -eq 0
          python3 - "$out" "$GITHUB_SHA" <<'PY'
          import json,os,sys
          out=sys.argv[1]
          expected=(('authn-go-test.json','chengwang/internal/authn','TestContinuousRecoveryBoundCredentialsV2MODEL'),
                    ('runtime-go-test.json','chengwang/internal/serverruntime','TestContinuousRecoveryBoundCredentialsSourceArmMODEL'))
          verified=[]
          for name,package,target in expected:
              with open(os.path.join(out,name),encoding='utf-8') as source:
                  rows=[json.loads(line) for line in source if line.strip()]
              relevant=[row for row in rows if row.get('Test')==target]
              assert sum(row.get('Action')=='run' for row in relevant)==1
              assert sum(row.get('Action')=='pass' for row in relevant)==1
              assert not any(row.get('Action') in ('fail','skip') for row in rows)
              assert all(row.get('Package')==package for row in rows)
              assert all(row.get('Test',target).split('/')[0]==target for row in rows)
              assert sum('Test' not in row and row.get('Action')=='pass' for row in rows)==1
              verified.append({'package':package,'topTest':target,'runCount':1,'passCount':1})
          value={'schema':'chengwang.mihomo-continuous-bound-credentials-model-verification/v1',
                 'sourceCommit':sys.argv[2],'tests':verified,'production':False}
          with open(os.path.join(out,'verification.json'),'x') as f:
              json.dump(value,f,sort_keys=True,separators=(',',':'));f.write('\n');f.flush();os.fsync(f.fileno())
          PY
      - name: Rebind exact source after bound-credential MODEL tests
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/mihomo-continuous-bound-credentials-model"
          python3 -B chengwang/deploy/mihomo-lifecycle-lab/check_continuous_recovery_api.py \
            --source-manifest "$GITHUB_WORKSPACE" "$GITHUB_SHA" \
            "$RUNNER_TEMP/mihomo-continuous-bound-credentials-source-after.private.json" \
            > "$out/source-after.json"
          cmp "$RUNNER_TEMP/mihomo-continuous-bound-credentials-source-before.private.json" \
            "$RUNNER_TEMP/mihomo-continuous-bound-credentials-source-after.private.json"
          cmp "$out/source-before.json" "$out/source-after.json"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: mihomo-continuous-bound-credentials-model-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mihomo-continuous-bound-credentials-model/*
          if-no-files-found: error
          retention-days: 14
  acquisition:
    needs: development-only
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Consume only the pinned published candidate without executing it
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mihomo-continuous-recovery-acquisition-gate"
          test ! -e "$root"
          install -d -m 0700 "$root" "$root/public"
          curl --fail --silent --show-error --location --retry 0 --max-time 120 --max-filesize 67108864 \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-v1-v1.19.32.gz \
            -o "$root/candidate.gz" 2> "$root/public/acquisition.stderr"
          python3 -B chengwang/tools/mihomo-runtime-candidate/consume_pin.py --repo "$GITHUB_WORKSPACE" \
            --source-commit "$GITHUB_SHA" --archive "$root/candidate.gz" --output "$root/consumed" \
            > "$root/public/consume.stdout" 2> "$root/public/consume.stderr"
          python3 -B chengwang/tools/mihomo-runtime-candidate/check_consumption.py --repo "$GITHUB_WORKSPACE" \
            --source-commit "$GITHUB_SHA" --archive "$root/candidate.gz" --evidence "$root/consumed" \
            --report "$root/public/independent.json" > "$root/public/independent.stdout" 2> "$root/public/independent.stderr"
          install -m 0600 "$root/consumed/consumption.json" "$root/public/consumption.json"
          cmp "$root/public/consumption.json" "$root/public/independent.json"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: mihomo-continuous-recovery-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mihomo-continuous-recovery-acquisition-gate/public/*
          if-no-files-found: error
          retention-days: 14
  continuous-recovery-api:
    needs: [development-only, source-models, continuous-fault-model, continuous-bound-credentials-model, acquisition]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: 1.23.12
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mihomo-continuous-recovery-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mihomo-continuous-recovery-acquisition-original
      - name: Reacquire the fixed kernel and compare authenticated receipts
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mihomo-continuous-recovery-acquisition"
          public="$RUNNER_TEMP/mihomo-continuous-recovery-public"
          test ! -e "$root"; test ! -e "$public"
          install -d -m 0700 "$root"; install -d -m 0755 "$public"
          curl --fail --silent --show-error --location --retry 0 --max-time 120 --max-filesize 67108864 \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-v1-v1.19.32.gz \
            -o "$root/candidate.gz" 2> "$root/acquisition.stderr"
          python3 -B chengwang/tools/mihomo-runtime-candidate/consume_pin.py --repo "$GITHUB_WORKSPACE" \
            --source-commit "$GITHUB_SHA" --archive "$root/candidate.gz" --output "$root/consumed" \
            > "$root/consume.stdout" 2> "$root/consume.stderr"
          python3 -B chengwang/tools/mihomo-runtime-candidate/check_consumption.py --repo "$GITHUB_WORKSPACE" \
            --source-commit "$GITHUB_SHA" --archive "$root/candidate.gz" --evidence "$root/consumed" \
            --report "$public/consumption-independent.json" > "$root/independent.stdout" 2> "$root/independent.stderr"
          install -m 0600 "$root/consumed/consumption.json" "$public/consumption.json"
          cmp "$public/consumption.json" "$public/consumption-independent.json"
          cmp "$RUNNER_TEMP/mihomo-continuous-recovery-acquisition-original/consumption.json" "$public/consumption.json"
          cmp "$RUNNER_TEMP/mihomo-continuous-recovery-acquisition-original/independent.json" "$public/consumption-independent.json"
      - name: Bind exact run HEAD and host namespaces before execution
        run: |
          set -euo pipefail
          public="$RUNNER_TEMP/mihomo-continuous-recovery-public"
          python3 - "$public/host-before.json" <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          value={key:os.readlink('/proc/self/ns/'+kind) for key,kind in [('networkNamespace','net'),('mountNamespace','mnt'),('pidNamespace','pid')]}
          value['resolvSHA256']=hashlib.sha256(Path('/etc/resolv.conf').read_bytes()).hexdigest()
          with open(sys.argv[1],'x') as f:json.dump(value,f,sort_keys=True);f.write('\n');f.flush();os.fsync(f.fileno())
          PY
          python3 -B chengwang/deploy/mihomo-lifecycle-lab/check_continuous_recovery_api.py \
            --source-manifest "$GITHUB_WORKSPACE" "$GITHUB_SHA" \
            "$RUNNER_TEMP/mihomo-continuous-recovery-source-before.private.json" \
            > "$RUNNER_TEMP/mihomo-continuous-recovery-binding-before.json"
      - name: Execute actual continuous Recovery HTTPS chain in fresh namespaces
        run: |
          set -euo pipefail
          go_exe="$(command -v go)"
          go_root="$(dirname "$(dirname "$(readlink -f "$go_exe")")")"
          code=0
          sudo unshare --net --mount --pid --fork --mount-proc --kill-child=SIGKILL \
            bash "$GITHUB_WORKSPACE/chengwang/deploy/mihomo-lifecycle-lab/run_continuous_recovery_api.sh" \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/mihomo-continuous-recovery-public" "$go_root" \
            "$RUNNER_TEMP/mihomo-continuous-recovery-acquisition/consumed" "$GITHUB_SHA" || code=$?
          python3 - "$RUNNER_TEMP/mihomo-continuous-recovery-attempt.exit" "$code" <<'PY'
          import os,sys
          with open(sys.argv[1],'x') as f:f.write(sys.argv[2]+'\n');f.flush();os.fsync(f.fileno())
          PY
          exit "$code"
      - name: Always retain host-after and independently bind source-after
        if: ${{ always() }}
        run: |
          set -euo pipefail
          public="$RUNNER_TEMP/mihomo-continuous-recovery-public"
          install -d -m 0755 "$public"
          python3 - "$public/host-after.json" <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          value={key:os.readlink('/proc/self/ns/'+kind) for key,kind in [('networkNamespace','net'),('mountNamespace','mnt'),('pidNamespace','pid')]}
          value['resolvSHA256']=hashlib.sha256(Path('/etc/resolv.conf').read_bytes()).hexdigest()
          with open(sys.argv[1],'x') as f:json.dump(value,f,sort_keys=True);f.write('\n');f.flush();os.fsync(f.fileno())
          PY
          python3 -B chengwang/deploy/mihomo-lifecycle-lab/check_continuous_recovery_api.py \
            --source-manifest "$GITHUB_WORKSPACE" "$GITHUB_SHA" \
            "$RUNNER_TEMP/mihomo-continuous-recovery-source-after.private.json" \
            > "$RUNNER_TEMP/mihomo-continuous-recovery-binding-after.json"
          cmp "$RUNNER_TEMP/mihomo-continuous-recovery-source-before.private.json" "$RUNNER_TEMP/mihomo-continuous-recovery-source-after.private.json"
          cmp "$RUNNER_TEMP/mihomo-continuous-recovery-binding-before.json" "$RUNNER_TEMP/mihomo-continuous-recovery-binding-after.json"
      - name: Independently verify originals without Go or another kernel execution
        if: ${{ always() }}
        run: |
          set -euo pipefail
          python3 -B chengwang/deploy/mihomo-lifecycle-lab/check_continuous_recovery_api.py \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/mihomo-continuous-recovery-public" "$GITHUB_SHA" \
            > "$RUNNER_TEMP/mihomo-continuous-recovery-verification.txt" \
            2> "$RUNNER_TEMP/mihomo-continuous-recovery-verification.stderr"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: mihomo-continuous-recovery-api-originals-${{ github.run_id }}-${{ github.run_attempt }}
          path: |-
            ${{ runner.temp }}/mihomo-continuous-recovery-public/*
            ${{ runner.temp }}/mihomo-continuous-recovery-verification.txt
            ${{ runner.temp }}/mihomo-continuous-recovery-verification.stderr
            ${{ runner.temp }}/mihomo-continuous-recovery-attempt.exit
            ${{ runner.temp }}/mihomo-continuous-recovery-acquisition/*.stdout
            ${{ runner.temp }}/mihomo-continuous-recovery-acquisition/*.stderr
          if-no-files-found: error
          retention-days: 14
  continuous-recovery-fresh:
    needs: [development-only, continuous-recovery-api]
    if: ${{ !cancelled() && needs.development-only.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mihomo-continuous-recovery-api-originals-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mihomo-continuous-recovery-original
      - name: Freshly recompute exact run-HEAD originals only
        run: |
          set -euo pipefail
          python3 -B chengwang/deploy/mihomo-lifecycle-lab/check_continuous_recovery_api.py \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/mihomo-continuous-recovery-original/mihomo-continuous-recovery-public" \
            "$GITHUB_SHA" > "$RUNNER_TEMP/mihomo-continuous-recovery-fresh.txt"
          cmp "$RUNNER_TEMP/mihomo-continuous-recovery-original/mihomo-continuous-recovery-verification.txt" \
            "$RUNNER_TEMP/mihomo-continuous-recovery-fresh.txt"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: mihomo-continuous-recovery-api-fresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mihomo-continuous-recovery-fresh.txt
          if-no-files-found: error
          retention-days: 14
