name: Chengwang Subscription Refresh Closed Lane

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/chengwang-p207a-refresh-*'
      - 'codex/chengwang-unified-20261102'
    paths:
      - '.github/workflows/chengwang-subscription-refresh.yml'
      - 'chengwang/**'
  pull_request:
    paths:
      - '.github/workflows/chengwang-subscription-refresh.yml'
      - 'chengwang/**'

permissions:
  contents: read

concurrency:
  group: chengwang-subscription-refresh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CONTRACT: chengwang/deploy/subscription-refresh/source_contract.json
  CONTRACT_SHA256: 85e2235c79b92e2b8da842cb4c2abf0f4b2d4d94bbec5edfa3bb01737507de6b
  CHECKER_SHA256: 1d5f245e7c443c5edaf4a57ca09972221a7d2fb9ca4b2454195c0d0b2ee45fe8
  MODEL_SHA256: 08779f537fda4b202ee107c922d325eafbadc1c86a77344b41c388d75b4d3970
  EVENT_CHECKER_SHA256: 3577ba482e64d28105deaf848930a5b1ef61bd9bbf6088a67168c66dd24aa60b
  EVENT_MODEL_SHA256: 32e29237c0fa812135ebe7fb3f22e3a1b398e9409053d21c9274dbd100583ec7
  FAILURE_CHECKER_SHA256: 98690e7151add97552fa40b3b17dba134557fed2d519a2f494e6411f535ffc91
  FAILURE_MODEL_SHA256: 25f7ff3eb16ff4695b96786ef477eff80e5e98abb05ffc6c8fee341d4eb0ac0a
  GO_LIST_CHECKER_SHA256: ad9b6a7226719bf9f55c85f375b56264a1e5809f1393281c9c3968ca594076dc
  GO_LIST_MODEL_SHA256: 3c8e3abb1eabe15117b07128a753faa5610fb8927c2dc07b1f367f538c032af1
  MODULE_COUNT: '842'
  MODULE_SHA256: fd548b8bc8f8724a0c73ff2453a57d1011e2fbeddb0db97fb754641bd6a1e3ec
  FIXTURE_COUNT: '21'
  FIXTURE_SHA256: 7caaa3411c0d13971c42e2f60bdf11f4d9d65df71f376808aa635080a4ad9c11
  TEST_TOP_COUNT: '545'
  TEST_TOPS_SHA256: 7898897a68f05e1222869c1e807d10a9c8b6a129f2185870a4464800bfe34a61
  RUN_TOP_COUNT: '528'
  RUN_TOPS_SHA256: 63be983c7870008b3be4ba2bfb7feebee1dfe4c344e98b5ad5833c361997b8c1
  CHANGED_GO_COUNT: '38'
  CHANGED_GO_SHA256: 18610d46afbcaf90701420d8c314224b867771a3453b16355a9c31a5f9e10e36

jobs:
  source-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run and independently pin closed-gate CPU models
        working-directory: chengwang/deploy/subscription-refresh
        run: |
          set -euo pipefail
          # BEGIN P207A_NATIVEFS_MIRROR_GATE
          cd "$GITHUB_WORKSPACE"
          nativefsRoot="$RUNNER_TEMP/p207a-nativefs-mirror"
          test ! -e "$nativefsRoot"
          install -d -m 0700 "$nativefsRoot"
          python3 -I -B -c 'import runpy,sys; tool=sys.argv[1]; sys.path.insert(0,sys.argv[2]); sys.argv=[tool,*sys.argv[3:]]; runpy.run_path(tool,run_name="__main__")' "$GITHUB_WORKSPACE/chengwang/tools/nativefs-mirror/check_nativefs_mirror_source.py" "$GITHUB_WORKSPACE/chengwang/tools/nativefs-mirror" --repo "$GITHUB_WORKSPACE"
          python3 -I -B chengwang/tools/nativefs-mirror/generate_nativefs_mirror.py verify --repo "$GITHUB_WORKSPACE" --tracked "$GITHUB_WORKSPACE/chengwang/internal/nativefs/linux_magic_generated.go"
          CHENGWANG_NATIVEFS_MIRROR_FIXTURE_ROOT="$nativefsRoot" CHENGWANG_NATIVEFS_MIRROR_REPO="$GITHUB_WORKSPACE" python3 -I -B -c 'import runpy,sys; tool=sys.argv[1]; sys.path.insert(0,sys.argv[2]); sys.argv=[tool,*sys.argv[3:]]; runpy.run_path(tool,run_name="__main__")' "$GITHUB_WORKSPACE/chengwang/tools/nativefs-mirror/test_nativefs_mirror.py" "$GITHUB_WORKSPACE/chengwang/tools/nativefs-mirror" -b > "$nativefsRoot/nativefs-mirror-tests.log" 2>&1
          python3 -I -B -c 'import pathlib,sys; lines=pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines(); assert sum(line.startswith("test_") and line.endswith(" ... ok") for line in lines)==7; assert sum(line.startswith("Ran 7 tests in ") and line.endswith("s") for line in lines)==1; assert lines.count("OK")==1; assert not any(token in "\n".join(lines) for token in ("skipped","FAILED","ERROR"))' "$nativefsRoot/nativefs-mirror-tests.log"
          cd "$GITHUB_WORKSPACE/chengwang/deploy/subscription-refresh"
          # END P207A_NATIVEFS_MIRROR_GATE
          python3 -B -m unittest -v test_source_contract test_go_events test_go_failure test_go_list > source-models.log 2>&1
          python3 - <<'PY'
          import ast,hashlib
          from pathlib import Path
          import check_source_contract as source_contract_checker
          files=('test_source_contract.py','test_go_events.py','test_go_failure.py','test_go_list.py')
          names=[]
          for filename in files:
              tree=ast.parse(Path(filename).read_text(encoding='utf-8'))
              names.extend(filename+'::'+node.name for item in tree.body if isinstance(item,ast.ClassDef)
                           for node in item.body if isinstance(node,ast.FunctionDef) and node.name.startswith('test_'))
          names=sorted(names)
          assert len(names)==len(set(names))==83
          assert hashlib.sha256('\n'.join(names).encode()).hexdigest()=='42b8d142d7c77bad77bc4f191d784ba57a7595440f347c718308007dcad90194'
          text=Path('source-models.log').read_text(encoding='utf-8').replace('\r\n','\n')
          source_contract_checker.verify_source_model_log(text,files,names)
          print('P207A_SOURCE_MODELS=PASS count=83 go_execution_proven=false')
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p207a-source-models-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            chengwang/deploy/subscription-refresh/source-models.log
            ${{ runner.temp }}/p207a-nativefs-mirror/nativefs-mirror-tests.log
          if-no-files-found: warn
          retention-days: 14
  source-and-go:
    needs: source-models
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: 1.23.12
          cache: false
      - name: Verify source, official selection, formatting, and exact Go events
        env:
          GOFLAGS: -mod=vendor
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/p207a-refresh"
          test ! -e "$out"
          install -d -m 0700 "$out"
          verify_source() {
            python3 -I -B chengwang/deploy/subscription-refresh/check_source_contract.py \
              --repo "$GITHUB_WORKSPACE" --contract "$CONTRACT" \
              --contract-sha256 "$CONTRACT_SHA256" --checker-sha256 "$CHECKER_SHA256" \
              --model-sha256 "$MODEL_SHA256" --event-checker-sha256 "$EVENT_CHECKER_SHA256" \
              --event-model-sha256 "$EVENT_MODEL_SHA256" --failure-checker-sha256 "$FAILURE_CHECKER_SHA256" \
              --failure-model-sha256 "$FAILURE_MODEL_SHA256" --go-list-checker-sha256 "$GO_LIST_CHECKER_SHA256" \
              --go-list-model-sha256 "$GO_LIST_MODEL_SHA256" --module-count "$MODULE_COUNT" \
              --module-sha256 "$MODULE_SHA256" --fixture-count "$FIXTURE_COUNT" \
              --fixture-sha256 "$FIXTURE_SHA256" --test-top-count "$TEST_TOP_COUNT" \
              --test-tops-sha256 "$TEST_TOPS_SHA256" --run-top-count "$RUN_TOP_COUNT" \
              --run-tops-sha256 "$RUN_TOPS_SHA256" --changed-go-count "$CHANGED_GO_COUNT" \
              --changed-go-sha256 "$CHANGED_GO_SHA256"
          }
          verify_source > "$out/source-before.json"
          cd chengwang
          go env -json GOOS GOARCH CGO_ENABLED GOVERSION > "$out/go-env.json"
          go list -json ./internal/api ./internal/authn ./internal/authz ./internal/evidence ./internal/nativefs ./internal/serverruntime \
            ./internal/subscription ./internal/subscriptionctl ./internal/subscriptionpolicy > "$out/go-list.private.json"
          cd "$GITHUB_WORKSPACE"
          python3 -I -B chengwang/deploy/subscription-refresh/check_go_list.py \
            --go-list "$out/go-list.private.json" --go-env "$out/go-env.json" \
            --contract "$CONTRACT" --contract-sha256 "$CONTRACT_SHA256" \
            --output "$out/go-list-report.json"
          fmt=(
            chengwang/internal/api/server.go
            chengwang/internal/api/subscriptions.go
            chengwang/internal/api/subscriptions_test.go
            chengwang/internal/authn/snapshot_manager.go
            chengwang/internal/authn/snapshot_manager_linux_test.go
            chengwang/internal/authn/store.go
            chengwang/internal/authz/model.go
            chengwang/internal/authz/policy.go
            chengwang/internal/authz/subscription.go
            chengwang/internal/authz/subscription_refresh_test.go
            chengwang/internal/evidence/archive_existing.go
            chengwang/internal/evidence/archive_existing_actualfs_linux_test.go
            chengwang/internal/evidence/archive_existing_linux.go
            chengwang/internal/evidence/archive_existing_source_test.go
            chengwang/internal/evidence/archive_existing_test.go
            chengwang/internal/evidence/archive_existing_unsupported.go
            chengwang/internal/nativefs/linux_class.go
            chengwang/internal/nativefs/linux_magic_generated.go
            chengwang/internal/nativefs/linux_magic_test.go
            chengwang/internal/serverruntime/runtime.go
            chengwang/internal/serverruntime/subscription_config.go
            chengwang/internal/serverruntime/subscription_config_test.go
            chengwang/internal/subscription/control.go
            chengwang/internal/subscription/refresh.go
            chengwang/internal/subscription/refresh_test.go
            chengwang/internal/subscription/sealed_archive_a0.go
            chengwang/internal/subscription/sealed_archive_history.go
            chengwang/internal/subscription/sealed_archive_test.go
            chengwang/internal/subscription/sealed_archive_wire.go
            chengwang/internal/subscription/store.go
            chengwang/internal/subscriptionctl/access_test.go
            chengwang/internal/subscriptionctl/contract.go
            chengwang/internal/subscriptionctl/refresh.go
            chengwang/internal/subscriptionctl/service.go
            chengwang/internal/subscriptionctl/service_linux_test.go
            chengwang/internal/subscriptionpolicy/catalog.go
            chengwang/internal/subscriptionpolicy/catalog_access.go
            chengwang/internal/subscriptionpolicy/refresh_test.go
          )
          set +e
          gofmt -d "${fmt[@]}" > "$out/gofmt.patch" 2> "$out/gofmt.stderr"
          formatCode=$?
          cd chengwang
          go test -json -count=1 -timeout=180s -run '^Test' ./internal/api ./internal/authn ./internal/authz \
            ./internal/evidence ./internal/nativefs ./internal/serverruntime ./internal/subscription ./internal/subscriptionctl \
            ./internal/subscriptionpolicy \
            > "$out/go-events.private.jsonl" 2> "$out/go.stderr"
          code=$?
          cd "$GITHUB_WORKSPACE"
          set -e
          printf '%s\n' "$formatCode" > "$out/format-exit.txt"
          printf '%s\n' "$code" > "$out/go-exit.txt"
          verify_source > "$out/source-after.json"
          cmp "$out/source-before.json" "$out/source-after.json"
          set +e
          python3 -I -B chengwang/deploy/subscription-refresh/check_go_events.py \
            --events "$out/go-events.private.jsonl" --go-exit "$code" \
            --contract "$CONTRACT" --contract-sha256 "$CONTRACT_SHA256" \
            --output "$out/go-events-report.json"
          eventCode=$?
          set -e
          printf '%s\n' "$eventCode" > "$out/event-check-exit.txt"
          failureCode=0
          if test "$code" != 0 || test "$eventCode" != 0; then
            set +e
            python3 -I -B chengwang/deploy/subscription-refresh/check_go_failure.py \
              --events "$out/go-events.private.jsonl" --stderr "$out/go.stderr" --repo "$GITHUB_WORKSPACE" \
              --go-exit "$code" --event-check-exit "$eventCode" \
              --contract "$CONTRACT" --contract-sha256 "$CONTRACT_SHA256" \
              --output "$out/go-failure-report.json"
            failureCode=$?
            if test "$failureCode" = 0; then
              python3 -I -B chengwang/deploy/subscription-refresh/check_go_failure.py \
                --report "$out/go-failure-report.json" --events "$out/go-events.private.jsonl" \
                --stderr "$out/go.stderr" --repo "$GITHUB_WORKSPACE" \
                --go-exit "$code" --event-check-exit "$eventCode" --contract "$CONTRACT" \
                --contract-sha256 "$CONTRACT_SHA256"
              failureCode=$?
            fi
            set -e
          fi
          printf '%s\n' "$failureCode" > "$out/failure-check-exit.txt"
          # BEGIN P207A_ACCEPTED_GATE
          test "$formatCode" = 0
          test -f "$out/gofmt.patch"
          test ! -s "$out/gofmt.patch"
          test -f "$out/gofmt.stderr"
          test ! -s "$out/gofmt.stderr"
          test "$code" = 0
          test "$eventCode" = 0
          test "$failureCode" = 0
          test -f "$out/go.stderr"
          test ! -s "$out/go.stderr"
          test -s "$out/source-before.json"
          test -s "$out/source-after.json"
          test -s "$out/go-list-report.json"
          test -s "$out/go-events-report.json"
          test -s "$out/format-exit.txt"
          test -s "$out/go-exit.txt"
          test -s "$out/event-check-exit.txt"
          test "$(cat "$out/format-exit.txt")" = 0
          test "$(cat "$out/go-exit.txt")" = 0
          test "$(cat "$out/event-check-exit.txt")" = 0
          # END P207A_ACCEPTED_GATE
      - name: Upload bounded accepted evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p207a-source-go-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/p207a-refresh/source-before.json
            ${{ runner.temp }}/p207a-refresh/source-after.json
            ${{ runner.temp }}/p207a-refresh/go-list-report.json
            ${{ runner.temp }}/p207a-refresh/go-events-report.json
            ${{ runner.temp }}/p207a-refresh/format-exit.txt
            ${{ runner.temp }}/p207a-refresh/go-exit.txt
            ${{ runner.temp }}/p207a-refresh/event-check-exit.txt
            ${{ runner.temp }}/p207a-refresh/gofmt.patch
            ${{ runner.temp }}/p207a-refresh/gofmt.stderr
          if-no-files-found: error
          retention-days: 14
      - name: Upload bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p207a-source-go-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/p207a-refresh/source-before.json
            ${{ runner.temp }}/p207a-refresh/source-after.json
            ${{ runner.temp }}/p207a-refresh/format-exit.txt
            ${{ runner.temp }}/p207a-refresh/go-exit.txt
            ${{ runner.temp }}/p207a-refresh/event-check-exit.txt
            ${{ runner.temp }}/p207a-refresh/failure-check-exit.txt
            ${{ runner.temp }}/p207a-refresh/go-failure-report.json
            ${{ runner.temp }}/p207a-refresh/gofmt.patch
            ${{ runner.temp }}/p207a-refresh/gofmt.stderr
          if-no-files-found: warn
          retention-days: 14

  fresh:
    needs: source-and-go
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p207a-source-go-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p207a-refresh-readback
      - name: Recompute source and read bounded reports
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/p207a-refresh-readback"
          # BEGIN P207A_FRESH_GATE
          test -s "$root/source-before.json"
          test -s "$root/source-after.json"
          test -s "$root/go-list-report.json"
          test -s "$root/go-events-report.json"
          test -s "$root/format-exit.txt"
          test -s "$root/go-exit.txt"
          test -s "$root/event-check-exit.txt"
          test -f "$root/gofmt.patch"
          test ! -s "$root/gofmt.patch"
          test -f "$root/gofmt.stderr"
          test ! -s "$root/gofmt.stderr"
          test "$(cat "$root/format-exit.txt")" = 0
          test "$(cat "$root/go-exit.txt")" = 0
          test "$(cat "$root/event-check-exit.txt")" = 0
          # END P207A_FRESH_GATE
          cmp "$root/source-before.json" "$root/source-after.json"
          python3 -I -B chengwang/deploy/subscription-refresh/check_source_contract.py \
            --repo "$GITHUB_WORKSPACE" --contract "$CONTRACT" \
            --contract-sha256 "$CONTRACT_SHA256" --checker-sha256 "$CHECKER_SHA256" \
            --model-sha256 "$MODEL_SHA256" --event-checker-sha256 "$EVENT_CHECKER_SHA256" \
            --event-model-sha256 "$EVENT_MODEL_SHA256" --failure-checker-sha256 "$FAILURE_CHECKER_SHA256" \
            --failure-model-sha256 "$FAILURE_MODEL_SHA256" --go-list-checker-sha256 "$GO_LIST_CHECKER_SHA256" \
            --go-list-model-sha256 "$GO_LIST_MODEL_SHA256" --module-count "$MODULE_COUNT" \
            --module-sha256 "$MODULE_SHA256" --fixture-count "$FIXTURE_COUNT" \
            --fixture-sha256 "$FIXTURE_SHA256" --test-top-count "$TEST_TOP_COUNT" \
            --test-tops-sha256 "$TEST_TOPS_SHA256" --run-top-count "$RUN_TOP_COUNT" \
            --run-tops-sha256 "$RUN_TOPS_SHA256" --changed-go-count "$CHANGED_GO_COUNT" \
            --changed-go-sha256 "$CHANGED_GO_SHA256" > "$root/source-fresh.json"
          cmp "$root/source-before.json" "$root/source-fresh.json"
          python3 -I -B chengwang/deploy/subscription-refresh/check_go_list.py \
            --report "$root/go-list-report.json" --contract "$CONTRACT" \
            --contract-sha256 "$CONTRACT_SHA256"
          python3 -I -B chengwang/deploy/subscription-refresh/check_go_events.py \
            --report "$root/go-events-report.json" --contract "$CONTRACT" \
            --contract-sha256 "$CONTRACT_SHA256"
