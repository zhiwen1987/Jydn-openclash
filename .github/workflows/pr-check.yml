name: PR Build Check

on:
  pull_request:
    paths:
      - ".github/workflows/pr-check.yml"
      - "upstream/metafenliu.ini"
      - "custom/**"
      - "rules/**"
      - "modules/**"
      - "scripts/**"
  push:
    branches:
      - "codex/**"
    paths:
      - ".github/workflows/pr-check.yml"
      - "upstream/metafenliu.ini"
      - "custom/**"
      - "rules/**"
      - "modules/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build generated artifacts
        run: python3 scripts/build.py

      - name: Validate generated config
        run: python3 scripts/validate.py

      - name: Test runtime empty-group filter
        run: ruby scripts/test_patch_runtime_groups.rb

      - name: Test R4 candidate builder
        run: ruby scripts/test_build_r4_candidate.rb

      - name: Test subscription-managed candidate builder
        run: ruby scripts/test_build_subscription_managed_candidate.rb

      - name: Check subscription-managed candidate verifier syntax
        run: ruby -c scripts/verify_subscription_managed_candidate.rb

      - name: Check provider validation builder syntax
        run: ruby -c scripts/build_provider_validation_config.rb

      - name: Check production shell scripts
        run: sh -n scripts/openclash_r4_rollback_guard.sh scripts/openclash_subscription_switch_guard.sh scripts/select_r4_business_defaults.sh
