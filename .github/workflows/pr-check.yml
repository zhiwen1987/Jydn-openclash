name: PR Build Check

on:
  pull_request:
    paths:
      - "upstream/metafenliu.ini"
      - "custom/**"
      - "rules/**"
      - "modules/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build generated artifacts
        run: python3 scripts/build.py

      - name: Validate generated config
        run: python3 scripts/validate.py

      - name: Test runtime empty-group filter
        run: ruby scripts/test_patch_runtime_groups.rb