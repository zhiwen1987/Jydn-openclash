name: PR Build Check

on:
  pull_request:
    paths:
      - ".github/workflows/pr-check.yml"
      - "upstream/metafenliu.ini"
      - "custom/**"
      - "rules/**"
      - "modules/**"
      - "scripts/**"
  push:
    branches:
      - "codex/**"
    paths:
      - ".github/workflows/pr-check.yml"
      - "upstream/metafenliu.ini"
      - "custom/**"
      - "rules/**"
      - "modules/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify rules-only repository boundary
        run: python3 scripts/check_rules_repository.py

      - name: Build generated artifacts
        run: python3 scripts/build.py

      - name: Validate generated config
        run: python3 scripts/validate.py

      - name: Test runtime empty-group filter
        run: ruby scripts/test_patch_runtime_groups.rb

      - name: Test persistent business menu controls
        run: ruby scripts/test_routing_controls.rb

      - name: Test shared custom selector and independent local provider
        run: ruby scripts/test_strict_custom.rb

      - name: Test public rule export allowlist
        run: python3 scripts/test_publish_public_rules.py

      - name: Check retained configuration hook syntax
        run: sh -n scripts/jydn_group_filter_hook.sh scripts/jydn_routing_controls_hook.sh scripts/jydn_strict_custom_hook.sh
