name: Chengwang Source-Fixed Default-p versus p1 Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/chengwang-p1-measure-*'

permissions:
  contents: read

concurrency:
  group: chengwang-mihomo-p1-pair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pair:
    name: pair-${{ matrix.order }}
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/heads/codex/chengwang-p1-measure-') }}
    runs-on: ubuntu-24.04
    # This is only a two-leg custody ceiling. Each Go invocation keeps the
    # source contract's own 180 s timeout unchanged.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        order: [AB, BA]
    steps:
      - name: Reject non-measurement events and refs
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUEST_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in push|workflow_dispatch) ;; *) exit 2 ;; esac
          [[ "$REQUEST_REF" =~ ^refs/heads/codex/chengwang-p1-measure-[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]

      - name: Checkout controller tools only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: controller
          persist-credentials: false

      - name: Checkout immutable measurement source separately
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: measurement-source
          ref: 2eb7717a7a9d32308fbb90c45b2c183c1acb53d8
          fetch-depth: 1
          persist-credentials: false

      - name: Select pinned Go without cache sharing
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: 1.23.12
          cache: false

      - name: Verify dual-source identities and CPU-only models
        env:
          CONTROLLER_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          controller="$GITHUB_WORKSPACE/controller"
          source="$GITHUB_WORKSPACE/measurement-source"
          test "$(git -C "$controller" rev-parse HEAD)" = "$CONTROLLER_COMMIT"
          test -z "$(git -C "$controller" status --porcelain --untracked-files=all)"
          test "$(git -C "$source" rev-parse HEAD)" = 2eb7717a7a9d32308fbb90c45b2c183c1acb53d8
          test -z "$(git -C "$source" status --porcelain --untracked-files=all)"
          python3 -B "$controller/chengwang/deploy/mihomo-p1-pair/check_pair.py" models
          python3 -B "$controller/chengwang/deploy/mihomo-p1-pair/check_pair.py" script-contract \
            --baseline "$source/chengwang/deploy/mihomo-lifecycle-lab/run_contracts.sh" \
            --p1 "$controller/chengwang/deploy/mihomo-p1-pair/run_contracts_p1.sh"

      - name: Run both legs sequentially with fresh private namespaces and caches
        env:
          CONTROLLER_COMMIT: ${{ github.sha }}
          ORDER: ${{ matrix.order }}
        run: |
          set -euo pipefail
          controller="$GITHUB_WORKSPACE/controller"
          source="$GITHUB_WORKSPACE/measurement-source"
          helper="$controller/chengwang/deploy/mihomo-p1-pair/pair_controller.py"
          root="$RUNNER_TEMP/mihomo-p1-pair-$ORDER"
          test ! -e "$root"
          install -d -m 0755 "$root"
          go_exe="$(command -v go)"
          go_root="$(dirname "$(dirname "$(readlink -f "$go_exe")")")"
          for position in 1 2; do
            offset=$((position-1))
            leg="${ORDER:$offset:1}"
            out="$root/leg-$leg"
            control="$root/control-$leg"
            install -d -m 0755 "$out" "$control"
            python3 -B "$helper" prepare --controller "$controller" --source "$source" \
              --out "$out" --control "$control" --controller-commit "$CONTROLLER_COMMIT" \
              --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --order "$ORDER" --position "$position" --leg "$leg" --job "pair-$ORDER"
            set +e
            sudo --non-interactive python3 -B "$helper" supervise --controller "$controller" \
              --source "$source" --out "$out" --control "$control" --goroot "$go_root" \
              --controller-commit "$CONTROLLER_COMMIT" --leg "$leg"
            supervise_exit=$?
            set -e
            python3 -B "$helper" finish --controller "$controller" --source "$source" \
              --out "$out" --control "$control" --controller-commit "$CONTROLLER_COMMIT" \
              --leg "$leg" --supervise-exit "$supervise_exit"
          done

      - name: Strictly read captures without converting Go failures to passes
        if: ${{ always() }}
        env:
          CONTROLLER_COMMIT: ${{ github.sha }}
          ORDER: ${{ matrix.order }}
        run: |
          set -euo pipefail
          controller="$GITHUB_WORKSPACE/controller"
          source="$GITHUB_WORKSPACE/measurement-source"
          root="$RUNNER_TEMP/mihomo-p1-pair-$ORDER"
          python3 -B "$controller/chengwang/deploy/mihomo-p1-pair/check_pair.py" verify \
            --controller "$controller" --source "$source" --controller-commit "$CONTROLLER_COMMIT" \
            --order "$ORDER" --a "$root/leg-A" --b "$root/leg-B" \
            --report "$root/comparison.json"

      - name: Preserve actual originals and measurement-only report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mihomo-p1-pair-${{ matrix.order }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mihomo-p1-pair-${{ matrix.order }}
          retention-days: 14
          if-no-files-found: error
