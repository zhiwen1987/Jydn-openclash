name: Chengwang Image Binding Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/chengwang-image-binding.yml"
      - "chengwang/tools/image-binding/**"
      - "chengwang/tools/image-verifier/**"
      - "chengwang/web/**"
      - "chengwang/internal/restoreimage/**"
      - "chengwang/internal/api/**"
      - "chengwang/internal/authn/**"
      - "chengwang/internal/authz/**"
      - "chengwang/internal/evidence/**"
      - "chengwang/internal/imagetrust/**"
      - "chengwang/internal/serverruntime/**"
      - "chengwang/deploy/product-candidate/**"
      - "chengwang/cmd/server/**"
      - "chengwang/go.mod"
      - "chengwang/go.sum"
  push:
    branches: [main, codex/chengwang-security-hardening]
    paths:
      - ".github/workflows/chengwang-image-binding.yml"
      - "chengwang/tools/image-binding/**"
      - "chengwang/tools/image-verifier/**"
      - "chengwang/web/**"
      - "chengwang/internal/restoreimage/**"
      - "chengwang/internal/api/**"
      - "chengwang/internal/authn/**"
      - "chengwang/internal/authz/**"
      - "chengwang/internal/evidence/**"
      - "chengwang/internal/imagetrust/**"
      - "chengwang/internal/serverruntime/**"
      - "chengwang/deploy/product-candidate/**"
      - "chengwang/cmd/server/**"
      - "chengwang/go.mod"
      - "chengwang/go.sum"

permissions:
  contents: read

concurrency:
  group: chengwang-image-binding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binding:
    name: Offline product API trust binding and real Distribution Registry
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GOWORK: "off"
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      CGO_ENABLED: "1"
      # Official library/registry linux/amd64 manifest, resolved from registry:3.
      REGISTRY_FIXTURE_IMAGE: registry:3@sha256:1290056e2357eceb0c047cb60ae9abb370305a218e2df650eb8d3ea021b1c151
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up the isolated toolchain
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: 1.25.8
          cache: false

      - name: Acquire pinned dependencies and test-only Registry image
        shell: bash
        env:
          GOENV: "off"
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GOPRIVATE: ""
          GONOPROXY: ""
          GONOSUMDB: ""
          GOINSECURE: ""
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.25.8
          /usr/bin/install -d -m 0700 "$RUNNER_TEMP/chengwang-image-binding/evidence"
          cd chengwang/tools/image-binding
          go version | /usr/bin/tee "$RUNNER_TEMP/chengwang-image-binding/evidence/go-version.txt"
          go env -json GOVERSION GOENV GOPROXY GOSUMDB GOPRIVATE GONOPROXY GONOSUMDB GOINSECURE \
            > "$RUNNER_TEMP/chengwang-image-binding/evidence/go-env-online.json"
          download_status=0
          go mod download all || download_status=$?
          /usr/bin/cp -- go.sum "$RUNNER_TEMP/chengwang-image-binding/evidence/go.sum.candidate"
          echo "IMAGE_BINDING_DEPENDENCY_DOWNLOAD_EXIT=$download_status"
          test "$download_status" -eq 0
          go list -m -json all > "$RUNNER_TEMP/chengwang-image-binding/evidence/modules.json"
          /usr/bin/python3 -B scripts/check-module-pins.py "$RUNNER_TEMP/chengwang-image-binding/evidence/modules.json"
          /usr/bin/python3 -B scripts/module-verification.py prepare \
            "$RUNNER_TEMP/chengwang-image-binding" "$(go env GOMODCACHE)"
          (
            cd "$RUNNER_TEMP/chengwang-image-binding/remote-verification"
            # Exact original go.mod, with only two local names replaced by
            # dotted aliases. No require-all or workspace pruning changes.
            test "$(go env GOWORK)" = off
            auxiliary_list_status=0
            go list -m -json all \
              > "$RUNNER_TEMP/chengwang-image-binding/evidence/remote-modules-online.json" \
              2> "$RUNNER_TEMP/chengwang-image-binding/evidence/auxiliary-list.log" \
              || auxiliary_list_status=$?
            /usr/bin/cp -- go.mod "$RUNNER_TEMP/chengwang-image-binding/evidence/verification.go.mod"
            /usr/bin/cp -- go.sum "$RUNNER_TEMP/chengwang-image-binding/evidence/auxiliary-list.go.sum.candidate"
            /usr/bin/cp -- go.sum "$RUNNER_TEMP/chengwang-image-binding/evidence/auxiliary.go.sum.candidate"
            echo "IMAGE_BINDING_AUXILIARY_LIST_EXIT=$auxiliary_list_status"
            /usr/bin/cat "$RUNNER_TEMP/chengwang-image-binding/evidence/auxiliary-list.log"
            test "$auxiliary_list_status" -eq 0
            /usr/bin/python3 -B "$GITHUB_WORKSPACE/chengwang/tools/image-binding/scripts/module-verification.py" graph \
              "$RUNNER_TEMP/chengwang-image-binding" "$(go env GOMODCACHE)" \
              "$RUNNER_TEMP/chengwang-image-binding/evidence/remote-modules-online.json"
            auxiliary_download_status=0
            go mod download -json all \
              > "$RUNNER_TEMP/chengwang-image-binding/evidence/remote-downloads.json" \
              2> "$RUNNER_TEMP/chengwang-image-binding/evidence/auxiliary-download.log" \
              || auxiliary_download_status=$?
            /usr/bin/cp -- go.sum "$RUNNER_TEMP/chengwang-image-binding/evidence/auxiliary.go.sum.candidate"
            echo "IMAGE_BINDING_AUXILIARY_DOWNLOAD_EXIT=$auxiliary_download_status"
            /usr/bin/cat "$RUNNER_TEMP/chengwang-image-binding/evidence/auxiliary-download.log"
            test "$auxiliary_download_status" -eq 0
            # Prove complete archive/pin coverage and immutable inputs before
            # official verification; preserve the same contract afterwards.
            /usr/bin/python3 -B "$GITHUB_WORKSPACE/chengwang/tools/image-binding/scripts/module-verification.py" check \
              "$RUNNER_TEMP/chengwang-image-binding" "$(go env GOMODCACHE)" \
              "$RUNNER_TEMP/chengwang-image-binding/evidence/remote-modules-online.json"
            go mod verify | /usr/bin/tee "$RUNNER_TEMP/chengwang-image-binding/evidence/module-verification-online.txt"
            /usr/bin/python3 -B "$GITHUB_WORKSPACE/chengwang/tools/image-binding/scripts/module-verification.py" check \
              "$RUNNER_TEMP/chengwang-image-binding" "$(go env GOMODCACHE)" \
              "$RUNNER_TEMP/chengwang-image-binding/evidence/remote-modules-online.json"
          )
          /usr/bin/git diff --exit-code -- go.mod go.sum
          # Acquire existing locked npm packages only. Repository scripts and
          # the frontend build execute later, after external networking and
          # source/node_modules writes are disabled by the offline gate.
          node_binary="$(command -v node)"
          chrome_binary="$(command -v google-chrome)"
          test -x "$node_binary"
          test -x "$chrome_binary"
          certutil_binary="$(command -v certutil)"
          dpkg_binary="$(command -v dpkg)"
          test -x "$certutil_binary"
          test -x "$dpkg_binary"
          "$dpkg_binary" --version > "$RUNNER_TEMP/chengwang-image-binding/evidence/browser-dpkg-version.txt"
          /usr/bin/dpkg-query -W -f='${Package}\t${Version}\n' libnss3-tools libnss3 libnspr4 \
            > "$RUNNER_TEMP/chengwang-image-binding/evidence/browser-nss-toolchain.txt"
          /usr/bin/sha256sum -- "$(/usr/bin/realpath -e -- "$certutil_binary")" \
            > "$RUNNER_TEMP/chengwang-image-binding/evidence/browser-certutil.sha256"
          "$node_binary" -e 'if(Number(process.versions.node.split(".")[0])<22||typeof WebSocket!=="function")process.exit(1);console.log(JSON.stringify({node:process.version,builtinWebSocket:true}))' \
            > "$RUNNER_TEMP/chengwang-image-binding/evidence/browser-node-toolchain.json"
          "$chrome_binary" --version > "$RUNNER_TEMP/chengwang-image-binding/evidence/browser-chrome-version.txt"
          # Test-only unmodified OFL fonts, not repository code or a product
          # dependency. Fixed upstream commit, sizes and SHA-256 fail closed.
          font_root="$RUNNER_TEMP/chengwang-image-binding/fonts"
          /usr/bin/install -d -m 0700 "$font_root"
          noto_source='https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c'
          /usr/bin/curl --fail --silent --show-error --proto '=https' --max-time 90 --max-filesize 20000000 \
            "$noto_source/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf" -o "$font_root/NotoSansCJKsc-Regular.otf"
          /usr/bin/curl --fail --silent --show-error --proto '=https' --max-time 90 --max-filesize 20000000 \
            "$noto_source/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Bold.otf" -o "$font_root/NotoSansCJKsc-Bold.otf"
          /usr/bin/curl --fail --silent --show-error --proto '=https' --max-time 90 --max-filesize 5000 \
            "$noto_source/Sans/LICENSE" -o "$font_root/LICENSE"
          test "$(/usr/bin/stat -c %s "$font_root/NotoSansCJKsc-Regular.otf")" = 16437364
          test "$(/usr/bin/stat -c %s "$font_root/NotoSansCJKsc-Bold.otf")" = 17002248
          test "$(/usr/bin/stat -c %s "$font_root/LICENSE")" = 4301
          (
            cd "$font_root"
            /usr/bin/printf '%s\n' \
              '2c76254f6fc379fddfce0a7e84fb5385bb135d3e399294f6eeb6680d0365b74b  NotoSansCJKsc-Regular.otf' \
              'b5f0d1a190a7f9b43c310a8850630af12553df32c4c050543f9059732d9b4c0a  NotoSansCJKsc-Bold.otf' \
              '6a73f9541c2de74158c0e7cf6b0a58ef774f5a780bf191f2d7ec9cc53efe2bf2  LICENSE' \
              | /usr/bin/sha256sum --check --strict
          )
          (
            cd "$GITHUB_WORKSPACE/chengwang/web"
            npm ci --ignore-scripts --no-audit --no-fund
          )
          /usr/bin/docker pull --platform linux/amd64 "$REGISTRY_FIXTURE_IMAGE"
          test "$(/usr/bin/docker image inspect --format '{{.Os}}/{{.Architecture}}' "$REGISTRY_FIXTURE_IMAGE")" = linux/amd64
          echo 'REGISTRY_FIXTURE_IMAGE_BOUNDARY=PINNED_TEST_HARNESS_NOT_PRODUCT_IMAGE'

      - name: Run ordinary, race, durable trust-state and vet with only isolated loopback networking
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/bash chengwang/tools/image-binding/scripts/run-linux-ci.sh \
            "$RUNNER_TEMP/chengwang-image-binding" "$(command -v go)" "$(go env GOMODCACHE)"

      - name: Verify real Distribution Registry binding on a private internal network
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/bash chengwang/tools/image-binding/scripts/run-registry-fixture.sh \
            "$RUNNER_TEMP/chengwang-image-binding" "$(command -v go)" "$(go env GOMODCACHE)"

      - name: Build and execute the complete product candidate image without publishing
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/bash chengwang/tools/image-binding/scripts/run-product-image-gate.sh \
            "$RUNNER_TEMP/chengwang-image-binding" "$(command -v go)" "$(go env GOMODCACHE)"

      - name: Check source remained unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/git diff --check
          /usr/bin/git diff --exit-code
          test -z "$(/usr/bin/git status --porcelain --untracked-files=all)"

      - name: Preserve binding test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-binding-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chengwang-image-binding/evidence/
          if-no-files-found: error
          retention-days: 14
