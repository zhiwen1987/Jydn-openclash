name: Chengwang M2b Candidate Static Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/chengwang-m2b-candidate.yml"
      - "chengwang/**"
  push:
    branches:
      - main
      - codex/chengwang-security-hardening
    paths:
      - ".github/workflows/chengwang-m2b-candidate.yml"
      - "chengwang/**"

permissions:
  contents: read

concurrency:
  group: chengwang-m2b-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-gate:
    name: Offline Linux static gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      GOTOOLCHAIN: local
      CGO_ENABLED: "1"
    steps:
      - name: Checkout source
        # actions/checkout v4.4.0; immutable full commit SHA.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Go
        # actions/setup-go v6.1.0; immutable full commit SHA.
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: 1.23.12
          cache: false

      - name: Pull immutable Python test image before repository execution
        shell: bash
        env:
          PYTHON_TEST_IMAGE: python:3.12.12-slim-bookworm@sha256:2986c55feb36e6cae00fa1fefb454283e4b33f35e75ff8bdd123b134130be301
        run: |
          set -euo pipefail
          /usr/bin/docker pull --platform linux/amd64 "$PYTHON_TEST_IMAGE"
          test "$(/usr/bin/docker image inspect --format '{{.Os}}/{{.Architecture}}' "$PYTHON_TEST_IMAGE")" = "linux/amd64"
          echo 'PYTHON_TEST_IMAGE_BOUNDARY=PINNED_TEST_HARNESS_NOT_PRODUCT_SUPPLY_CHAIN_ACCEPTANCE'

      - name: Validate real Docker Compose v2 rendering compatibility
        shell: bash
        run: |
          set -euo pipefail
          transcript="$RUNNER_TEMP/chengwang-compose-cli.json"
          /usr/bin/docker compose version
          cd chengwang
          GOTOOLCHAIN=local GOFLAGS=-mod=vendor GOPROXY=off GOSUMDB=off \
            /opt/hostedtoolcache/go/1.23.12/x64/bin/go test -json \
              -tags composecli -run '^TestComposeCLIRenderedOutputMatchesLocalReleaseContract$' \
              -count=1 ./internal/restorecurrent | /usr/bin/tee "$transcript"
          /usr/bin/python3 - "$transcript" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1]).resolve(strict=True)
          target = "TestComposeCLIRenderedOutputMatchesLocalReleaseContract"
          package = "chengwang/internal/restorecurrent"
          runs = set()
          passes = set()
          package_passed = False
          with path.open(encoding="utf-8") as stream:
              for line_number, line in enumerate(stream, 1):
                  event = json.loads(line)
                  action = event.get("Action")
                  test = event.get("Test")
                  if action == "fail":
                      raise SystemExit(f"Compose compatibility failure event at line {line_number}: {test or package}")
                  if action == "skip":
                      raise SystemExit(f"Compose compatibility skip is forbidden: {test or package}")
                  if test and action == "run":
                      runs.add(test)
                  if test and action == "pass":
                      passes.add(test)
                  if event.get("Package") == package and test is None and action == "pass":
                      package_passed = True
          if runs != {target} or passes != {target} or not package_passed:
              raise SystemExit(
                  f"Compose compatibility exact test contract failed: runs={sorted(runs)} "
                  f"passes={sorted(passes)} packagePass={package_passed}"
              )
          print("COMPOSE_CLI_TEST_EVENTS=PASS exact=1 skips=0 packagePass=true")
          PY
          echo 'COMPOSE_RENDER_COMPATIBILITY=PASS boundary=LOCAL_COMPATIBILITY_NOT_RENDERER_ATTESTATION'

      - name: Validate read-only Docker collector against an isolated daemon fixture
        shell: bash
        env:
          PYTHON_TEST_IMAGE: python:3.12.12-slim-bookworm@sha256:2986c55feb36e6cae00fa1fefb454283e4b33f35e75ff8bdd123b134130be301
        run: |
          set -euo pipefail
          fixture_suffix="$(printf '%s-%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | /usr/bin/sha256sum | /usr/bin/cut -c1-12)"
          fixture_project="chengwang-m2b-probe-ci-${fixture_suffix}-candidate"
          fixture_container="chengwang-runtime-fixture-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fixture_network="chengwang-runtime-fixture-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          transcript_dir="$RUNNER_TEMP/chengwang-runtime-observer"
          container_id=""
          network_id=""
          cleanup() {
            if [ -n "$container_id" ]; then
              /usr/bin/docker rm -f "$container_id" >/dev/null 2>&1 || true
            fi
            if [ -n "$network_id" ]; then
              /usr/bin/docker network rm "$network_id" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          /usr/bin/install -d -m 0700 "$transcript_dir"
          if /usr/bin/docker container inspect "$fixture_container" >/dev/null 2>&1 || \
             /usr/bin/docker network inspect "$fixture_network" >/dev/null 2>&1; then
            echo 'fixture name collision; refusing destructive reuse' >&2
            exit 1
          fi
          network_id="$(/usr/bin/docker network create --driver bridge --internal \
            --label com.jydn.chengwang.test-fixture=true "$fixture_network")"
          test "${#network_id}" -eq 64
          container_id="$(/usr/bin/docker run -d --pull never --platform linux/amd64 \
            --name "$fixture_container" --network "$fixture_network" --read-only --user 65534:65534 \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 32 --memory 64m --cpus 0.25 \
            --label "com.docker.compose.project=$fixture_project" \
            --label com.docker.compose.service=probe-agent \
            --label com.jydn.chengwang.component=m2b-probe-agent-candidate \
            --label com.jydn.chengwang.active-probes=true \
            --label com.jydn.chengwang.advisory-only=true \
            --label com.jydn.chengwang.egress-approved=false \
            --entrypoint /usr/local/bin/python3 "$PYTHON_TEST_IMAGE" -c 'import time; time.sleep(600)')"
          test "${#container_id}" -eq 64
          before="$(/usr/bin/docker inspect --format '{{.Id}}|{{.Image}}|{{.State.StartedAt}}|{{.RestartCount}}|{{.State.Pid}}' "$container_id")"
          test "$(/usr/bin/docker inspect --format '{{.State.Running}}' "$container_id")" = true

          cd chengwang
          for variant in ordinary race; do
            race_flag=()
            if [ "$variant" = race ]; then
              race_flag=(-race)
            fi
            CHENGWANG_DOCKER_FIXTURE_PROJECT="$fixture_project" \
            CHENGWANG_DOCKER_FIXTURE_CONTAINER_ID="$container_id" \
              CGO_ENABLED=1 GOTOOLCHAIN=local GOFLAGS=-mod=vendor GOPROXY=off GOSUMDB=off \
              /opt/hostedtoolcache/go/1.23.12/x64/bin/go test "${race_flag[@]}" -json \
                -tags dockerdaemon -run '^TestDockerDaemonFixtureReadOnlySnapshotCompatibility$' \
                -count=1 ./internal/dockerreadonlyproxy \
              | /usr/bin/tee "$transcript_dir/${variant}.json"
          done
          after="$(/usr/bin/docker inspect --format '{{.Id}}|{{.Image}}|{{.State.StartedAt}}|{{.RestartCount}}|{{.State.Pid}}' "$container_id")"
          test "$before" = "$after"

          /usr/bin/python3 - "$transcript_dir/ordinary.json" "$transcript_dir/race.json" <<'PY'
          import json
          import pathlib
          import sys

          target = "TestDockerDaemonFixtureReadOnlySnapshotCompatibility"
          package = "chengwang/internal/dockerreadonlyproxy"
          for raw in sys.argv[1:]:
              path = pathlib.Path(raw).resolve(strict=True)
              runs = set()
              passes = set()
              package_passed = False
              with path.open(encoding="utf-8") as stream:
                  for line_number, line in enumerate(stream, 1):
                      event = json.loads(line)
                      if event.get("Action") in {"fail", "skip"}:
                          raise SystemExit(f"Docker fixture fail/skip at {path}:{line_number}: {event}")
                      test = event.get("Test")
                      if event.get("Action") == "run" and test:
                          runs.add(test)
                      if event.get("Action") == "pass" and test:
                          passes.add(test)
                      if event.get("Action") == "pass" and event.get("Package") == package and test is None:
                          package_passed = True
              if runs != {target} or passes != {target} or not package_passed:
                  raise SystemExit(
                      f"Docker fixture exact contract failed: runs={sorted(runs)} "
                      f"passes={sorted(passes)} packagePass={package_passed}"
                  )
          print("DOCKER_RUNTIME_FIXTURE=PASS transcripts=2 exact=1 skips=0 race=pass boundary=LOCAL_DAEMON_FIXTURE_COMPATIBILITY")
          PY

          cd "$GITHUB_WORKSPACE"
          cleanup
          trap - EXIT
          container_id=""
          network_id=""
          if /usr/bin/docker container inspect "$fixture_container" >/dev/null 2>&1 || \
             /usr/bin/docker network inspect "$fixture_network" >/dev/null 2>&1; then
            echo 'fixture cleanup verification failed' >&2
            exit 1
          fi
          echo 'DOCKER_RUNTIME_OBSERVER_BOUNDARY=ADVISORY_LOCAL_DOCKER_RUNTIME_BOUND authorization=BLOCKED blockers=9 production=false'

      - name: Run probe restore root syscall-path gate in a locked-down container
        shell: bash
        env:
          PYTHON_TEST_IMAGE: python:3.12.12-slim-bookworm@sha256:2986c55feb36e6cae00fa1fefb454283e4b33f35e75ff8bdd123b134130be301
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/chengwang-proberestore-artifacts"
          root_fixture="$RUNNER_TEMP/chengwang-proberestore-rootfs"
          container_name="chengwang-proberestore-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            /usr/bin/docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          /usr/bin/install -d -m 0755 "$artifact_dir"
          /usr/bin/sudo --non-interactive /usr/bin/install -d -o 0 -g 0 -m 0700 "$root_fixture"

          cd chengwang
          CGO_ENABLED=0 GOTOOLCHAIN=local GOFLAGS=-mod=vendor GOPROXY=off GOSUMDB=off \
            /opt/hostedtoolcache/go/1.23.12/x64/bin/go test -c \
              -tags proberestore_root -o "$artifact_dir/proberestore-root.test" ./internal/proberestore
          /usr/bin/chmod 0555 "$artifact_dir/proberestore-root.test"

          /usr/bin/timeout --signal=KILL 5m \
            /usr/bin/docker run --rm --init --pull never --platform linux/amd64 \
              --name "$container_name" \
              --network none --read-only --user 0:0 \
              --cap-drop ALL --security-opt no-new-privileges \
              --pids-limit 128 --memory 512m --cpus 2 \
              --mount "type=bind,src=$artifact_dir,dst=/tests,readonly" \
              --mount "type=bind,src=$root_fixture,dst=/root" \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777 \
              --env GOMAXPROCS=2 --env LANG=C.UTF-8 --env TZ=UTC \
              --entrypoint /tests/proberestore-root.test \
              "$PYTHON_TEST_IMAGE" \
              -test.v=test2json -test.count=1 -test.timeout=3m 2>&1 \
            | /opt/hostedtoolcache/go/1.23.12/x64/bin/go tool test2json \
                -p chengwang/internal/proberestore \
            | /usr/bin/tee "$artifact_dir/proberestore-root.json"

          /usr/bin/python3 - "$artifact_dir/proberestore-root.json" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1]).resolve(strict=True)
          linux_top_level_runs = set()
          fault_stage_runs = set()
          package_passed = False
          expected_linux_top_level = {
              "TestLinuxStoreCreateSaveReopenAndSingleWriter",
              "TestLinuxCommitFsyncFailurePoisonsStore",
              "TestLinuxTruncatedControlRecordFailsOnReopen",
              "TestLinuxOldCompleteControlReplayFailsClosed",
              "TestLinuxLockUnlinkRecreateDetected",
              "TestLinuxRejectsNonEmptyLock",
              "TestLinuxControlDirectoryPathReplacementDetected",
              "TestLinuxTerminalReceiptPreventsAllIdentityReplay",
              "TestLinuxRejectsUnsafeAncestorsAndPermissions",
              "TestLinuxControlFilesRoot0600SingleLink",
              "TestLinuxRejectsHardLinkedControlRecord",
              "TestLinuxOpenHandlesOrphanTempsSafely",
              "TestLinuxCommitFaultBoundariesNeverExposePartialControl",
              "TestLinuxCrashAtRenameBoundariesReopensCompleteControl",
          }
          fault_prefix = "TestLinuxCommitFaultBoundariesNeverExposePartialControl/"
          expected_fault_stages = {
              "before-temp-write",
              "after-temp-write",
              "before-temp-sync",
              "after-temp-sync",
              "before-renameat",
              "after-renameat",
              "before-directory-fsync",
              "after-directory-fsync",
          }
          with path.open(encoding="utf-8") as handle:
              for line_number, line in enumerate(handle, 1):
                  event = json.loads(line)
                  if event.get("Action") == "skip":
                      raise SystemExit(f"Go skip is forbidden at {path}:{line_number}: {event}")
                  test = event.get("Test")
                  if event.get("Action") == "run" and isinstance(test, str):
                      if test.startswith("TestLinux") and "/" not in test:
                          linux_top_level_runs.add(test)
                      if test.startswith(fault_prefix):
                          fault_stage_runs.add(test.removeprefix(fault_prefix))
                  if event.get("Action") == "pass" and event.get("Package") == "chengwang/internal/proberestore" and test is None:
                      package_passed = True
          if linux_top_level_runs != expected_linux_top_level:
              raise SystemExit(
                  "Linux root scenario mismatch: "
                  f"missing={sorted(expected_linux_top_level - linux_top_level_runs)} "
                  f"unexpected={sorted(linux_top_level_runs - expected_linux_top_level)}"
              )
          if fault_stage_runs != expected_fault_stages:
              raise SystemExit(
                  "durability fault-stage mismatch: "
                  f"missing={sorted(expected_fault_stages - fault_stage_runs)} "
                  f"unexpected={sorted(fault_stage_runs - expected_fault_stages)}"
              )
          if not package_passed:
              raise SystemExit("proberestore package did not emit a passing terminal event")
          print("PROBE_RESTORE_ROOT_GATE=PASS linux_root_scenarios=14 fault_stage_cases=8 skips=0 filesystem=ext4-or-xfs")
          PY

      - name: Run restore evidence root durability gate in a locked-down container
        shell: bash
        env:
          PYTHON_TEST_IMAGE: python:3.12.12-slim-bookworm@sha256:2986c55feb36e6cae00fa1fefb454283e4b33f35e75ff8bdd123b134130be301
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/chengwang-restoreevidence-artifacts"
          root_fixture="$RUNNER_TEMP/chengwang-restoreevidence-rootfs"
          container_name="chengwang-restoreevidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            /usr/bin/docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          /usr/bin/install -d -m 0755 "$artifact_dir"
          /usr/bin/sudo --non-interactive /usr/bin/install -d -o 0 -g 0 -m 0700 "$root_fixture"

          cd chengwang
          CGO_ENABLED=0 GOTOOLCHAIN=local GOFLAGS=-mod=vendor GOPROXY=off GOSUMDB=off \
            /opt/hostedtoolcache/go/1.23.12/x64/bin/go test -c \
              -tags restoreevidence_root -o "$artifact_dir/restoreevidence-root.test" ./internal/restoreevidence
          /usr/bin/chmod 0555 "$artifact_dir/restoreevidence-root.test"

          /usr/bin/timeout --signal=KILL 5m \
            /usr/bin/docker run --rm --init --pull never --platform linux/amd64 \
              --name "$container_name" \
              --network none --read-only --user 0:0 \
              --cap-drop ALL --security-opt no-new-privileges \
              --pids-limit 128 --memory 512m --cpus 2 \
              --mount "type=bind,src=$artifact_dir,dst=/tests,readonly" \
              --mount "type=bind,src=$root_fixture,dst=/root/restoreevidence" \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777 \
              --env RESTOREEVIDENCE_ROOT_TEST_DIR=/root/restoreevidence \
              --env GOMAXPROCS=2 --env LANG=C.UTF-8 --env TZ=UTC \
              --entrypoint /tests/restoreevidence-root.test \
              "$PYTHON_TEST_IMAGE" \
              -test.v=test2json -test.count=1 -test.timeout=3m 2>&1 \
            | /opt/hostedtoolcache/go/1.23.12/x64/bin/go tool test2json \
                -p chengwang/internal/restoreevidence \
            | /usr/bin/tee "$artifact_dir/restoreevidence-root.json"

          /usr/bin/python3 - "$artifact_dir/restoreevidence-root.json" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1]).resolve(strict=True)
          linux_top_level_runs = set()
          fault_stage_runs = set()
          critical_subscenario_runs = set()
          package_passed = False
          expected_linux_top_level = {
              "TestLinuxPublishReadAndIdempotence",
              "TestLinuxPlatformClockUsesKernelSources",
              "TestLinuxPublishRejectsInvalidAndStaleInputs",
              "TestLinuxFaultStagesAreTriStateAndPoisonAfterLink",
              "TestLinuxEEXISTCleanupFailureIsNeverIdempotentSuccess",
              "TestLinuxReadbackRejectsSameLengthMutation",
              "TestLinuxConflictPoisonsButNeverOverwrites",
              "TestLinuxConcurrentDifferentBytesHasOneWinner",
              "TestLinuxRejectsUnsafeObjectsDirectoryRebindLockAndOrphan",
              "TestLinuxExclusiveWriterLock",
              "TestLinuxSecurityMetadataAndDirectoryLimit",
          }
          fault_prefix = "TestLinuxFaultStagesAreTriStateAndPoisonAfterLink/"
          critical_subscenario_prefixes = (
              "TestLinuxPublishRejectsInvalidAndStaleInputs/",
              "TestLinuxRejectsUnsafeObjectsDirectoryRebindLockAndOrphan/",
              "TestLinuxSecurityMetadataAndDirectoryLimit/",
          )
          expected_critical_subscenarios = {
              "TestLinuxPublishRejectsInvalidAndStaleInputs/digest_mismatch",
              "TestLinuxPublishRejectsInvalidAndStaleInputs/missing_field",
              "TestLinuxPublishRejectsInvalidAndStaleInputs/expired",
              "TestLinuxPublishRejectsInvalidAndStaleInputs/future_wall",
              "TestLinuxPublishRejectsInvalidAndStaleInputs/boot_mismatch",
              "TestLinuxPublishRejectsInvalidAndStaleInputs/boottime_stale",
              "TestLinuxRejectsUnsafeObjectsDirectoryRebindLockAndOrphan/symlink_target",
              "TestLinuxRejectsUnsafeObjectsDirectoryRebindLockAndOrphan/hardlink_target",
              "TestLinuxRejectsUnsafeObjectsDirectoryRebindLockAndOrphan/lock_replacement",
              "TestLinuxRejectsUnsafeObjectsDirectoryRebindLockAndOrphan/orphan_left_for_inspection",
              "TestLinuxRejectsUnsafeObjectsDirectoryRebindLockAndOrphan/directory_replacement",
              "TestLinuxSecurityMetadataAndDirectoryLimit/gid_rejected",
              "TestLinuxSecurityMetadataAndDirectoryLimit/device_and_mount_mismatch",
              "TestLinuxSecurityMetadataAndDirectoryLimit/directory_entry_cap",
              "TestLinuxSecurityMetadataAndDirectoryLimit/long_lived_store_preserves_publish_headroom",
              "TestLinuxSecurityMetadataAndDirectoryLimit/near_cap_target_name_must_still_be_a_secure_file",
          }
          expected_fault_stages = {
              "before-temp-create",
              "after-temp-create",
              "before-write",
              "after-write",
              "before-temp-file-fsync",
              "after-temp-file-fsync",
              "before-temp-directory-fsync",
              "after-temp-directory-fsync",
              "before-link",
              "after-link",
              "before-published-file-fsync",
              "after-published-file-fsync",
              "before-commit-directory-fsync",
              "after-commit-directory-fsync",
              "before-temp-unlink",
              "after-temp-unlink",
              "before-cleanup-directory-fsync",
              "after-cleanup-directory-fsync",
              "before-readback",
              "after-readback",
          }
          with path.open(encoding="utf-8") as handle:
              for line_number, line in enumerate(handle, 1):
                  event = json.loads(line)
                  if event.get("Action") in {"fail", "skip"}:
                      raise SystemExit(f"Go fail/skip is forbidden at {path}:{line_number}: {event}")
                  test = event.get("Test")
                  if event.get("Action") == "run" and isinstance(test, str):
                      if test.startswith("TestLinux") and "/" not in test:
                          linux_top_level_runs.add(test)
                      if test.startswith(fault_prefix):
                          fault_stage_runs.add(test.removeprefix(fault_prefix))
                      if test.startswith(critical_subscenario_prefixes):
                          critical_subscenario_runs.add(test)
                  if event.get("Action") == "pass" and event.get("Package") == "chengwang/internal/restoreevidence" and test is None:
                      package_passed = True
          if linux_top_level_runs != expected_linux_top_level:
              raise SystemExit(
                  "restore evidence Linux root scenario mismatch: "
                  f"missing={sorted(expected_linux_top_level - linux_top_level_runs)} "
                  f"unexpected={sorted(linux_top_level_runs - expected_linux_top_level)}"
              )
          if fault_stage_runs != expected_fault_stages:
              raise SystemExit(
                  "restore evidence durability fault-stage mismatch: "
                  f"missing={sorted(expected_fault_stages - fault_stage_runs)} "
                  f"unexpected={sorted(fault_stage_runs - expected_fault_stages)}"
              )
          if critical_subscenario_runs != expected_critical_subscenarios:
              raise SystemExit(
                  "restore evidence critical subscenario mismatch: "
                  f"missing={sorted(expected_critical_subscenarios - critical_subscenario_runs)} "
                  f"unexpected={sorted(critical_subscenario_runs - expected_critical_subscenarios)}"
              )
          if not package_passed:
              raise SystemExit("restoreevidence package did not emit a passing terminal event")
          print("RESTORE_EVIDENCE_ROOT_GATE=PASS linux_root_scenarios=11 critical_subscenarios=16 fault_stage_cases=20 skips=0 filesystem=ext4-or-xfs")
          PY

      - name: Exercise blocked pre-live restore coordinator model
        shell: bash
        env:
          PYTHON_TEST_IMAGE: python:3.12.12-slim-bookworm@sha256:2986c55feb36e6cae00fa1fefb454283e4b33f35e75ff8bdd123b134130be301
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/chengwang-restorecoordinator-artifacts"
          root_fixture="$RUNNER_TEMP/chengwang-restorecoordinator-rootfs"
          container_name="chengwang-restorecoordinator-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            /usr/bin/docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          /usr/bin/install -d -m 0755 "$artifact_dir"
          /usr/bin/sudo --non-interactive /usr/bin/install -d -o 0 -g 0 -m 0700 "$root_fixture"

          cd chengwang
          CGO_ENABLED=0 GOTOOLCHAIN=local GOFLAGS=-mod=vendor GOPROXY=off GOSUMDB=off \
            /opt/hostedtoolcache/go/1.23.12/x64/bin/go test -c \
              -tags restorecoordinator_root -o "$artifact_dir/restorecoordinator-root.test" ./internal/restorecoordinator
          /usr/bin/chmod 0555 "$artifact_dir/restorecoordinator-root.test"

          /usr/bin/timeout --signal=KILL 5m \
            /usr/bin/docker run --rm --init --pull never --platform linux/amd64 \
              --name "$container_name" \
              --network none --read-only --user 0:0 \
              --cap-drop ALL --security-opt no-new-privileges \
              --pids-limit 128 --memory 512m --cpus 2 \
              --mount "type=bind,src=$artifact_dir,dst=/tests,readonly" \
              --mount "type=bind,src=$root_fixture,dst=/root/restorecoordinator" \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777 \
              --env RESTORECOORDINATOR_ROOT_TEST_DIR=/root/restorecoordinator \
              --env GOMAXPROCS=2 --env LANG=C.UTF-8 --env TZ=UTC \
              --entrypoint /tests/restorecoordinator-root.test \
              "$PYTHON_TEST_IMAGE" \
              -test.v=test2json -test.count=1 -test.timeout=3m 2>&1 \
            | /opt/hostedtoolcache/go/1.23.12/x64/bin/go tool test2json \
                -p chengwang/internal/restorecoordinator \
            | /usr/bin/tee "$artifact_dir/restorecoordinator-root.json"

          /usr/bin/python3 - "$artifact_dir/restorecoordinator-root.json" <<'PY'
