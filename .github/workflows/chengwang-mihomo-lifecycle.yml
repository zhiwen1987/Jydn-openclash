name: Chengwang Mihomo Lifecycle Foundations

on:
  workflow_dispatch:
  push:
    branches: [codex/chengwang-mihomo-lifecycle-20261024]

permissions:
  contents: read

concurrency:
  group: chengwang-mihomo-lifecycle-foundations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  development-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Reject use outside the isolated development branch
        env:
          REQUEST_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REQUEST_REF" = refs/heads/codex/chengwang-mihomo-lifecycle-20261024

  contracts:
    needs: development-only
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: 1.23.12
          cache: false
      - name: Run separately labelled Python protocol models
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mihomo-foundation-models"
          test ! -e "$root"
          install -d -m 0700 "$root"
          (cd chengwang/tools/mihomo-runtime-candidate && python3 -B -m unittest -v test_consume_pin) 2>&1 | tee "$root/pin-models.log"
          (cd chengwang/deploy/mihomo-lifecycle-lab && python3 -B -m unittest -v test_check_contracts) 2>&1 | tee "$root/go-evidence-models.log"
          python3 - "$root" <<'PY'
          import ast,hashlib,importlib.util,json,re,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          checks=[('pin-models.log','chengwang/tools/mihomo-runtime-candidate/test_consume_pin.py','SyntheticConsumptionContracts',47,'390ff9bf1c63f9d586de54df624d81fedbaa2258d0e82f39e7108e1063c7c6fc'),('go-evidence-models.log','chengwang/deploy/mihomo-lifecycle-lab/test_check_contracts.py','ContractEvidenceModels',26,'c983fbe5dba8dd8cb7f476b8fb346348e5afc0f739474fcc152d713a93c3c2e6')]
          for log,path,cls,count,pin in checks:
              text=(root/log).read_text(encoding='utf8').replace('\r\n','\n')
              tree=ast.parse(Path(path).read_text(encoding='utf8'))
              names=sorted(n.name for c in tree.body if isinstance(c,ast.ClassDef) and c.name==cls for n in c.body if isinstance(n,ast.FunctionDef) and n.name.startswith('test_'))
              observed=re.findall(r'^(test_[A-Za-z0-9_]+) \([A-Za-z0-9_]+\.'+cls+r'\.(test_[A-Za-z0-9_]+)\) \.\.\. ok$',text,re.M)
              assert len(names)==len(set(names))==count and len(observed)==count and all(a==b for a,b in observed)
              assert sorted(a for a,_ in observed)==names and hashlib.sha256('\n'.join(names).encode()).hexdigest()==pin
              assert re.findall(r'^Ran ([0-9]+) tests in [0-9.]+s$',text,re.M)==[str(count)] and re.findall(r'^OK$',text,re.M)==['OK']
              assert not re.search(r'^FAILED|^ERROR:|^FAIL:|\.\.\. skipped|^OK \(skipped=',text,re.M)
          print('PYTHON_MODELS=PASS pin47 evidence26 not_go_or_kernel_execution=true')
