name: Chengwang Real Subscription UI Browser

on:
  workflow_dispatch:
  push:
    branches: [codex/chengwang-security-hardening]
    paths:
      - '.github/workflows/chengwang-subscription-ui-browser.yml'
      - 'chengwang/deploy/subscription-ui-browser/**'
      - 'chengwang/tools/subscription-ui-browser/**'
      - 'chengwang/tools/subscription-browser/**'
      - 'chengwang/tools/browser-runtime-candidate/**'
      - 'chengwang/tools/browser-acquisition/check_acquisition.py'
      - 'chengwang/tools/browser-acquisition/candidate.json'
      - 'chengwang/deploy/probe-readback/run_probe_readback.py'
      - 'chengwang/deploy/browser-stream-matrix/run_matrix.py'
      - 'chengwang/web/scripts/trust-browser-tls.mjs'
      - 'chengwang/web/**'
      - 'chengwang/internal/**'
      - 'chengwang/cmd/server/**'
      - 'chengwang/go.mod'
      - 'chengwang/go.sum'
      - 'chengwang/vendor/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/chengwang-subscription-ui-browser.yml'
      - 'chengwang/deploy/subscription-ui-browser/**'
      - 'chengwang/tools/subscription-ui-browser/**'
      - 'chengwang/tools/subscription-browser/**'
      - 'chengwang/tools/browser-runtime-candidate/**'
      - 'chengwang/tools/browser-acquisition/check_acquisition.py'
      - 'chengwang/tools/browser-acquisition/candidate.json'
      - 'chengwang/deploy/probe-readback/run_probe_readback.py'
      - 'chengwang/deploy/browser-stream-matrix/run_matrix.py'
      - 'chengwang/web/scripts/trust-browser-tls.mjs'
      - 'chengwang/web/**'
      - 'chengwang/internal/**'
      - 'chengwang/cmd/server/**'
      - 'chengwang/go.mod'
      - 'chengwang/go.sum'
      - 'chengwang/vendor/**'

permissions:
  contents: read

concurrency:
  group: chengwang-subscription-ui-browser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser:
    name: Real product ${{ matrix.scenario }} (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        engine: [chrome-cdp, playwright]
        scenario: [create_receipt, local_admission]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
          check-latest: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: 1.23.12
          check-latest: false
          cache: false

      - name: Prepare locked CI-only dependencies and normal system fonts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node --version)" = v22.23.3
          test "$(go version | awk '{print $3}')" = go1.23.12
          lab="$RUNNER_TEMP/subscription-ui"
          test ! -e "$lab"
          install -d -m 0700 "$lab" "$lab/bin" "$lab/cache" "$lab/reports" "$lab/web-build"
          cp -a chengwang/web/. "$lab/web-build/"
          npm ci --prefix "$lab/web-build" --ignore-scripts --no-audit --no-fund
          npm ci --prefix chengwang/tools/subscription-ui-browser --ignore-scripts --no-audit --no-fund
          sudo --non-interactive install -m 0555 "$(command -v node)" "$lab/bin/node"
          sudo --non-interactive apt-get update -qq
          sudo --non-interactive apt-get install -y --no-install-recommends libnss3-tools fonts-noto-cjk

      - name: Build real cmd/server and exact product Web offline
        shell: bash
        run: |
          set -euo pipefail
          lab="$RUNNER_TEMP/subscription-ui"
          sudo --non-interactive unshare --mount --net --fork /usr/bin/bash -s -- \
            "$GITHUB_WORKSPACE" "$lab" "$(command -v node)" "$(command -v go)" "$(id -u)" "$(id -g)" <<'SH'
          set -euo pipefail
          source_root="$1"; lab="$2"; node_binary="$3"; go_binary="$4"; task_uid="$5"; task_gid="$6"
          mount --make-rprivate /
          mount --bind "$source_root" "$source_root"
          mount -o remount,bind,ro,nosuid,nodev "$source_root"
          ip link set lo up
          test "$(ip -o link show | wc -l)" -eq 1
          test -z "$(ip -4 route show default)"
          test -z "$(ip -6 route show default)"
          cd "$source_root/chengwang"
          setpriv --reuid="$task_uid" --regid="$task_gid" --clear-groups --bounding-set=-all \
            --inh-caps=-all --ambient-caps=-all --no-new-privs env -i PATH=/usr/bin:/bin LANG=C \
            GOWORK=off GOENV=off GOTOOLCHAIN=local GOFLAGS=-mod=vendor GOPROXY=off GOSUMDB=off CGO_ENABLED=0 \
            GOCACHE="$lab/cache" "$go_binary" build -trimpath -o "$lab/bin/server" ./cmd/server
          cd "$lab/web-build"
          setpriv --reuid="$task_uid" --regid="$task_gid" --clear-groups --bounding-set=-all \
            --inh-caps=-all --ambient-caps=-all --no-new-privs env -i PATH=/usr/bin:/bin LANG=C \
            "$node_binary" node_modules/typescript/bin/tsc -b
          setpriv --reuid="$task_uid" --regid="$task_gid" --clear-groups --bounding-set=-all \
            --inh-caps=-all --ambient-caps=-all --no-new-privs env -i PATH=/usr/bin:/bin LANG=C \
            "$node_binary" node_modules/vite/bin/vite.js build
          SH
          python3 -B - "$lab" "$GITHUB_SHA" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); dist=root/'web-build/dist'; records=[]
          digest=lambda raw:hashlib.sha256(raw).hexdigest()
          for path in sorted(dist.rglob('*')):
              if path.is_symlink(): raise SystemExit('dist-link-rejected')
              if path.is_dir(): continue
              raw=path.read_bytes(); records.append(dict(path=path.relative_to(dist).as_posix(),bytes=len(raw),sha256=digest(raw)))
          if not {'index.html','trust.html','.vite/manifest.json'} <= {r['path'] for r in records}: raise SystemExit('dist-incomplete')
          binary=(root/'bin/server').read_bytes()
          if binary[:4] != b'\x7fELF': raise SystemExit('server-not-elf')
          value=dict(schema='chengwang.subscription-ui-build/v1',sourceCommit=sys.argv[2],goVersion='go1.23.12',nodeVersion='v22.23.3',
              moduleMode='vendor',goDependencyDownloads=False,server=dict(name='server',bytes=len(binary),sha256=digest(binary)),
              distFiles=records,production=False,authorization='BLOCKED')
          with (root/'build.json').open('xb') as f:f.write((json.dumps(value,sort_keys=True,separators=(',',':'))+'\n').encode())
          PY

      - name: Preserve actual synthetic test output separately from real UI acceptance
        shell: bash
        run: |
          set -euo pipefail
          reports="$RUNNER_TEMP/subscription-ui/reports"
          node --test --test-reporter=tap chengwang/tools/subscription-ui-browser/test-ui-contract.mjs \
            2>&1 | tee "$reports/node.tap"
          (cd chengwang/deploy/subscription-ui-browser && python3 -B -m unittest -v test_run_subscription_ui) \
            2>&1 | tee "$reports/runner.log"
          (cd chengwang/deploy/subscription-ui-browser && python3 -B -m unittest -v test_check_subscription_ui) \
            2>&1 | tee "$reports/checker.log"
          python3 -B chengwang/deploy/subscription-ui-browser/check_ui_synthetic.py \
            --evidence "$reports" --source-commit "$GITHUB_SHA" --report "$reports/synthetic.json"
          node --test --test-reporter=tap chengwang/tools/subscription-ui-browser/test-admission-contract.mjs \
            2>&1 | tee "$reports/admission-node.tap"
          (cd chengwang/deploy/subscription-ui-browser && python3 -B -m unittest -v test_admission_fixture) \
            2>&1 | tee "$reports/admission-fixture.log"
          (cd chengwang/deploy/subscription-ui-browser && python3 -B -m unittest -v test_check_admission_ui) \
            2>&1 | tee "$reports/admission-checker.log"
          python3 -B chengwang/deploy/subscription-ui-browser/check_admission_synthetic.py \
            --evidence "$reports" --source-commit "$GITHUB_SHA" --report "$reports/admission-synthetic.json"

      - name: Enforce reviewed browser pin and independently read actual expansion
        shell: bash
        run: |
          set -euo pipefail
          lab="$RUNNER_TEMP/subscription-ui"
          python3 -B chengwang/tools/browser-runtime-candidate/consume_pin.py \
            --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" --output "$lab/consumption" \
            --report "$lab/reports/consumption.json" 2>&1 | tee "$lab/reports/consumption-original.log"
          python3 -B chengwang/tools/browser-runtime-candidate/check_consumption.py \
            --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" --evidence "$lab/consumption" \
            --report "$lab/reports/consumption-independent.json" 2>&1 | tee "$lab/reports/consumption-independent-original.log"
          cmp "$lab/reports/consumption.json" "$lab/reports/consumption-independent.json"

      - name: Actually operate built product through normal TLS with no mock API
        shell: bash
        run: |
          set -euo pipefail
          lab="$RUNNER_TEMP/subscription-ui"
          sudo --non-interactive env GITHUB_ACTIONS=true RUNNER_OS=Linux \
            /usr/bin/python3 -I -B chengwang/deploy/subscription-ui-browser/run_subscription_ui.py \
            --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" --engine '${{ matrix.engine }}' \
            --scenario '${{ matrix.scenario }}' \
            --consumption-root "$lab/consumption" --consumption-report "$lab/reports/consumption-independent.json" \
            --node "$lab/bin/node" --server "$lab/bin/server" --dist "$lab/web-build/dist" --build-report "$lab/build.json" \
            --output-dir "$lab/reports/originals" 2>&1 | tee "$lab/reports/supervisor-original.log"

      - name: Independent original API DOM PNG audit persistence and lifecycle verification
        shell: bash
        run: |
          set -euo pipefail
          lab="$RUNNER_TEMP/subscription-ui"
          checker=chengwang/deploy/subscription-ui-browser/check_subscription_ui.py
          if test '${{ matrix.scenario }}' = local_admission; then
            checker=chengwang/deploy/subscription-ui-browser/check_admission_ui.py
          fi
          sudo --non-interactive /usr/bin/python3 -I -B "$checker" \
            --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" --engine '${{ matrix.engine }}' \
            --evidence "$lab/reports/originals" --report "$lab/reports/independent.json" \
            2>&1 | tee "$lab/reports/independent-original.log"
          git diff --exit-code

      - name: Preserve only structured public originals and PNGs, including failures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sudo --non-interactive chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/subscription-ui/reports"
          chmod -R u+rX,go-rwx "$RUNNER_TEMP/subscription-ui/reports"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: subscription-ui-${{ matrix.scenario }}-${{ matrix.engine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subscription-ui/reports
          if-no-files-found: error
          retention-days: 14

  fresh:
    name: Fresh original ${{ matrix.scenario }} replay (${{ matrix.engine }})
    needs: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [chrome-cdp, playwright]
        scenario: [create_receipt, local_admission]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: subscription-ui-${{ matrix.scenario }}-${{ matrix.engine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subscription-ui-input
      - name: Recompute from original public files without any running product or browser
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/subscription-ui-fresh"
          checker=chengwang/deploy/subscription-ui-browser/check_subscription_ui.py
          if test '${{ matrix.scenario }}' = local_admission; then
            checker=chengwang/deploy/subscription-ui-browser/check_admission_ui.py
          fi
          python3 -B "$checker" \
            --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" --engine '${{ matrix.engine }}' \
            --evidence "$RUNNER_TEMP/subscription-ui-input/originals" --report "$RUNNER_TEMP/subscription-ui-fresh/independent.json" \
            2>&1 | tee "$RUNNER_TEMP/subscription-ui-fresh/independent-original.log"
          cmp "$RUNNER_TEMP/subscription-ui-input/independent.json" "$RUNNER_TEMP/subscription-ui-fresh/independent.json"
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: subscription-ui-fresh-${{ matrix.scenario }}-${{ matrix.engine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subscription-ui-fresh
          if-no-files-found: error
          retention-days: 14
