name: Chengwang Real Subscription UI Browser

on:
  workflow_dispatch:
  push:
    branches: [codex/chengwang-security-hardening, codex/chengwang-live-overview-20261024]
    paths:
      - '.github/workflows/chengwang-subscription-ui-browser.yml'
      - 'chengwang/deploy/subscription-ui-browser/**'
      - 'chengwang/deploy/browser-scene-supervisor/**'
      - 'chengwang/deploy/capability-truth-browser/**'
      - 'chengwang/tools/capability-truth-browser/**'
      - 'chengwang/tools/subscription-ui-browser/**'
      - 'chengwang/tools/subscription-browser/**'
      - 'chengwang/tools/browser-runtime-candidate/**'
      - 'chengwang/tools/browser-acquisition/check_acquisition.py'
      - 'chengwang/tools/browser-acquisition/candidate.json'
      - 'chengwang/deploy/probe-readback/run_probe_readback.py'
      - 'chengwang/deploy/browser-stream-matrix/run_matrix.py'
      - 'chengwang/web/scripts/trust-browser-tls.mjs'
      - 'chengwang/web/**'
      - 'chengwang/internal/**'
      - 'chengwang/cmd/server/**'
      - 'chengwang/go.mod'
      - 'chengwang/go.sum'
      - 'chengwang/vendor/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/chengwang-subscription-ui-browser.yml'
      - 'chengwang/deploy/subscription-ui-browser/**'
      - 'chengwang/deploy/browser-scene-supervisor/**'
      - 'chengwang/deploy/capability-truth-browser/**'
      - 'chengwang/tools/capability-truth-browser/**'
      - 'chengwang/tools/subscription-ui-browser/**'
      - 'chengwang/tools/subscription-browser/**'
      - 'chengwang/tools/browser-runtime-candidate/**'
      - 'chengwang/tools/browser-acquisition/check_acquisition.py'
      - 'chengwang/tools/browser-acquisition/candidate.json'
      - 'chengwang/deploy/probe-readback/run_probe_readback.py'
      - 'chengwang/deploy/browser-stream-matrix/run_matrix.py'
      - 'chengwang/web/scripts/trust-browser-tls.mjs'
      - 'chengwang/web/**'
      - 'chengwang/internal/**'
      - 'chengwang/cmd/server/**'
      - 'chengwang/go.mod'
      - 'chengwang/go.sum'
      - 'chengwang/vendor/**'

permissions:
  contents: read

concurrency:
  group: chengwang-subscription-ui-browser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser:
    name: Real product ${{ matrix.scenario }} (${{ matrix.engine }}) ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        engine: [chrome-cdp, playwright]
        scenario: [create_receipt, local_admission, remote_fetch, remote_handoff_negative]
        include:
          - { engine: chrome-cdp, scenario: capability_truth, profile: default }
          - { engine: playwright, scenario: capability_truth, profile: default }
          - { engine: chrome-cdp, scenario: capability_truth, profile: backend_configured }
          - { engine: playwright, scenario: capability_truth, profile: backend_configured }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
          check-latest: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: 1.23.12
          check-latest: false
          cache: false

      - name: Prepare locked CI-only tools and dependency contract tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node --version)" = v22.23.3
          test "$(go version | awk '{print $3}')" = go1.23.12
          lab="$RUNNER_TEMP/subscription-ui"
          test ! -e "$lab"
          install -d -m 0700 "$lab" "$lab/bin" "$lab/cache" "$lab/reports" "$lab/web-build"
          install -d -m 0700 "$lab/reports/dependencies"
          (
            cd chengwang/deploy/subscription-ui-browser
            python3 -B - <<'PY' 2>&1 | tee "$lab/reports/dependency-unit.log"
          import ast, hashlib, importlib, pathlib, unittest
          pins = {
              'test_prepare_ci_dependencies': (35, '5103e8b25561d101fe841da3c978b4152d934f2dcafcf92c0a2aaaee536270d7'),
              'test_check_ci_dependencies': (26, '2f0ee3b7bdf4c0bf854b087cb08e94303af30d2561c219a84279a91b5ebd1506'),
              'test_keyring_diagnostic_contract': (10, 'ce7fffd8bc08f0213e1ad437bfa6e83f8132d7ebc2e4a1b6af96304fca035b4b'),
              'test_pinned_ci_keyring': (15, '8151684ea603ccf804cc313ae07743d09d9c3391f037dcf2903c78bd18b86765'),
          }
          class Recorded(unittest.TextTestResult):
              def __init__(self, *args):
                  super().__init__(*args); self.runs = []; self.passes = []
              def startTest(self, test):
                  self.runs.append(test.id()); super().startTest(test)
              def addSuccess(self, test):
                  self.passes.append(test.id()); super().addSuccess(test)
          for name, (count, expected) in pins.items():
              tree = ast.parse(pathlib.Path(name + '.py').read_bytes())
              names = sorted(name + '.' + cls.name + '.' + method.name for cls in tree.body if isinstance(cls, ast.ClassDef)
                  for method in cls.body if isinstance(method, ast.FunctionDef) and method.name.startswith('test_'))
              if len(names) != count or len(set(names)) != count or hashlib.sha256('\n'.join(names).encode()).hexdigest() != expected:
                  raise SystemExit('ci-dependency-unit-names-rejected')
              result = unittest.TextTestRunner(verbosity=2, resultclass=Recorded).run(
                  unittest.defaultTestLoader.loadTestsFromModule(importlib.import_module(name)))
              if (not result.wasSuccessful() or result.skipped or result.expectedFailures or result.unexpectedSuccesses
                  or sorted(result.runs) != names or sorted(result.passes) != names):
                  raise SystemExit('ci-dependency-unit-events-rejected')
          print('CI_DEPENDENCY_SYNTHETIC=PASS tests=' + str(sum(count for count, _ in pins.values()))
                + ' skips=0 runtime_started=false')
          PY
          )
          cp -a chengwang/web/. "$lab/web-build/"
          timeout --signal=TERM --kill-after=15s 180s \
            npm ci --prefix "$lab/web-build" --ignore-scripts --no-audit --no-fund
          timeout --signal=TERM --kill-after=15s 180s \
            npm ci --prefix chengwang/tools/subscription-ui-browser --ignore-scripts --no-audit --no-fund
          sudo --non-interactive install -m 0555 "$(command -v node)" "$lab/bin/node"

      - name: Acquire bounded dependencies through private official mirror ordering and read back actual files
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          lab="$RUNNER_TEMP/subscription-ui"
          /usr/bin/python3 -I -B chengwang/deploy/subscription-ui-browser/prepare_ci_dependencies.py \
            --reports "$lab/reports/dependencies" --source-commit "$GITHUB_SHA"

      - name: Independently verify CI dependency observations without claiming package provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          lab="$RUNNER_TEMP/subscription-ui"
          /usr/bin/python3 -B chengwang/deploy/subscription-ui-browser/check_ci_dependencies.py \
            --evidence "$lab/reports/dependencies" --source-commit "$GITHUB_SHA" \
            --repo "$GITHUB_WORKSPACE" --report "$lab/reports/dependency-verification.json"

      - name: Build real cmd/server and exact product Web offline
        shell: bash
        run: |
          set -euo pipefail
          lab="$RUNNER_TEMP/subscription-ui"
          sudo --non-interactive unshare --mount --net --fork /usr/bin/bash -s -- \
            "$GITHUB_WORKSPACE" "$lab" "$(command -v node)" "$(command -v go)" "$(id -u)" "$(id -g)" <<'SH'
          set -euo pipefail
          source_root="$1"; lab="$2"; node_binary="$3"; go_binary="$4"; task_uid="$5"; task_gid="$6"
          mount --make-rprivate /
          mount --bind "$source_root" "$source_root"
          mount -o remount,bind,ro,nosuid,nodev "$source_root"
          ip link set lo up
          test "$(ip -o link show | wc -l)" -eq 1
          test -z "$(ip -4 route show default)"
          test -z "$(ip -6 route show default)"
          cd "$source_root/chengwang"
          setpriv --reuid="$task_uid" --regid="$task_gid" --clear-groups --bounding-set=-all \
            --inh-caps=-all --ambient-caps=-all --no-new-privs env -i PATH=/usr/bin:/bin LANG=C \
            GOWORK=off GOENV=off GOTOOLCHAIN=local GOFLAGS=-mod=vendor GOPROXY=off GOSUMDB=off CGO_ENABLED=0 \
            GOCACHE="$lab/cache" "$go_binary" build -trimpath -o "$lab/bin/server" ./cmd/server
          cd "$lab/web-build"
          setpriv --reuid="$task_uid" --regid="$task_gid" --clear-groups --bounding-set=-all \
            --inh-caps=-all --ambient-caps=-all --no-new-privs env -i PATH=/usr/bin:/bin LANG=C \
            "$node_binary" node_modules/typescript/bin/tsc -b
          setpriv --reuid="$task_uid" --regid="$task_gid" --clear-groups --bounding-set=-all \
            --inh-caps=-all --ambient-caps=-all --no-new-privs env -i PATH=/usr/bin:/bin LANG=C \
            "$node_binary" node_modules/vite/bin/vite.js build
          SH
          python3 -B - "$lab" "$GITHUB_SHA" '${{ matrix.scenario }}' <<'PY'
          import base64,hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); dist=root/'web-build/dist'; records=[]
          digest=lambda raw:hashlib.sha256(raw).hexdigest()
          for path in sorted(dist.rglob('*')):
              if path.is_symlink(): raise SystemExit('dist-link-rejected')
              if path.is_dir(): continue
              raw=path.read_bytes(); records.append(dict(path=path.relative_to(dist).as_posix(),bytes=len(raw),sha256=digest(raw)))
          if not {'index.html','trust.html','.vite/manifest.json'} <= {r['path'] for r in records}: raise SystemExit('dist-incomplete')
          binary=(root/'bin/server').read_bytes()
          if binary[:4] != b'\x7fELF': raise SystemExit('server-not-elf')
          value=dict(schema='chengwang.subscription-ui-build/v1',sourceCommit=sys.argv[2],goVersion='go1.23.12',nodeVersion='v22.23.3',
              moduleMode='vendor',goDependencyDownloads=False,server=dict(name='server',bytes=len(binary),sha256=digest(binary)),
              distFiles=records,production=False,authorization='BLOCKED')
          if sys.argv[3] == 'capability_truth':
              manifest=(dist/'.vite/manifest.json').read_bytes()
              if not 0 < len(manifest) <= 262144: raise SystemExit('manifest-budget-rejected')
              value['schema']='chengwang.capability-truth-build/v1'
              value['manifestBase64']=base64.b64encode(manifest).decode('ascii')
          with (root/'build.json').open('xb') as f:f.write((json.dumps(value,sort_keys=True,separators=(',',':'))+'\n').encode())
          PY

      - name: Freeze shared lifecycle leaf contracts without claiming real process acceptance
        shell: bash
        run: |
          set -euo pipefail
          reports="$RUNNER_TEMP/subscription-ui/reports"
          (
            cd chengwang/deploy/browser-scene-supervisor
            python3 -B - <<'PY' 2>&1 | tee "$reports/lifecycle-unit.log"
          import ast, hashlib, importlib, pathlib, unittest
          module_name = 'test_lifecycle'
          tree = ast.parse(pathlib.Path(module_name + '.py').read_bytes())
          names = sorted(module_name + '.' + cls.name + '.' + method.name
              for cls in tree.body if isinstance(cls, ast.ClassDef)
              for method in cls.body if isinstance(method, ast.FunctionDef) and method.name.startswith('test_'))
          if (len(names) != 19 or len(set(names)) != 19
              or hashlib.sha256('\n'.join(names).encode()).hexdigest() != 'd9f983437ea30eda82ebaa6c8ad8927849a1b8a444e7dc9faa547705d6df79ea'):
              raise SystemExit('scene-lifecycle-unit-names-rejected')
          class Recorded(unittest.TextTestResult):
              def __init__(self, *args):
                  super().__init__(*args); self.runs = []; self.passes = []
              def startTest(self, test):
                  self.runs.append(test.id()); super().startTest(test)
              def addSuccess(self, test):
                  self.passes.append(test.id()); super().addSuccess(test)
          result = unittest.TextTestRunner(verbosity=2, resultclass=Recorded).run(
              unittest.defaultTestLoader.loadTestsFromModule(importlib.import_module(module_name)))
          if (not result.wasSuccessful() or result.testsRun != 19 or result.skipped
              or result.expectedFailures or result.unexpectedSuccesses
              or sorted(result.runs) != names or sorted(result.passes) != names):
              raise SystemExit('scene-lifecycle-unit-events-rejected')
          print('SCENE_LIFECYCLE_SYNTHETIC=PASS tests=19 skips=0 real_processes=false')
          PY
          )

      - name: Preserve new capability helper events without claiming browser acceptance
        if: matrix.scenario == 'capability_truth'
        shell: bash
        run: |
          set -euo pipefail
          reports="$RUNNER_TEMP/subscription-ui/reports"
          (cd chengwang/deploy/browser-scene-supervisor && python3 -B -m unittest -v test_supervisor) \
            2>&1 | tee "$reports/supervisor-unit.log"
          (cd chengwang/deploy/capability-truth-browser && python3 -B -m unittest -v test_capability_truth_scene) \
            2>&1 | tee "$reports/capability-scene-unit.log"
          node --test --test-reporter=tap chengwang/tools/capability-truth-browser/test-ui-contract.mjs \
            chengwang/tools/capability-truth-browser/test-ui-dom.mjs \
            chengwang/tools/capability-truth-browser/test-ui-driver.mjs \
            2>&1 | tee "$reports/capability-node.tap"
          (cd chengwang/deploy/capability-truth-browser && python3 -B -m unittest -v test_check_capability_truth) \
            2>&1 | tee "$reports/capability-checker-unit.log"
          python3 -B chengwang/deploy/capability-truth-browser/check_capability_synthetic.py \
            --evidence "$reports" --source-commit "$GITHUB_SHA" --repo "$GITHUB_WORKSPACE" \
            --report "$RUNNER_TEMP/subscription-ui/capability-synthetic.json"
          test ! -e "$reports/capability-synthetic.json"
          install -m 0600 "$RUNNER_TEMP/subscription-ui/capability-synthetic.json" "$reports/capability-synthetic.json"

      - name: Preserve actual synthetic test output separately from real UI acceptance
        shell: bash
        run: |
          set -euo pipefail
          reports="$RUNNER_TEMP/subscription-ui/reports"
          node --test --test-reporter=tap chengwang/tools/subscription-ui-browser/test-ui-contract.mjs \
            2>&1 | tee "$reports/node.tap"
          (cd chengwang/deploy/subscription-ui-browser && python3 -B -m unittest -v test_run_subscription_ui) \
            2>&1 | tee "$reports/runner.log"
          (cd chengwang/deploy/subscription-ui-browser && python3 -B -m unittest -v test_check_subscription_ui) \
            2>&1 | tee "$reports/checker.log"
          python3 -B chengwang/deploy/subscription-ui-browser/check_ui_synthetic.py \
            --evidence "$reports" --source-commit "$GITHUB_SHA" --report "$reports/synthetic.json"
          node --test --test-reporter=tap chengwang/tools/subscription-ui-browser/test-admission-contract.mjs \
            2>&1 | tee "$reports/admission-node.tap"
          (cd chengwang/deploy/subscription-ui-browser && python3 -B -m unittest -v test_admission_fixture) \
            2>&1 | tee "$reports/admission-fixture.log"
          (cd chengwang/deploy/subscription-ui-browser && python3 -B -m unittest -v test_check_admission_ui) \
            2>&1 | tee "$reports/admission-checker.log"
          python3 -B chengwang/deploy/subscription-ui-browser/check_admission_synthetic.py \
            --evidence "$reports" --source-commit "$GITHUB_SHA" --report "$reports/admission-synthetic.json"

      - name: Preserve independent remote-fetch helper events without replacing previous suites
        if: matrix.scenario == 'remote_fetch'
        shell: bash
        run: |
          set -euo pipefail
          reports="$RUNNER_TEMP/subscription-ui/reports"
          node --test --test-reporter=tap chengwang/tools/subscription-ui-browser/test-remote-fetch-contract.mjs \
            2>&1 | tee "$reports/remote-node.tap"
          (cd chengwang/deploy/subscription-ui-browser && python3 -B -m unittest -v test_remote_fetch_fixture) \
            2>&1 | tee "$reports/remote-fixture.log"
          (cd chengwang/deploy/subscription-ui-browser && python3 -B -m unittest -v test_check_remote_fetch_ui) \
            2>&1 | tee "$reports/remote-checker.log"
          (cd chengwang/deploy/subscription-ui-browser && python3 -B -m unittest -v test_check_remote_synthetic) \
            2>&1 | tee "$reports/remote-synthetic-checker.log"
          python3 -B chengwang/deploy/subscription-ui-browser/check_remote_synthetic.py \
            --evidence "$reports" --source-commit "$GITHUB_SHA" --report "$reports/remote-synthetic.json"

      - name: Preserve independent handoff-negative helper events without replacing previous suites
        if: matrix.scenario == 'remote_handoff_negative'
        shell: bash
        run: |
          set -euo pipefail
          reports="$RUNNER_TEMP/subscription-ui/reports"
          node --test --test-reporter=tap chengwang/tools/subscription-ui-browser/test-handoff-negative-contract.mjs \
            chengwang/tools/subscription-ui-browser/test-handoff-api-sampler.mjs \
            2>&1 | tee "$reports/handoff-node.tap"
          (cd chengwang/deploy/subscription-ui-browser && python3 -B -m unittest -v test_handoff_negative_fixture) \
            2>&1 | tee "$reports/handoff-fixture.log"
          (cd chengwang/deploy/subscription-ui-browser && python3 -B -m unittest -v test_check_handoff_negative_ui) \
            2>&1 | tee "$reports/handoff-checker.log"
          (cd chengwang/deploy/subscription-ui-browser && python3 -B -m unittest -v test_check_handoff_negative_synthetic) \
            2>&1 | tee "$reports/handoff-synthetic-checker.log"
          python3 -B chengwang/deploy/subscription-ui-browser/check_handoff_negative_synthetic.py \
            --evidence "$reports" --source-commit "$GITHUB_SHA" --report "$reports/handoff-synthetic.json"

      - name: Preserve independent feedback helper events without changing original business schemas
        if: matrix.scenario == 'remote_handoff_negative'
        shell: bash
        run: |
          set -euo pipefail
          reports="$RUNNER_TEMP/subscription-ui/reports"
          node --test --test-reporter=tap chengwang/tools/subscription-ui-browser/test-handoff-feedback.mjs \
            2>&1 | tee "$reports/feedback-node.tap"
          (cd chengwang/deploy/subscription-ui-browser && python3 -B -m unittest -v test_feedback_projection) \
            2>&1 | tee "$reports/feedback-projection.log"
          (cd chengwang/deploy/subscription-ui-browser && python3 -B -m unittest -v test_check_handoff_feedback) \
            2>&1 | tee "$reports/feedback-checker.log"
          python3 -B chengwang/deploy/subscription-ui-browser/check_feedback_synthetic.py \
            --evidence "$reports" --source-commit "$GITHUB_SHA" --report "$reports/feedback-synthetic.json"

      - name: Preserve navigation diagnostic helper events separately from runtime evidence
        shell: bash
        run: |
          set -euo pipefail
          reports="$RUNNER_TEMP/subscription-ui/reports"
          node --test --test-reporter=tap chengwang/tools/subscription-ui-browser/test-navigation-diagnostics.mjs \
            2>&1 | tee "$reports/navigation-node.tap"
          (cd chengwang/deploy/subscription-ui-browser && python3 -B -m unittest -v test_navigation_diagnostics) \
            2>&1 | tee "$reports/navigation-reader.log"
          (cd chengwang/deploy/subscription-ui-browser && python3 -B -m unittest -v test_check_navigation_diagnostics) \
            2>&1 | tee "$reports/navigation-checker.log"
          python3 -B chengwang/deploy/subscription-ui-browser/check_navigation_synthetic.py \
            --evidence "$reports" --source-commit "$GITHUB_SHA" --report "$reports/navigation-synthetic.json"

      - name: Freeze independent negative-handoff navigation diagnostic unit events
        if: matrix.scenario == 'remote_handoff_negative'
        shell: bash
        run: |
          set -euo pipefail
          reports="$RUNNER_TEMP/subscription-ui/reports"
          node --test --test-reporter=tap chengwang/tools/subscription-ui-browser/test-handoff-navigation-diagnostics.mjs \
            2>&1 | tee "$reports/handoff-navigation-node.tap"
          (cd chengwang/deploy/subscription-ui-browser && python3 -B -m unittest -v test_handoff_navigation_diagnostics) \
            2>&1 | tee "$reports/handoff-navigation-reader.log"
          (cd chengwang/deploy/subscription-ui-browser && python3 -B -m unittest -v test_check_handoff_navigation_diagnostics) \
            2>&1 | tee "$reports/handoff-navigation-checker.log"
          python3 -B chengwang/deploy/subscription-ui-browser/check_handoff_navigation_synthetic.py \
            --evidence "$reports" --source-commit "$GITHUB_SHA" --report "$reports/handoff-navigation-synthetic.json"

      - name: Enforce reviewed browser pin and independently read actual expansion
        shell: bash
        run: |
          set -euo pipefail
          lab="$RUNNER_TEMP/subscription-ui"
          python3 -B chengwang/tools/browser-runtime-candidate/consume_pin.py \
            --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" --output "$lab/consumption" \
            --report "$lab/reports/consumption.json" 2>&1 | tee "$lab/reports/consumption-original.log"
          python3 -B chengwang/tools/browser-runtime-candidate/check_consumption.py \
            --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" --evidence "$lab/consumption" \
            --report "$lab/reports/consumption-independent.json" 2>&1 | tee "$lab/reports/consumption-independent-original.log"
          cmp "$lab/reports/consumption.json" "$lab/reports/consumption-independent.json"

      - name: Actually operate built product through normal TLS with no mock API
        shell: bash
        run: |
          set -euo pipefail
          lab="$RUNNER_TEMP/subscription-ui"
          if test '${{ matrix.scenario }}' = capability_truth; then
            sudo --non-interactive env GITHUB_ACTIONS=true RUNNER_OS=Linux \
              /usr/bin/python3 -I -B chengwang/deploy/capability-truth-browser/run_capability_truth.py \
              --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" --engine '${{ matrix.engine }}' \
              --profile '${{ matrix.profile }}' \
              --consumption-root "$lab/consumption" --consumption-report "$lab/reports/consumption-independent.json" \
              --node "$lab/bin/node" --server "$lab/bin/server" --dist "$lab/web-build/dist" --build-report "$lab/build.json" \
              --output-dir "$lab/reports/originals" 2>&1 | tee "$lab/reports/supervisor-original.log"
            exit 0
          fi
          sudo --non-interactive env GITHUB_ACTIONS=true RUNNER_OS=Linux \
            /usr/bin/python3 -I -B chengwang/deploy/subscription-ui-browser/run_subscription_ui.py \
            --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" --engine '${{ matrix.engine }}' \
            --scenario '${{ matrix.scenario }}' \
            --consumption-root "$lab/consumption" --consumption-report "$lab/reports/consumption-independent.json" \
            --node "$lab/bin/node" --server "$lab/bin/server" --dist "$lab/web-build/dist" --build-report "$lab/build.json" \
            --output-dir "$lab/reports/originals" 2>&1 | tee "$lab/reports/supervisor-original.log"

      - name: Independently decode bounded navigation failure observations without product acceptance
        # Keep the original schema restricted to its reviewed scenarios.
        if: always() && matrix.scenario != 'remote_handoff_negative' && matrix.scenario != 'capability_truth'
        shell: bash
        run: |
          set -euo pipefail
          reports="$RUNNER_TEMP/subscription-ui/reports"
          if sudo --non-interactive test -f "$reports/originals/failure.json"; then
            sudo --non-interactive /usr/bin/python3 -I -B chengwang/deploy/subscription-ui-browser/check_navigation_diagnostics.py \
              --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" \
              --engine '${{ matrix.engine }}' --scenario '${{ matrix.scenario }}' \
              --evidence "$reports/originals" --report "$reports/navigation-diagnostic.json" \
              2>&1 | tee "$reports/navigation-diagnostic-original.log"
          fi

      - name: Independently decode negative-handoff navigation failure observations
        if: always() && matrix.scenario == 'remote_handoff_negative'
        shell: bash
        run: |
          set -euo pipefail
          reports="$RUNNER_TEMP/subscription-ui/reports"
          if sudo --non-interactive test -f "$reports/originals/failure.json"; then
            sudo --non-interactive /usr/bin/python3 -I -B chengwang/deploy/subscription-ui-browser/check_handoff_navigation_diagnostics.py \
              --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" --engine '${{ matrix.engine }}' \
              --evidence "$reports/originals" --report "$reports/handoff-navigation-diagnostic.json" \
              2>&1 | tee "$reports/handoff-navigation-diagnostic-original.log"
          fi

      - name: Independent original API DOM PNG audit persistence and lifecycle verification
        if: matrix.scenario != 'capability_truth'
        shell: bash
        run: |
          set -euo pipefail
          lab="$RUNNER_TEMP/subscription-ui"
          checker=chengwang/deploy/subscription-ui-browser/check_subscription_ui.py
          if test '${{ matrix.scenario }}' = local_admission; then
            checker=chengwang/deploy/subscription-ui-browser/check_admission_ui.py
          elif test '${{ matrix.scenario }}' = remote_fetch; then
            checker=chengwang/deploy/subscription-ui-browser/check_remote_fetch_ui.py
          elif test '${{ matrix.scenario }}' = remote_handoff_negative; then
            checker=chengwang/deploy/subscription-ui-browser/check_handoff_negative_ui.py
          fi
          sudo --non-interactive /usr/bin/python3 -I -B "$checker" \
            --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" --engine '${{ matrix.engine }}' \
            --evidence "$lab/reports/originals" --report "$lab/reports/independent.json" \
            2>&1 | tee "$lab/reports/independent-original.log"
          git diff --exit-code

      - name: Independently reconstruct capability API DOM events and source-bound lifecycle
        if: matrix.scenario == 'capability_truth'
        shell: bash
        run: |
          set -euo pipefail
          lab="$RUNNER_TEMP/subscription-ui"
          sudo --non-interactive /usr/bin/python3 -I -B chengwang/deploy/capability-truth-browser/check_capability_truth.py \
            --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" --engine '${{ matrix.engine }}' \
            --profile '${{ matrix.profile }}' --evidence "$lab/reports/originals" \
            --report "$lab/independent.json" 2>&1 | tee "$lab/reports/independent-original.log"
          test ! -e "$lab/reports/independent.json"
          sudo --non-interactive install -m 0600 "$lab/independent.json" "$lab/reports/independent.json"

      - name: Independently verify real feedback observations after original business acceptance
        if: matrix.scenario == 'remote_handoff_negative'
        shell: bash
        run: |
          set -euo pipefail
          lab="$RUNNER_TEMP/subscription-ui"
          sudo --non-interactive /usr/bin/python3 -I -B chengwang/deploy/subscription-ui-browser/check_handoff_feedback.py \
            --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" --engine '${{ matrix.engine }}' \
            --evidence "$lab/reports" --report "$lab/feedback-independent.json" \
            2>&1 | tee "$lab/reports/feedback-independent-original.log"
          test ! -e "$lab/reports/feedback-independent.json"
          sudo --non-interactive install -m 0600 "$lab/feedback-independent.json" "$lab/reports/feedback-independent.json"
          git diff --exit-code

      - name: Preserve only structured public originals and PNGs, including failures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sudo --non-interactive chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/subscription-ui/reports"
          chmod -R u+rX,go-rwx "$RUNNER_TEMP/subscription-ui/reports"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && matrix.scenario != 'capability_truth'
        with:
          name: subscription-ui-${{ matrix.scenario }}-${{ matrix.engine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subscription-ui/reports
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && matrix.scenario == 'capability_truth'
        with:
          name: capability-truth-${{ matrix.profile }}-${{ matrix.engine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subscription-ui/reports
          if-no-files-found: error
          retention-days: 14

  fresh:
    name: Fresh original ${{ matrix.scenario }} replay (${{ matrix.engine }}) ${{ matrix.profile }}
    needs: browser
    # A failed scene must not suppress independent evidence for every other
    # successful scene. Missing/failed inputs still reject their own replay.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [chrome-cdp, playwright]
        scenario: [create_receipt, local_admission, remote_fetch, remote_handoff_negative]
        include:
          - { engine: chrome-cdp, scenario: capability_truth, profile: default }
          - { engine: playwright, scenario: capability_truth, profile: default }
          - { engine: chrome-cdp, scenario: capability_truth, profile: backend_configured }
          - { engine: playwright, scenario: capability_truth, profile: backend_configured }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: matrix.scenario != 'capability_truth'
        with:
          name: subscription-ui-${{ matrix.scenario }}-${{ matrix.engine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subscription-ui-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: matrix.scenario == 'capability_truth'
        with:
          name: capability-truth-${{ matrix.profile }}-${{ matrix.engine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subscription-ui-input
      - name: Recompute from original public files without any running product or browser
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/subscription-ui-fresh"
          python3 -B chengwang/deploy/subscription-ui-browser/check_ci_dependencies.py \
            --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" \
            --evidence "$RUNNER_TEMP/subscription-ui-input/dependencies" \
            --report "$RUNNER_TEMP/subscription-ui-fresh/dependency-verification.json" \
            2>&1 | tee "$RUNNER_TEMP/subscription-ui-fresh/dependency-original.log"
          cmp "$RUNNER_TEMP/subscription-ui-input/dependency-verification.json" \
            "$RUNNER_TEMP/subscription-ui-fresh/dependency-verification.json"
          if test '${{ matrix.scenario }}' = capability_truth; then
            python3 -B chengwang/deploy/capability-truth-browser/check_capability_synthetic.py \
              --evidence "$RUNNER_TEMP/subscription-ui-input" --source-commit "$GITHUB_SHA" \
              --repo "$GITHUB_WORKSPACE" --report "$RUNNER_TEMP/subscription-ui-fresh/capability-synthetic.json" \
              2>&1 | tee "$RUNNER_TEMP/subscription-ui-fresh/capability-synthetic-original.log"
            cmp "$RUNNER_TEMP/subscription-ui-input/capability-synthetic.json" \
              "$RUNNER_TEMP/subscription-ui-fresh/capability-synthetic.json"
            python3 -B chengwang/deploy/capability-truth-browser/check_capability_truth.py \
              --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" --engine '${{ matrix.engine }}' \
              --profile '${{ matrix.profile }}' --evidence "$RUNNER_TEMP/subscription-ui-input/originals" \
              --report "$RUNNER_TEMP/subscription-ui-fresh/independent.json" \
              2>&1 | tee "$RUNNER_TEMP/subscription-ui-fresh/independent-original.log"
            cmp "$RUNNER_TEMP/subscription-ui-input/independent.json" "$RUNNER_TEMP/subscription-ui-fresh/independent.json"
            git diff --exit-code
            exit 0
          fi
          checker=chengwang/deploy/subscription-ui-browser/check_subscription_ui.py
          if test '${{ matrix.scenario }}' = local_admission; then
            checker=chengwang/deploy/subscription-ui-browser/check_admission_ui.py
          elif test '${{ matrix.scenario }}' = remote_fetch; then
            checker=chengwang/deploy/subscription-ui-browser/check_remote_fetch_ui.py
          elif test '${{ matrix.scenario }}' = remote_handoff_negative; then
            checker=chengwang/deploy/subscription-ui-browser/check_handoff_negative_ui.py
          fi
          python3 -B "$checker" \
            --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" --engine '${{ matrix.engine }}' \
            --evidence "$RUNNER_TEMP/subscription-ui-input/originals" --report "$RUNNER_TEMP/subscription-ui-fresh/independent.json" \
            2>&1 | tee "$RUNNER_TEMP/subscription-ui-fresh/independent-original.log"
          cmp "$RUNNER_TEMP/subscription-ui-input/independent.json" "$RUNNER_TEMP/subscription-ui-fresh/independent.json"
          python3 -B chengwang/deploy/subscription-ui-browser/check_navigation_synthetic.py \
            --evidence "$RUNNER_TEMP/subscription-ui-input" --source-commit "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/subscription-ui-fresh/navigation-synthetic.json" \
            2>&1 | tee "$RUNNER_TEMP/subscription-ui-fresh/navigation-synthetic-original.log"
          cmp "$RUNNER_TEMP/subscription-ui-input/navigation-synthetic.json" \
            "$RUNNER_TEMP/subscription-ui-fresh/navigation-synthetic.json"
          if test '${{ matrix.scenario }}' = remote_fetch; then
            python3 -B chengwang/deploy/subscription-ui-browser/check_remote_synthetic.py \
              --evidence "$RUNNER_TEMP/subscription-ui-input" --source-commit "$GITHUB_SHA" \
              --report "$RUNNER_TEMP/subscription-ui-fresh/remote-synthetic.json" \
              2>&1 | tee "$RUNNER_TEMP/subscription-ui-fresh/remote-synthetic-original.log"
            cmp "$RUNNER_TEMP/subscription-ui-input/remote-synthetic.json" \
              "$RUNNER_TEMP/subscription-ui-fresh/remote-synthetic.json"
          fi
          if test '${{ matrix.scenario }}' = remote_handoff_negative; then
            python3 -B chengwang/deploy/subscription-ui-browser/check_handoff_negative_synthetic.py \
              --evidence "$RUNNER_TEMP/subscription-ui-input" --source-commit "$GITHUB_SHA" \
              --report "$RUNNER_TEMP/subscription-ui-fresh/handoff-synthetic.json" \
              2>&1 | tee "$RUNNER_TEMP/subscription-ui-fresh/handoff-synthetic-original.log"
            cmp "$RUNNER_TEMP/subscription-ui-input/handoff-synthetic.json" \
              "$RUNNER_TEMP/subscription-ui-fresh/handoff-synthetic.json"
            python3 -B chengwang/deploy/subscription-ui-browser/check_feedback_synthetic.py \
              --evidence "$RUNNER_TEMP/subscription-ui-input" --source-commit "$GITHUB_SHA" \
              --report "$RUNNER_TEMP/subscription-ui-fresh/feedback-synthetic.json" \
              2>&1 | tee "$RUNNER_TEMP/subscription-ui-fresh/feedback-synthetic-original.log"
            cmp "$RUNNER_TEMP/subscription-ui-input/feedback-synthetic.json" \
              "$RUNNER_TEMP/subscription-ui-fresh/feedback-synthetic.json"
            python3 -B chengwang/deploy/subscription-ui-browser/check_handoff_navigation_synthetic.py \
              --evidence "$RUNNER_TEMP/subscription-ui-input" --source-commit "$GITHUB_SHA" \
              --report "$RUNNER_TEMP/subscription-ui-fresh/handoff-navigation-synthetic.json" \
              2>&1 | tee "$RUNNER_TEMP/subscription-ui-fresh/handoff-navigation-synthetic-original.log"
            cmp "$RUNNER_TEMP/subscription-ui-input/handoff-navigation-synthetic.json" \
              "$RUNNER_TEMP/subscription-ui-fresh/handoff-navigation-synthetic.json"
            python3 -B chengwang/deploy/subscription-ui-browser/check_handoff_feedback.py \
              --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" --engine '${{ matrix.engine }}' \
              --evidence "$RUNNER_TEMP/subscription-ui-input" --report "$RUNNER_TEMP/subscription-ui-fresh/feedback-independent.json" \
              2>&1 | tee "$RUNNER_TEMP/subscription-ui-fresh/feedback-independent-original.log"
            cmp "$RUNNER_TEMP/subscription-ui-input/feedback-independent.json" \
              "$RUNNER_TEMP/subscription-ui-fresh/feedback-independent.json"
          fi
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && matrix.scenario != 'capability_truth'
        with:
          name: subscription-ui-fresh-${{ matrix.scenario }}-${{ matrix.engine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subscription-ui-fresh
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && matrix.scenario == 'capability_truth'
        with:
          name: capability-truth-fresh-${{ matrix.profile }}-${{ matrix.engine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subscription-ui-fresh
          if-no-files-found: error
          retention-days: 14
