name: Subscription usage safety checks
on:
  pull_request:
    paths: ["monitoring/lan-center/local-subscription/**", "monitoring/lan-center/subscription-usage/**", "installer/runtime/portable_subscriptions.py", ".github/workflows/subscription-usage-check.yml"]
  push:
    branches: ["main", "codex/**"]
    paths: ["monitoring/lan-center/local-subscription/**", "monitoring/lan-center/subscription-usage/**", "installer/runtime/portable_subscriptions.py", ".github/workflows/subscription-usage-check.yml"]
permissions:
  contents: read
jobs:
  usage-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Existing collector dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Collector, recovery, patch and scheduling boundaries
        run: |
          command -v curl >/dev/null
          python -B -m unittest discover -s monitoring/lan-center/local-subscription -p test_subscription_usage.py -v
          python -B -m unittest discover -s monitoring/lan-center/local-subscription -p test_usage_http_lifecycle.py -v
          python -B -m unittest discover -s monitoring/lan-center/subscription-usage -v
          python -B -m unittest discover -s installer/tests -p test_subscription_scheduler.py -v
          node --check monitoring/lan-center/local-subscription/usage_ui.js
          ruby -c monitoring/lan-center/subscription-usage/deploy_router.rb
