name: Unified center safety checks
on:
  pull_request:
    paths: ["monitoring/lan-center/unified-center/**", "monitoring/lan-center/local-subscription/local_web.py", "installer/Dockerfile.unified", "installer/build_unified_image.py", "installer/agents/unified_center_deploy.py", "installer/tests/test_unified_deploy.py", ".github/workflows/unified-center-check.yml"]
  push:
    branches: ["main", "codex/**"]
    paths: ["monitoring/lan-center/unified-center/**", "monitoring/lan-center/local-subscription/local_web.py", "installer/Dockerfile.unified", "installer/build_unified_image.py", "installer/agents/unified_center_deploy.py", "installer/tests/test_unified_deploy.py", ".github/workflows/unified-center-check.yml"]
permissions:
  contents: read
jobs:
  unified-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Existing runtime dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Backend, fixed proxy, concurrency, backup and deployment recovery
        env:
          PYTHONPATH: installer/runtime/upstream:installer:monitoring/lan-center/local-subscription:monitoring/lan-center/unified-center
        run: |
          python -B -m unittest discover -s monitoring/lan-center/unified-center -v
          python -B -m unittest discover -s installer/tests -p test_unified_deploy.py -v
          python -B -m compileall -q monitoring/lan-center/unified-center installer/agents/unified_center_deploy.py installer/build_unified_image.py
          node --check monitoring/lan-center/unified-center/assets/app.js
