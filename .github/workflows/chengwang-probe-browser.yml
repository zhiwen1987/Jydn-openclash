name: Chengwang Probe Browser Acceptance

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/chengwang-probe-browser.yml"
      - "chengwang/tools/probe-browser/**"
      - "chengwang/deploy/probe-readback/**"
      - "chengwang/web/**"
      - "chengwang/internal/**"
      - "chengwang/cmd/**"
      - "chengwang/go.mod"
      - "chengwang/go.sum"
      - "chengwang/vendor/**"
  push:
    branches: [main, codex/chengwang-security-hardening]
    paths:
      - ".github/workflows/chengwang-probe-browser.yml"
      - "chengwang/tools/probe-browser/**"
      - "chengwang/deploy/probe-readback/**"
      - "chengwang/web/**"
      - "chengwang/internal/**"
      - "chengwang/cmd/**"
      - "chengwang/go.mod"
      - "chengwang/go.sum"
      - "chengwang/vendor/**"

permissions:
  contents: read

concurrency:
  group: chengwang-probe-browser-preflight-${{ github.ref }}
  # Preserve both engines' running evidence instead of canceling on a fix push.
  cancel-in-progress: false

jobs:
  contract-preflight:
    name: Offline synthetic contracts and installed Playwright interface (not browser E2E)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up the explicitly supported Node release
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
          check-latest: false

      - name: Acquire only the independent locked CI tool without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/chengwang-probe-browser-preflight"
          test ! -e "$evidence"
          /usr/bin/install -d -m 0700 "$evidence"
          test "$(node --version)" = v22.23.3
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          /usr/bin/python3 -B - "$evidence/source-before.json" <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          records = []
          paths = ['chengwang/tools/probe-browser',
              '.github/workflows/chengwang-probe-browser.yml', 'chengwang/.gitignore']
          for name in subprocess.check_output(['git', 'ls-files', '-z', '--', *paths]).split(b'\0'):
              if name:
                  path = pathlib.Path(name.decode())
                  if path.is_symlink() or not path.is_file():
                      raise SystemExit('source-type-rejected')
                  raw = path.read_bytes()
                  records.append({'path': str(path), 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()})
          pathlib.Path(sys.argv[1]).write_text(json.dumps(records, separators=(',', ':')) + '\n')
          PY
          # No product package lock is changed. playwright-core has no browser
          # download/install hook; no repository lifecycle scripts execute here.
          npm ci --prefix chengwang/tools/probe-browser --ignore-scripts --no-audit --no-fund

      - name: Run toolchain and pure contracts with no external network and read-only source
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/chengwang-probe-browser-preflight"
          node_binary="$(command -v node)"
          /usr/bin/timeout --signal=TERM --kill-after=5s 120s /usr/bin/sudo --non-interactive \
            /usr/bin/unshare --mount --net --fork \
            /usr/bin/bash -s -- "$GITHUB_WORKSPACE" "$node_binary" "$(id -u)" "$(id -g)" <<'SH' \
            2>&1 | /usr/bin/tee "$evidence/contracts.tap"
          set -euo pipefail
          source_root="$1"
          node_binary="$2"
          task_uid="$3"
          task_gid="$4"
          /usr/bin/mount --make-rprivate /
          /usr/bin/mount --bind "$source_root" "$source_root"
          /usr/bin/mount -o remount,bind,ro,nosuid,nodev "$source_root"
          /usr/sbin/ip link set lo up
          test "$(/usr/sbin/ip -o link show | /usr/bin/wc -l)" -eq 1
          test -z "$(/usr/sbin/ip -4 route show default)"
          test -z "$(/usr/sbin/ip -6 route show default)"
          /usr/bin/setpriv --reuid="$task_uid" --regid="$task_gid" --clear-groups \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs \
            /usr/bin/env -i PATH=/usr/bin:/bin LANG=C \
            "$node_binary" "$source_root/chengwang/tools/probe-browser/check-toolchain.mjs"
          exec /usr/bin/setpriv --reuid="$task_uid" --regid="$task_gid" --clear-groups \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs \
            /usr/bin/env -i PATH=/usr/bin:/bin LANG=C \
            "$node_binary" --test --test-reporter=tap \
              "$source_root/chengwang/tools/probe-browser/test-toolchain.mjs" \
              "$source_root/chengwang/tools/probe-browser/check-probe-browser-contract.mjs"
          SH

      - name: Check immutable source and record the limited acceptance boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/chengwang-probe-browser-preflight"
          /usr/bin/python3 -B - "$evidence" "$GITHUB_SHA" <<'PY'
          import hashlib, json, pathlib, re, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          records = json.loads((root / 'source-before.json').read_bytes())
          for item in records:
              path = pathlib.Path(item['path'])
              if path.is_symlink() or not path.is_file():
                  raise SystemExit('source-type-changed')
              raw = path.read_bytes()
              if len(raw) != item['bytes'] or hashlib.sha256(raw).hexdigest() != item['sha256']:
                  raise SystemExit('source-bytes-changed')
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          if subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=all']):
              raise SystemExit('unexpected-worktree-change')
          (root / 'source-after.json').write_bytes((root / 'source-before.json').read_bytes())
          print('PROBE_BROWSER_PREFLIGHT_SOURCE=UNCHANGED')
          raw = (root / 'contracts.tap').read_bytes()
          if not raw or len(raw) > 2 << 20:
              raise SystemExit('contract-output-size-rejected')
          text = raw.decode('utf-8', errors='strict')
          tool_lines = [line for line in text.splitlines() if line.startswith('{')]
          if len(tool_lines) != 1:
              raise SystemExit('toolchain-report-missing')
          def unique_fields(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise SystemExit('duplicate-toolchain-field')
                  result[key] = value
              return result
          tool = json.loads(tool_lines[0], object_pairs_hook=unique_fields)
          expected_tool = {'schema': 'chengwang.probe-browser-toolchain/v1', 'outcome': 'PASS',
              'acceptanceScope': 'TOOLCHAIN_ONLY', 'runtime': False, 'browserStarted': False,
              'nodeVersion': 'v22.23.3', 'playwrightVersion': '1.64.1', 'chromiumLaunchAvailable': True}
          if (tool != expected_tool or set(tool) != set(expected_tool) or
              any(type(tool[key]) is not type(value) for key, value in expected_tool.items())):
              raise SystemExit('actual-installed-toolchain-rejected')
          names = re.findall(r'^# Subtest: (.+)$', text, re.M)
          passed = re.findall(r'^ok ([0-9]+) - (.+)$', text, re.M)
          fingerprint = hashlib.sha256(('\n'.join(sorted(names)) + '\n').encode()).hexdigest()
          if (len(names) != 33 or len(set(names)) != 33 or
              fingerprint != '28777c911ace31bdb8b81b04d6490cde0744e4f01c1e5f8eb5dbd931565dacf6' or
              passed != [(str(index + 1), name) for index, name in enumerate(names)] or
              re.search(r'^\s*(?:not ok\b|Bail out!)|# (?:SKIP|TODO)\b', text, re.M)):
              raise SystemExit('contract-test-events-rejected')
          for key, value in {'tests': 33, 'suites': 0, 'pass': 33, 'fail': 0,
                             'cancelled': 0, 'skipped': 0, 'todo': 0}.items():
              if re.findall(r'^# ' + key + r' ([0-9]+)$', text, re.M) != [str(value)]:
                  raise SystemExit('contract-terminal-summary-rejected')
          if re.findall(r'^1\.\.([0-9]+)$', text, re.M) != ['33']:
              raise SystemExit('contract-plan-rejected')
          if not re.fullmatch(r'[a-f0-9]{40}', sys.argv[2]):
              raise SystemExit('source-commit-rejected')
          report = {'schema': 'chengwang.probe-browser-preflight/v1', 'sourceCommit': sys.argv[2],
              'outcome': 'PASS', 'acceptanceScope': 'SYNTHETIC_CONTRACT_AND_TOOLCHAIN_ONLY',
              'testsRun': 33, 'testsPassed': 33, 'skipped': 0, 'names': sorted(names),
              'namesSHA256': fingerprint, 'originalTAPSHA256': hashlib.sha256(raw).hexdigest(),
              'toolchain': tool, 'production': False, 'deviceActionsExecuted': False,
              'browserE2EProven': False, 'browserStarted': False, 'sourceUnchanged': True}
          (root / 'preflight.json').write_text(json.dumps(report, separators=(',', ':')) + '\n')
          print('PROBE_BROWSER_PREFLIGHT=PASS tests=33 skips=0 browser_started=false production=false')
          PY

      - name: Preserve preflight evidence including failed attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: probe-browser-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chengwang-probe-browser-preflight/
          if-no-files-found: error
          retention-days: 14

  real-browser:
    name: Real native backend and ${{ matrix.engine }} (isolated candidate only)
    needs: contract-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chrome-cdp, playwright]
    env:
      GOWORK: "off"
      GOENV: "off"
      GOTOOLCHAIN: local
      GOFLAGS: -mod=vendor
      GOPROXY: "off"
      GOSUMDB: "off"
      CGO_ENABLED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout exact source without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up explicitly supported Node release
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
          check-latest: false

      - name: Set up pinned parent-module toolchain
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: 1.23.12
          cache: false

      - name: Acquire locked test dependencies and pinned CJK fonts without repository hooks
        shell: bash
        run: |
          set -euo pipefail
          lab="$RUNNER_TEMP/chengwang-probe-browser-runtime"
          test ! -e "$lab"
          /usr/bin/install -d -m 0755 "$lab" "$lab/bin" "$lab/fonts" "$lab/web-build" "$lab/cache"
          /usr/bin/install -d -m 0700 "$lab/evidence" "$lab/evidence/lab"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node --version)" = v22.23.3
          test "$(go env GOVERSION)" = go1.23.12
          test -f /opt/google/chrome/chrome
          test ! -L /opt/google/chrome/chrome
          # Hosted tool-cache ancestors are not our custody boundary. Copy
          # only the actual ELF into this run's private, non-writable input
          # hierarchy; never chmod the shared cache or bypass checked_path.
          /usr/bin/install -m 0755 "$(readlink -f "$(command -v node)")" "$lab/bin/node"
          # The hosted Chrome distribution is also shared and may be 0777.
          # Keep resource/ICU/locales next to its ELF in a root-owned safe copy.
          # This is trusted-CI tool acquisition, not independent provenance.
          sudo --non-interactive /usr/bin/python3 -B - "$lab/chrome" "$lab/evidence/chrome-distribution.json" <<'PY'
          import hashlib, json, os, pathlib, stat, sys
          source = pathlib.Path('/opt/google/chrome'); target = pathlib.Path(sys.argv[1])
          if (not target.is_absolute() or target.name != 'chrome' or target.parent.name != 'chengwang-probe-browser-runtime'
              or target.exists() or target.is_symlink() or source.is_symlink()):
              raise SystemExit('chrome-copy-target-rejected')
          target.mkdir(mode=0o755); target.chmod(0o755)
          records = []; total = 0
          for current, dirs, files in os.walk(source, followlinks=False):
              dirs.sort(); files.sort(); parent = pathlib.Path(current)
              for name in dirs + files:
                  path = parent / name; relative = path.relative_to(source)
                  if len(relative.parts) > 16 or path.is_symlink():
                      raise SystemExit('chrome-copy-link-or-depth-rejected')
                  destination = target / relative; info = path.lstat()
                  if stat.S_ISDIR(info.st_mode):
                      destination.mkdir(mode=0o755); destination.chmod(0o755); continue
                  if not stat.S_ISREG(info.st_mode) or not 0 <= info.st_size <= 512 << 20:
                      raise SystemExit('chrome-copy-type-or-size-rejected')
                  with path.open('rb') as incoming:
                      before = os.fstat(incoming.fileno()); raw = incoming.read((512 << 20) + 1)
                      after = os.fstat(incoming.fileno())
                  named = path.lstat()
                  identity = lambda row: (row.st_dev, row.st_ino, row.st_size, row.st_mode, row.st_uid, row.st_gid, row.st_mtime_ns, row.st_ctime_ns)
                  if identity(info) != identity(before) or identity(before) != identity(after) or identity(after) != identity(named) or len(raw) != before.st_size:
                      raise SystemExit('chrome-copy-input-changed')
                  with destination.open('xb') as output:
                      output.write(raw); output.flush(); os.fsync(output.fileno())
                  destination.chmod(0o755 if info.st_mode & 0o111 else 0o644)
                  digest = hashlib.sha256(raw).hexdigest()
                  with destination.open('rb') as copied:
                      if hashlib.file_digest(copied, 'sha256').hexdigest() != digest:
                          raise SystemExit('chrome-copy-bytes-changed')
                  total += len(raw)
                  records.append(dict(path=relative.as_posix(), bytes=len(raw), sha256=digest,
                      sourceMode=oct(stat.S_IMODE(info.st_mode)), copyMode=oct(stat.S_IMODE(destination.stat().st_mode))))
                  if len(records) > 4096 or total > 1536 << 20:
                      raise SystemExit('chrome-copy-budget-rejected')
          with (target / 'chrome').open('rb') as executable:
              if executable.read(4) != b'\x7fELF':
                  raise SystemExit('chrome-copy-elf-rejected')
          report = dict(schema='chengwang.probe-chrome-acquisition/v1',
              scope='TRUSTED_CI_SYSTEM_TOOL_BYTE_COPY_NOT_INDEPENDENT_SUPPLY_CHAIN', files=records)
          with pathlib.Path(sys.argv[2]).open('x') as output:
              json.dump(report, output, separators=(',', ':')); output.write('\n')
          PY
          sudo --non-interactive apt-get update -qq
          sudo --non-interactive apt-get install --no-install-recommends -y libnss3-tools
          /usr/bin/cp -a chengwang/web/. "$lab/web-build/"
          npm ci --prefix "$lab/web-build" --ignore-scripts --no-audit --no-fund
          npm ci --prefix chengwang/tools/probe-browser --ignore-scripts --no-audit --no-fund
          /usr/bin/python3 -B - "$lab/fonts" <<'PY'
          import hashlib, pathlib, sys, urllib.request
          root = pathlib.Path(sys.argv[1])
          base = 'https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/'
          pins = [
              ('Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf', 16437364, '2c76254f6fc379fddfce0a7e84fb5385bb135d3e399294f6eeb6680d0365b74b'),
              ('Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Bold.otf', 17002248, 'b5f0d1a190a7f9b43c310a8850630af12553df32c4c050543f9059732d9b4c0a'),
              ('Sans/LICENSE', 4301, '6a73f9541c2de74158c0e7cf6b0a58ef774f5a780bf191f2d7ec9cc53efe2bf2'),
          ]
          for path, size, digest in pins:
              with urllib.request.urlopen(base + path, timeout=60) as response:
                  raw = response.read(size + 1)
              if len(raw) != size or hashlib.sha256(raw).hexdigest() != digest:
                  raise SystemExit('font-pin-rejected')
              with (root / path.rsplit('/', 1)[1]).open('xb') as output:
                  output.write(raw)
          PY
          /usr/bin/python3 -B - "$lab/evidence/source-before.json" <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          records = []
          for name in subprocess.check_output(['git', 'ls-files', '-z', '--', 'chengwang', '.github/workflows']).split(b'\0'):
              if name:
                  path = pathlib.Path(name.decode())
                  if path.is_symlink() or not path.is_file():
                      raise SystemExit('source-type-rejected')
                  raw = path.read_bytes()
                  records.append(dict(path=path.as_posix(), bytes=len(raw), sha256=hashlib.sha256(raw).hexdigest()))
          pathlib.Path(sys.argv[1]).write_text(json.dumps(records, separators=(',', ':')) + '\n')
          PY

      - name: Build real product binaries and frontend offline with read-only source
        shell: bash
        run: |
          set -euo pipefail
          lab="$RUNNER_TEMP/chengwang-probe-browser-runtime"
          sudo --non-interactive unshare --mount --net --fork /usr/bin/bash -s -- \
            "$GITHUB_WORKSPACE" "$lab" "$(command -v node)" "$(command -v go)" "$(id -u)" "$(id -g)" <<'SH'
          set -euo pipefail
          source_root="$1"; lab="$2"; node_binary="$3"; go_binary="$4"; task_uid="$5"; task_gid="$6"
          mount --make-rprivate /
          mount --bind "$source_root" "$source_root"
          mount -o remount,bind,ro,nosuid,nodev "$source_root"
          ip link set lo up
          test "$(ip -o link show | wc -l)" -eq 1
          test -z "$(ip -4 route show default)"
          test -z "$(ip -6 route show default)"
          cd "$source_root/chengwang"
          for target in probe-agent server probe-readback-driver; do
            if test "$target" = probe-readback-driver; then
              build_args=(test -c -trimpath -tags probereadbacklab -o "$lab/bin/$target" ./internal/probereadbacklab)
            else
              build_args=(build -trimpath -o "$lab/bin/$target" "./cmd/$target")
            fi
            setpriv --reuid="$task_uid" --regid="$task_gid" --clear-groups --bounding-set=-all \
              --inh-caps=-all --ambient-caps=-all --no-new-privs env -i PATH=/usr/bin:/bin LANG=C \
              GOWORK=off GOENV=off GOTOOLCHAIN=local GOFLAGS=-mod=vendor GOPROXY=off GOSUMDB=off CGO_ENABLED=0 \
              GOCACHE="$lab/cache" "$go_binary" "${build_args[@]}"
          done
          cd "$lab/web-build"
          setpriv --reuid="$task_uid" --regid="$task_gid" --clear-groups --bounding-set=-all \
            --inh-caps=-all --ambient-caps=-all --no-new-privs env -i PATH=/usr/bin:/bin LANG=C \
            "$node_binary" node_modules/typescript/bin/tsc -b
          setpriv --reuid="$task_uid" --regid="$task_gid" --clear-groups --bounding-set=-all \
            --inh-caps=-all --ambient-caps=-all --no-new-privs env -i PATH=/usr/bin:/bin LANG=C \
            "$node_binary" node_modules/vite/bin/vite.js build
          SH

      - name: Check orchestration and driver contracts separately from real acceptance
        shell: bash
        run: |
          set -euo pipefail
          lab="$RUNNER_TEMP/chengwang-probe-browser-runtime"
          sudo --non-interactive unshare --mount --net --fork /usr/bin/bash -s -- \
            "$GITHUB_WORKSPACE" "$lab" "$(command -v node)" "$(id -u)" "$(id -g)" <<'SH'
          set -euo pipefail
          source_root="$1"; lab="$2"; node_binary="$3"; task_uid="$4"; task_gid="$5"
          mount --make-rprivate /
          mount --bind "$source_root" "$source_root"
          mount -o remount,bind,ro,nosuid,nodev "$source_root"
          ip link set lo up
          test "$(ip -o link show | wc -l)" -eq 1
          test -z "$(ip -4 route show default)"
          test -z "$(ip -6 route show default)"
          exec setpriv --reuid="$task_uid" --regid="$task_gid" --clear-groups --bounding-set=-all \
            --inh-caps=-all --ambient-caps=-all --no-new-privs env -i PATH=/usr/bin:/bin LANG=C \
            PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0 /usr/bin/bash -s -- "$source_root" "$lab" "$node_binary" <<'TEST'
          set -euo pipefail
          cd "$1"
          "$3" chengwang/tools/probe-browser/check-toolchain.mjs > "$2/evidence/toolchain.json"
          "$3" --test --test-reporter=tap \
            chengwang/tools/probe-browser/test-run-browser.mjs \
            chengwang/tools/probe-browser/check-browser-driver.mjs | tee "$2/evidence/browser-unit.tap"
          python3 -B - "$2/evidence/orchestration-unit.json" <<'PY'
          import ast, hashlib, importlib, json, pathlib, sys, unittest
          base = pathlib.Path('chengwang/deploy/probe-readback').resolve()
          sys.path.insert(0, str(base))
          pins = {
              'test_run_probe_browser': (13, '59e536581328251c3923a8010632ce491f3f42a7d78a8b73d16c7625fa79c3ff'),
              'test_check_probe_browser': (35, 'd785ff17e4fa0982f96e6864467e3e47d88b80e962d49d1d54c6506613a3ab1f'),
              'test_run_probe_readback': (12, 'b12e53d8fe95fb131f7a8a047a0393944764dd8343db8e9ce531ef7998d11dc1'),
              'test_check_probe_readback': (32, '1b766f1b579cc390eb0ab7b2e31cf81a4121c1fb95662931ef95be3a6d04ee73'),
          }
          class Recorded(unittest.TextTestResult):
              def __init__(self, *args):
                  super().__init__(*args); self.runs = []; self.passes = []
              def startTest(self, test):
                  self.runs.append(test.id()); super().startTest(test)
              def addSuccess(self, test):
                  self.passes.append(test.id()); super().addSuccess(test)
          reports = []
          for name in pins:
              tree = ast.parse((base / (name + '.py')).read_bytes())
              names = sorted(name + '.' + cls.name + '.' + method.name for cls in tree.body if isinstance(cls, ast.ClassDef)
                  for method in cls.body if isinstance(method, ast.FunctionDef) and method.name.startswith('test_'))
              fingerprint = hashlib.sha256(('\n'.join(names) + '\n').encode()).hexdigest()
              if not names or len(set(names)) != len(names) or (name in pins and (len(names), fingerprint) != pins[name]):
                  raise SystemExit('unit-name-baseline-rejected')
              result = unittest.TextTestRunner(verbosity=2, resultclass=Recorded).run(
                  unittest.defaultTestLoader.loadTestsFromModule(importlib.import_module(name)))
              if (not result.wasSuccessful() or result.skipped or result.expectedFailures or result.unexpectedSuccesses
                  or sorted(result.runs) != names or sorted(result.passes) != names):
                  raise SystemExit('unit-actual-events-rejected')
              reports.append(dict(module=name, testsRun=result.testsRun, names=names, namesSHA256=fingerprint,
                  syntheticOnly=True, runtimeProven=False))
          pathlib.Path(sys.argv[1]).write_text(json.dumps(reports, separators=(',', ':')) + '\n')
          PY
          TEST
          SH
          python3 -B - "$lab/evidence/browser-unit.tap" <<'PY'
          import hashlib, pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')
          names = re.findall(r'^# Subtest: (.+)$', text, re.M)
          if (len(names) != 32 or len(set(names)) != 32
              or hashlib.sha256(('\n'.join(sorted(names)) + '\n').encode()).hexdigest() != '52fe91e66bf109382f90d16fbbd8901af35b311d299cda3c8e3f648aa735fa3c'
              or re.findall(r'^ok ([0-9]+) - (.+)$', text, re.M) != [(str(i+1), n) for i,n in enumerate(names)]
              or re.search(r'^\s*(?:not ok\b|Bail out!)|# (?:SKIP|TODO)\b', text, re.M)):
              raise SystemExit('browser-unit-events-rejected')
          for key, value in dict(tests=32, suites=0, pass_=32, fail=0, cancelled=0, skipped=0, todo=0).items():
              key = key.removesuffix('_')
              if re.findall(r'^# ' + key + r' ([0-9]+)$', text, re.M) != [str(value)]:
                  raise SystemExit('browser-unit-summary-rejected')
          if re.findall(r'^1\.\.([0-9]+)$', text, re.M) != ['32']:
              raise SystemExit('browser-unit-plan-rejected')
          PY

      - name: Exercise real browser against real agent spool and product API
        shell: bash
        run: |
          set -euo pipefail
          lab="$RUNNER_TEMP/chengwang-probe-browser-runtime"
          python3 -B - "$lab/evidence/input-paths.json" "$lab" "$(readlink -f "$(command -v node)")" <<'PY'
          import json, os, pathlib, stat, sys
          root = pathlib.Path(sys.argv[2]); records = []
          paths = [('source-node-not-runtime-input', pathlib.Path(sys.argv[3])),
              ('node', root / 'bin/node'), ('source-chrome-not-runtime-input', pathlib.Path('/opt/google/chrome/chrome')),
              ('chrome', root / 'chrome/chrome'),
              ('agent', root / 'bin/probe-agent'), ('server', root / 'bin/server'),
              ('driver', root / 'bin/probe-readback-driver'), ('web', root / 'web-build/dist'),
              ('fonts', root / 'fonts'), ('output', root / 'evidence/lab')]
          for role, path in paths:
              ancestors = []
              for item in (*reversed(path.parents), path):
                  info = item.lstat()
                  ancestors.append(dict(path=str(item), uid=info.st_uid, gid=info.st_gid,
                      mode=oct(stat.S_IMODE(info.st_mode)), symlink=stat.S_ISLNK(info.st_mode)))
              records.append(dict(role=role, ancestors=ancestors))
          with pathlib.Path(sys.argv[1]).open('x') as output:
              json.dump(records, output, separators=(',', ':')); output.write('\n')
          PY
          /usr/bin/timeout --signal=TERM --kill-after=20s 420s \
            /usr/bin/python3 -B chengwang/deploy/probe-readback/run_probe_browser.py \
              --agent "$lab/bin/probe-agent" --server "$lab/bin/server" \
              --driver "$lab/bin/probe-readback-driver" --source-commit "$GITHUB_SHA" \
              --output-dir "$lab/evidence/lab" --web-dir "$lab/web-build/dist" \
              --fonts-dir "$lab/fonts" --node "$lab/bin/node" \
              --chrome "$lab/chrome/chrome" --engine '${{ matrix.engine }}'

      - name: Independently verify original backend and bound browser evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/chengwang-probe-browser-runtime/evidence"
          python3 -B chengwang/deploy/probe-readback/check_probe_readback.py verify \
            --evidence-dir "$evidence/lab/backend" --source-commit "$GITHUB_SHA" \
            --report "$evidence/backend-verification.json"
          python3 -B chengwang/deploy/probe-readback/check_probe_browser.py verify \
            --backend-dir "$evidence/lab/backend" --browser-dir "$evidence/lab/browser" \
            --source-commit "$GITHUB_SHA" --engine '${{ matrix.engine }}' \
            --report "$evidence/browser-verification.json"

      - name: Verify exact source bytes and worktree remained unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/chengwang-probe-browser-runtime/evidence"
          python3 -B - "$evidence" <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          records = json.loads((root / 'source-before.json').read_bytes())
          for item in records:
              path = pathlib.Path(item['path'])
              raw = path.read_bytes()
              if path.is_symlink() or len(raw) != item['bytes'] or hashlib.sha256(raw).hexdigest() != item['sha256']:
                  raise SystemExit('source-bytes-changed')
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          if subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=all']):
              raise SystemExit('unexpected-worktree-change')
          (root / 'source-after.json').write_bytes((root / 'source-before.json').read_bytes())
          print('PROBE_BROWSER_SOURCE=UNCHANGED')
          PY

      - name: Validate hidden-file boundary of public evidence archive
        id: public_archive_boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/chengwang-probe-browser-runtime/evidence"
          python3 -I -B - "$evidence" <<'PY'
          import pathlib, sys
          sys.path.insert(0, str(pathlib.Path('chengwang/deploy/probe-readback').resolve()))
          import run_probe_browser
          try:
              run_probe_browser.check_public_archive(pathlib.Path(sys.argv[1]))
          except Exception:
              raise SystemExit('PROBE_BROWSER_ARCHIVE_BOUNDARY=FAIL raw_input_suppressed=true')
          print('PROBE_BROWSER_ARCHIVE_BOUNDARY=PASS hidden_scope=VITE_PUBLIC_MANIFEST_ONLY')
          PY

      - name: Preserve public evidence only including failed attempts
        if: always() && steps.public_archive_boundary.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: probe-browser-${{ matrix.engine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chengwang-probe-browser-runtime/evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
