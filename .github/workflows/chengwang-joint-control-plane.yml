name: Chengwang Joint Control Plane Isolated E2E
on:
  workflow_dispatch:
  push:
    branches: [codex/chengwang-unified-20261102]
    paths: ['.github/workflows/chengwang-joint-control-plane.yml', 'chengwang/**']
permissions:
  contents: read
concurrency:
  group: chengwang-joint-control-plane-${{ github.ref }}
  cancel-in-progress: false
env:
  EXACT_REF: refs/heads/codex/chengwang-unified-20261102
  CONTRACT: chengwang/deploy/joint-control-plane/source_contract.json
  CONTRACT_SHA256: 214f2054a39acfd2719d6f9fff93b8c61a7f98ad47935934037ebae4fba99f1a
  CHECKER_SHA256: cd5b049fc83b50473650afee88332b3cf531eedfcac366023b858dd3aeb32faa
  UID_PROBE_PRODUCER_SHA256: 98982bd151c9289534fa7421a1520ba51ff67ceb0fd930065e227321e419052d
  UID_PROBE_CHECKER_SHA256: 04fdd2ac9acbc2dafa7c2ecab9910b3346649042569dbaeb9cec4efb056e81c8
jobs:
  joint-control-plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Refuse every non-candidate ref
        run: |
          test "$GITHUB_REF" = "$EXACT_REF"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with: {go-version: 1.23.12, cache: false}
      - name: Pin source contract and checker
        run: |
          set -euo pipefail
          test "$(sha256sum "$CONTRACT" | cut -d' ' -f1)" = "$CONTRACT_SHA256"
          test "$(sha256sum chengwang/deploy/joint-control-plane/check_joint_control_plane.py | cut -d' ' -f1)" = "$CHECKER_SHA256"
          python3 -I -B chengwang/deploy/joint-control-plane/ci_joint_control_plane.py workflow-contract --workflow "$GITHUB_WORKSPACE/.github/workflows/chengwang-joint-control-plane.yml"
          python3 -I -B - <<'PY'
          import importlib.util,pathlib
          b=pathlib.Path('chengwang/deploy/joint-control-plane')
          s=importlib.util.spec_from_file_location('c',b/'check_joint_control_plane.py');m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          m.source_contract(pathlib.Path('.').resolve(),b/'source_contract.json')
          PY
      - name: CPU contracts and Go suite
        id: cpu
        env: {GOFLAGS: -mod=vendor, CGO_ENABLED: '0'}
        run: |
          set -uo pipefail
          private="$RUNNER_TEMP/joint-control-plane-cpu-private"; stage="$RUNNER_TEMP/joint-control-plane-cpu-stage"; public="$RUNNER_TEMP/joint-control-plane-cpu-public"; model_public="$RUNNER_TEMP/joint-control-plane-model-outcome-public"
          if test -e "$private" || test -L "$private" || test -e "$stage" || test -L "$stage" || test -e "$public" || test -L "$public" || test -e "$model_public" || test -L "$model_public"; then
            printf '%s\n' 'CPU_PUBLICATION=REJECTED_PREEXISTING_PATH' >&2
            exit 1
          fi
          if ! install -d -m 0700 "$private" "$stage" "$model_public"; then
            printf '%s\n' 'CPU_PUBLICATION=REJECTED_DIRECTORY_CREATION' >&2
            exit 1
          fi
          if python3 -I -B chengwang/deploy/joint-control-plane/ci_joint_control_plane.py units --output "$private/units.json" --model-diagnostic "$private/model-outcome.json" --source-commit "$GITHUB_SHA" >"$private/units.log" 2>&1; then
            unit_code=0
          else
            unit_code=$?
          fi
          if (cd chengwang && go test -count=1 -timeout=300s ./...) >"$private/go.log" 2>&1; then
            go_code=0
          else
            go_code=$?
          fi
          if ! printf '%s\n' "$go_code" >"$private/go-exit.txt"; then
            printf '%s\n' 'CPU_PUBLICATION=REJECTED_STATUS_WRITE' >&2
            exit 1
          fi
          if python3 -I -B chengwang/deploy/joint-control-plane/ci_joint_control_plane.py model-diagnostic --input "$private/model-outcome.json" --source-commit "$GITHUB_SHA" --output "$model_public/model-outcome.json"; then
            diagnostic_code=0
            if ! printf '%s\n' 'model_diagnostic_ready=true' >>"$GITHUB_OUTPUT"; then
              printf '%s\n' 'CPU_PUBLICATION=REJECTED_MODEL_OUTPUT_WRITE' >&2
              exit 1
            fi
          else
            diagnostic_code=$?
          fi
          cpu_code=0
          if test "$unit_code" = 0 && test "$go_code" = 0; then
            if python3 -I -B chengwang/deploy/joint-control-plane/sanitize_publication.py cpu --units "$private/units.json" --go-exit "$private/go-exit.txt" --output "$stage/cpu-summary.json"; then
              projection_code=0
            else
              projection_code=$?
            fi
          else
            cpu_code=1
            if python3 -I -B chengwang/deploy/joint-control-plane/sanitize_publication.py failure --input "$private" --code CPU_FAILED --output "$stage/cpu-failure.json"; then
              projection_code=0
            else
              projection_code=$?
            fi
          fi
          fallback_code=0
          if test "$projection_code" != 0; then
            cpu_code=1
            if python3 -I -B chengwang/deploy/joint-control-plane/sanitize_publication.py cpu-fallback --output "$stage/cpu-diagnostic-unavailable.json"; then
              fallback_code=0
            else
              fallback_code=$?
            fi
          fi
          if python3 -I -B chengwang/deploy/joint-control-plane/sanitize_publication.py cpu-publish --input "$stage" --output "$public"; then
            publish_code=0
          else
            publish_code=$?
          fi
          if test "$publish_code" = 0; then
            if ! printf '%s\n' 'publication_ready=true' >>"$GITHUB_OUTPUT"; then
              printf '%s\n' 'CPU_PUBLICATION=REJECTED_OUTPUT_WRITE' >&2
              exit 1
            fi
          fi
          test "$diagnostic_code" = 0 && test "$fallback_code" = 0 && test "$publish_code" = 0 && test "$cpu_code" = 0
      - name: Preserve bounded CPU publication only
        if: ${{ always() && steps.cpu.outputs.publication_ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: joint-control-plane-cpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/joint-control-plane-cpu-public/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve source-bound model outcome diagnostic only
        if: ${{ always() && steps.cpu.outputs.model_diagnostic_ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: joint-control-plane-model-outcomes-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/joint-control-plane-model-outcome-public/model-outcome.json
          if-no-files-found: error
          retention-days: 14
      - name: Prepare immutable source and staging
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/joint-control-plane"; test ! -e "$root"; install -d -m 0700 "$root/bin" "$root/evidence/staging/lab"
          python3 -I -B chengwang/deploy/joint-control-plane/ci_joint_control_plane.py source --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" --output "$root/evidence/staging/lab/source-before.json"
      - name: Probe isolated Linux UID custody
        id: uid_probe
        run: |
          set -uo pipefail
          source_script="$GITHUB_WORKSPACE/chengwang/deploy/joint-control-plane/ci_joint_control_plane.py"
          source_contract="$GITHUB_WORKSPACE/chengwang/deploy/joint-control-plane/source_contract.json"
          producer="$GITHUB_WORKSPACE/chengwang/deploy/joint-control-plane/uid_probe_diagnostic.py"
          private="$RUNNER_TEMP/joint-control-plane-uid-probe-private"
          journal="$private/journal.json"; candidate="$private/uid-probe-diagnostic.json"
          test ! -e "$private" || exit 1; install -d -m 0700 "$private" || exit 1
          test "$(sha256sum "$producer" | cut -d' ' -f1)" = "$UID_PROBE_PRODUCER_SHA256" || exit 1
          diagnostic=(/usr/bin/python3 -I -B "$producer" --journal "$journal" --source-commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT")
          "${diagnostic[@]}" init || exit 1
          payload_digest="$(sudo --non-interactive /usr/bin/python3 -I -B "$source_script" bridge-payload-digest --repo "$GITHUB_WORKSPACE" --source-contract "$source_contract")" || exit 1
          test "${#payload_digest}" = 64 || exit 1
          preflight_code='import os,sys
          try:
           runner=os.access(sys.argv[1],os.X_OK,effective_ids=True); readable=False
           try:
            fd=os.open(sys.argv[2],os.O_RDONLY|os.O_CLOEXEC|getattr(os,"O_NOFOLLOW",0));os.read(fd,1);os.close(fd);readable=True
           except OSError: pass
           raise SystemExit(0 if runner and readable else 41 if not runner and readable else 42 if runner else 43)
          except SystemExit: raise
          except BaseException: raise SystemExit(44)'
          if sudo --non-interactive /usr/bin/setpriv --reuid=10001 --regid=10001 --clear-groups --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs /usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 TZ=UTC /usr/bin/python3 -I -B -c "$preflight_code" "$RUNNER_TEMP" "$source_script" >/dev/null 2>/dev/null; then host_preflight_status=0; else host_preflight_status=$?; fi
          case "$host_preflight_status" in 0) host_preflight=BOTH_ACCESSIBLE;; 41) host_preflight=RUNNER_TEMP_NOT_SEARCHABLE;; 42) host_preflight=SOURCE_SCRIPT_NOT_READABLE;; 43) host_preflight=BOTH_INACCESSIBLE;; *) host_preflight=PREFLIGHT_EXECUTION_FAILED;; esac
          diagnostic_failed=false
          test "$host_preflight" != PREFLIGHT_EXECUTION_FAILED || diagnostic_failed=true
          if "${diagnostic[@]}" host-preflight --classification "$host_preflight" --exit-status "$host_preflight_status"; then :; else diagnostic_failed=true; fi
          bridge_parent=/tmp; bridge_parent_device="$(stat -Lc '%d' -- "$bridge_parent")"; bridge_parent_inode="$(stat -Lc '%i' -- "$bridge_parent")"
          bridge_nonce="$(/usr/bin/python3 -I -B -c 'import secrets;print(secrets.token_hex(16))')" || exit 1
          bridge_root="$bridge_parent/chengwang-joint-uid-bridge-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$bridge_nonce"
          bridge=(bootstrap-permission-bridge --repo "$GITHUB_WORKSPACE" --source-contract "$source_contract" --bridge-parent "$bridge_parent" --bridge-parent-device "$bridge_parent_device" --bridge-parent-inode "$bridge_parent_inode" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --bridge-nonce "$bridge_nonce")
          if sudo --non-interactive /usr/bin/python3 -I -B "$source_script" "${bridge[@]}" --bridge-mode setup >/dev/null 2>/dev/null; then bridge_setup_status=0; bridge_active=true; else bridge_setup_status=$?; bridge_active=false; fi
          if "${diagnostic[@]}" bridge-setup --exit-status "$bridge_setup_status" --payload-set-sha256 "$payload_digest"; then :; else diagnostic_failed=true; fi
          original_code=0; test "$host_preflight" != PREFLIGHT_EXECUTION_FAILED || original_code="$host_preflight_status"
          cleanup_attempted=false; absence_attempted=false; probe_active=false; bridge_cleanup_attempted=false; bridge_absence_attempted=false
          record_event(){ local event_mode="$1" event_status="$2"; if "${diagnostic[@]}" event --mode "$event_mode" --exit-status "$event_status"; then :; else diagnostic_failed=true; fi; }
          record_bridge(){ local action="$1" action_status="$2"; if "${diagnostic[@]}" "$action" --exit-status "$action_status"; then :; else diagnostic_failed=true; fi; }
          if test "$bridge_setup_status" = 0; then
            script="$bridge_root/payload/ci_joint_control_plane.py"; bridge_contract="$bridge_root/payload/contract.py"; runner="$bridge_root/runner"
            bridge_preflight_code='import os,sys
          try:
           runner=os.access(sys.argv[1],os.X_OK,effective_ids=True);readable=True
           for path in sys.argv[2:]:
            try:
             fd=os.open(path,os.O_RDONLY|os.O_CLOEXEC|getattr(os,"O_NOFOLLOW",0));os.read(fd,1);os.close(fd)
            except OSError: readable=False
           raise SystemExit(0 if runner and readable else 41 if not runner and readable else 42 if runner else 43)
          except SystemExit: raise
          except BaseException: raise SystemExit(44)'
            if sudo --non-interactive /usr/bin/setpriv --reuid=10001 --regid=10001 --clear-groups --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs /usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 TZ=UTC /usr/bin/python3 -I -B -c "$bridge_preflight_code" "$runner" "$script" "$bridge_contract" >/dev/null 2>/dev/null; then bridge_preflight_status=0; else bridge_preflight_status=$?; fi
            case "$bridge_preflight_status" in 0) bridge_preflight=BRIDGE_ACCESSIBLE;; 41) bridge_preflight=BRIDGE_RUNNER_NOT_SEARCHABLE;; 42) bridge_preflight=BRIDGE_PAYLOAD_NOT_READABLE;; 43) bridge_preflight=BRIDGE_BOTH_INACCESSIBLE;; *) bridge_preflight=BRIDGE_PREFLIGHT_EXECUTION_FAILED;; esac
            if "${diagnostic[@]}" bridge-preflight --classification "$bridge_preflight" --exit-status "$bridge_preflight_status"; then :; else diagnostic_failed=true; fi
            if test "$bridge_preflight" = BRIDGE_ACCESSIBLE; then
              runner_device="$(stat -Lc '%d' -- "$runner")"; runner_inode="$(stat -Lc '%i' -- "$runner")"
              common=(bootstrap-permission-probe --runner-temp "$runner" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --runner-device "$runner_device" --runner-inode "$runner_inode")
              root_probe(){ sudo --non-interactive /usr/bin/python3 -I -B "$script" "${common[@]}" --probe-mode "$1"; }
              uid_probe(){ sudo --non-interactive /usr/bin/setpriv --reuid=10001 --regid=10001 --clear-groups --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs /usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 TZ=UTC PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0 /usr/bin/python3 -I -B "$script" "${common[@]}" --probe-mode "$1"; }
              probe_active=true
            else
              test "$original_code" != 0 || original_code="$bridge_preflight_status"
            fi
          else
            test "$original_code" != 0 || original_code="$bridge_setup_status"
          fi
          run_root(){ local probe_mode="$1" mode_status; if root_probe "$probe_mode" >/dev/null 2>/dev/null; then mode_status=0; else mode_status=$?; fi; record_event "$probe_mode" "$mode_status"; return "$mode_status"; }
          run_uid(){ local probe_mode="$1" mode_status; if uid_probe "$probe_mode" >/dev/null 2>/dev/null; then mode_status=0; else mode_status=$?; fi; record_event "$probe_mode" "$mode_status"; return "$mode_status"; }
          cleanup_probe(){
            local cleanup_status absence_status
            if run_root root-cleanup; then cleanup_status=0; else cleanup_status=$?; fi; cleanup_attempted=true
            if run_root root-final-absence; then absence_status=0; else absence_status=$?; fi; absence_attempted=true
            if test "$cleanup_status" != 0; then return "$cleanup_status"; fi
            return "$absence_status"
          }
          cleanup_bridge(){
            local cleanup_status absence_status
            if test "$bridge_active" = true; then
              if sudo --non-interactive /usr/bin/python3 -I -B "$source_script" "${bridge[@]}" --bridge-mode cleanup >/dev/null 2>/dev/null; then cleanup_status=0; else cleanup_status=$?; fi
            else cleanup_status=0; fi
            bridge_cleanup_attempted=true; record_bridge bridge-cleanup "$cleanup_status"
            if sudo --non-interactive /usr/bin/python3 -I -B "$source_script" "${bridge[@]}" --bridge-mode final-absence >/dev/null 2>/dev/null; then absence_status=0; else absence_status=$?; fi
            bridge_absence_attempted=true; record_bridge bridge-final-absence "$absence_status"; bridge_active=false
            if test "$cleanup_status" != 0; then return "$cleanup_status"; fi
            return "$absence_status"
          }
          finish_probe(){
            local saved_exit="$1" final_status cleanup_status
            trap - EXIT
            final_status="$saved_exit"
            if test "$original_code" != 0; then final_status="$original_code"; fi
            if test "$probe_active" = true && { test "$cleanup_attempted" != true || test "$absence_attempted" != true; }; then
              if cleanup_probe; then :; else cleanup_status=$?; test "$final_status" != 0 || final_status="$cleanup_status"; fi
            fi
            if test "$bridge_cleanup_attempted" != true || test "$bridge_absence_attempted" != true; then
              if cleanup_bridge; then :; else cleanup_status=$?; test "$final_status" != 0 || final_status="$cleanup_status"; fi
            fi
            if test "$diagnostic_failed" = true; then test "$final_status" != 0 || final_status=1; fi
            if "${diagnostic[@]}" finalize --exit-status "$final_status" --output "$candidate"; then :; else test "$final_status" != 0 || final_status=1; fi
            exit "$final_status"
          }
          trap 'finish_probe "$?"' EXIT
          if test "$probe_active" = true && test "$original_code" = 0; then if run_root root-setup; then :; else original_code=$?; fi; fi
          if test "$probe_active" = true && test "$original_code" = 0; then if run_uid uid-prepublish-denials; then :; else original_code=$?; fi; fi
          if test "$probe_active" = true && test "$original_code" = 0; then if run_root root-finalize; then :; else original_code=$?; fi; fi
          if test "$probe_active" = true && test "$original_code" = 0; then if run_uid uid-final-read-and-rename; then :; else original_code=$?; fi; fi
          if test "$probe_active" = true && test "$original_code" = 0; then if run_uid uid-install-replacement; then :; else original_code=$?; fi; fi
          if test "$probe_active" = true && test "$original_code" = 0; then if run_root root-reject-replacement; then :; else original_code=$?; fi; fi
          if test "$probe_active" = true; then if cleanup_probe; then :; else cleanup_status=$?; test "$original_code" != 0 || original_code="$cleanup_status"; fi; fi
          if cleanup_bridge; then :; else cleanup_status=$?; test "$original_code" != 0 || original_code="$cleanup_status"; fi
          exit "$original_code"
      - name: Independently validate UID probe diagnostic
        if: always()
        id: uid_probe_diagnostic
        run: |
          set -uo pipefail
          private="$RUNNER_TEMP/joint-control-plane-uid-probe-private"; public="$RUNNER_TEMP/joint-control-plane-uid-probe-public"
          test ! -e "$public" || exit 1; install -d -m 0700 "$public" || exit 1
          if python3 -I -B chengwang/deploy/joint-control-plane/check_uid_probe_diagnostic.py --input "$private/uid-probe-diagnostic.json" --output "$public/uid-probe-diagnostic.json" --source-commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --producer chengwang/deploy/joint-control-plane/uid_probe_diagnostic.py --expected-producer-sha256 "$UID_PROBE_PRODUCER_SHA256" --expected-checker-sha256 "$UID_PROBE_CHECKER_SHA256"; then
            if echo 'ready=true' >> "$GITHUB_OUTPUT"; then exit 0; else exit 1; fi
          else
            exit 1
          fi
      - name: Upload only validated UID probe diagnostic
        if: ${{ always() && steps.uid_probe_diagnostic.outputs.ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: joint-control-plane-uid-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/joint-control-plane-uid-probe-public/uid-probe-diagnostic.json
          if-no-files-found: error
          retention-days: 14
      - name: Build once
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/joint-control-plane"
          test "$(go env GOVERSION)" = go1.23.12
          (cd chengwang && GOFLAGS=-mod=vendor CGO_ENABLED=0 go build -trimpath -o "$root/bin/server" ./cmd/server) >"$root/evidence/staging/build.stdout.private" 2>"$root/evidence/staging/build.stderr.private"
          sudo --non-interactive chown root:root "$root/bin" "$root/bin/server"; sudo --non-interactive chmod 0555 "$root/bin" "$root/bin/server"
          python3 -I -B chengwang/deploy/joint-control-plane/ci_joint_control_plane.py build --server-binary "$root/bin/server" --source-commit "$GITHUB_SHA" --output "$root/build.json"
          sudo --non-interactive install -m 0600 -o 10001 -g 10001 "$root/build.json" "$root/evidence/staging/lab/build.json"
          sudo --non-interactive chown -R 10001:10001 "$root/evidence/staging"
      - name: Bootstrap bounded namespace progress
        id: bootstrap_progress
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/joint-control-plane"; progress="$root/evidence/staging/failure-localization.private"; bootstrap="$root/evidence/staging/bootstrap-localization.private/status.json"
          test ! -e "$progress"; test ! -L "$progress"; sudo --non-interactive install -d -m 0700 -o 10001 -g 10001 "$progress"
          sudo --non-interactive /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/chengwang/deploy/joint-control-plane/ci_joint_control_plane.py" bootstrap-progress --progress-root "$progress" --bootstrap-record "$bootstrap" --source-commit "$GITHUB_SHA"
      - name: Real B0 J1 R2 same-binary scene
        if: ${{ steps.bootstrap_progress.outcome == 'success' }}
        env:
          BOOTSTRAP_STEP_OUTCOME: ${{ steps.bootstrap_progress.outcome }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/joint-control-plane"; outer_net="$(readlink /proc/self/ns/net)"; progress="$root/evidence/staging/failure-localization.private"; bootstrap="$root/evidence/staging/bootstrap-localization.private/status.json"
          test "$BOOTSTRAP_STEP_OUTCOME" = success
          timeout --signal=TERM --kill-after=15s 600s sudo --non-interactive unshare --mount --net --pid --fork --kill-child=SIGKILL --mount-proc /usr/bin/bash "$GITHUB_WORKSPACE/chengwang/deploy/joint-control-plane/ci_namespace.sh" "$GITHUB_WORKSPACE" "$root" "$outer_net" product "$GITHUB_SHA" /mnt/joint-control-plane/evidence/staging/bootstrap-localization.private/status.json bootstrap_progress "$BOOTSTRAP_STEP_OUTCOME" "$GITHUB_SHA"
      - name: Reacquire source after every attempt
        if: always()
        run: |
          root="$RUNNER_TEMP/joint-control-plane"
          if test -d "$root/evidence/staging/lab"; then
            sudo --non-interactive python3 -I -B chengwang/deploy/joint-control-plane/ci_joint_control_plane.py source --repo "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" --output "$root/evidence/staging/lab/source-after.json"
          fi
      - name: Independently verify public evidence
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/joint-control-plane"
          sudo --non-interactive python3 -I -B chengwang/deploy/joint-control-plane/check_joint_control_plane.py --evidence "$root/evidence/staging/lab" --repo "$GITHUB_WORKSPACE" --contract "$CONTRACT" --source-commit "$GITHUB_SHA" --output "$root/verification.private.json"
          sudo --non-interactive python3 -I -B chengwang/deploy/joint-control-plane/sanitize_publication.py publish --input "$root/evidence/staging/lab" --verification "$root/verification.private.json" --output "$root/evidence/public"
          sudo --non-interactive chown -R --no-dereference "$(id -u):$(id -g)" "$root/evidence/public"
      - name: Publish only bounded failure classification
        if: failure()
        env:
          BOOTSTRAP_STEP_OUTCOME: ${{ steps.bootstrap_progress.outcome }}
        run: |
          root="$RUNNER_TEMP/joint-control-plane"
          sudo --non-interactive python3 -I -B chengwang/deploy/joint-control-plane/sanitize_publication.py failure --input "$root/evidence/staging" --progress-root "$root/evidence/staging/failure-localization.private" --bootstrap-record "$root/evidence/staging/bootstrap-localization.private/status.json" --source-commit "$GITHUB_SHA" --bootstrap-step-id bootstrap_progress --bootstrap-step-outcome "$BOOTSTRAP_STEP_OUTCOME" --bootstrap-step-source "$GITHUB_SHA" --code SCENE_FAILED --output "$root/evidence/public/failure.json"
          sudo --non-interactive chown -R --no-dereference "$(id -u):$(id -g)" "$root/evidence/public"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: joint-control-plane-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/joint-control-plane/evidence/public/
