  independent-replay:
    needs: joint-control-plane
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Refuse every non-candidate ref
        run: test "$GITHUB_REF" = "$EXACT_REF"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: joint-control-plane-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/joint-control-plane-replay
      - name: Replay checker
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/joint-control-plane-replay"
          test "$(sha256sum "$CONTRACT" | cut -d' ' -f1)" = "$CONTRACT_SHA256"
