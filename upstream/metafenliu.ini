[custom]
; ==========================================================
; OpenClash /优化模板
; 目标：节点组最低延迟、精细分流、国内直连、默认不裸连
; 重要：OpenClash「Smart 策略自动切换」必须关闭，否则 url-test 会被改成 Smart。
; ==========================================================

enable_rule_generator=true
overwrite_original_rules=true

; 清理机场的流量/公告/订阅说明条目
exclude=(?i)(流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|公告|通知|Telegram|电报|频道|使用说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official|Website)

; ==========================================================
; 1. 分流规则（从上到下匹配）
; ==========================================================

; Adobe 默认阻断；如需联网可在面板切换该组
ruleset=🟥 Adobe,[]GEOSITE,adobe

; 私网和用户自定义直连优先
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private,no-resolve
ruleset=DIRECT,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml,10800
ruleset=DIRECT,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,10800

; 标准 WebRTC STUN/TURN 端口默认阻断，避免非代理 UDP 暴露公网 IP。
; 会影响部分网页语音/视频；需要时把「🛡️ WebRTC」切到「🔒 隐私代理」。
ruleset=🛡️ WebRTC,[]DST-PORT,3478-3481
ruleset=🛡️ WebRTC,[]DST-PORT,5349

; 用户维护的代理补丁
ruleset=🚀 手动选择,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.yaml,10800
ruleset=🚀 手动选择,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,10800

; 明确可在中国大陆直连的服务子集
ruleset=DIRECT,[]GEOSITE,google-cn
ruleset=DIRECT,[]GEOSITE,apple-cn
ruleset=DIRECT,[]GEOSITE,microsoft@cn
ruleset=DIRECT,[]GEOSITE,steam@cn
ruleset=DIRECT,[]GEOSITE,category-games@cn
ruleset=DIRECT,[]GEOSITE,category-game-platforms-download
ruleset=DIRECT,[]GEOSITE,category-public-tracker

; >>> custom rules injection point <<<

; 核心应用
ruleset=📦 Notion,[]GEOSITE,notion
ruleset=📨 Telegram,[]GEOSITE,telegram
ruleset=📨 Telegram,[]GEOIP,telegram,no-resolve
ruleset=🤖 ChatGPT,[]GEOSITE,openai
ruleset=🧠 AI,[]GEOSITE,category-ai-!cn
ruleset=🍎 Apple,[]GEOSITE,apple
ruleset=🎬 YouTube,[]GEOSITE,youtube
ruleset=🎥 Netflix,[]GEOSITE,netflix
ruleset=🎥 Netflix,[]GEOIP,netflix,no-resolve

; 社交与流媒体
ruleset=🎵 TikTok,[]GEOSITE,tiktok
ruleset=📸 Instagram,[]GEOSITE,instagram
ruleset=🐦 X,[]GEOSITE,twitter
ruleset=🐦 X,[]GEOIP,twitter,no-resolve
ruleset=📞 即时通讯,[]GEOSITE,category-communication
ruleset=💬 社交媒体,[]GEOSITE,category-social-media-!cn

; 开发、测速和游戏平台
ruleset=🛠 GitHub,[]GEOSITE,github
ruleset=🚝 测速工具,[]GEOSITE,category-speedtest
ruleset=🎮 Steam,[]GEOSITE,steam

; 交易平台：默认要求用户选择固定节点，减少频繁换 IP 的风控风险
ruleset=🟦 OKX,[]GEOSITE,okx
ruleset=🟨 Binance,[]GEOSITE,binance
ruleset=🟪 Bybit,[]GEOSITE,bybit

; Google、Microsoft、Cloudflare
ruleset=☁️ Cloudflare,[]GEOSITE,cloudflare
ruleset=☁️ Cloudflare,[]GEOIP,cloudflare,no-resolve
ruleset=🔎 Google,[]GEOSITE,google
ruleset=🔎 Google,[]GEOIP,google,no-resolve
ruleset=🪟 Microsoft,[]GEOSITE,microsoft

; 非中国域名和 GFW 兜底必须在 cn 之前，避免误把海外服务直连
ruleset=🚀 手动选择,[]GEOSITE,gfw
ruleset=🌐 Default,[]GEOSITE,geolocation-!cn

; 完整国内域名/IP 直连兜底
ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOIP,cn,no-resolve

; 非标端口规则和最终兜底
ruleset=🔀 非标端口,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,10800
ruleset=🐟 漏网之鱼,[]FINAL

; ==========================================================
; 2. 应用策略组
; 海外服务默认没有 DIRECT，避免误操作后暴露中国公网 IP。
; ==========================================================

; >>> custom groups injection point <<<

custom_proxy_group=📦 Notion`select`[]🔒 隐私代理`[]🇸🇬 SG`[]🇯🇵 JP`[]🇺🇸 US`[]🇹🇼 TW`[]🇭🇰 HK`[]🧭 手动选择
custom_proxy_group=🤖 ChatGPT`select`[]🇸🇬 SG`[]🇯🇵 JP`[]🇺🇸 US`[]🇹🇼 TW`[]🔒 隐私代理`[]🧭 手动选择
custom_proxy_group=🧠 AI`select`[]🇸🇬 SG`[]🇯🇵 JP`[]🇺🇸 US`[]🇹🇼 TW`[]🔒 隐私代理`[]🧭 手动选择
custom_proxy_group=📨 Telegram`select`[]🔒 隐私代理`[]🇸🇬 SG`[]🇭🇰 HK`[]🇯🇵 JP`[]🇺🇸 US`[]🧭 手动选择
custom_proxy_group=📞 即时通讯`select`[]🔒 隐私代理`[]🇭🇰 HK`[]🇸🇬 SG`[]🇯🇵 JP`[]🇺🇸 US`[]🧭 手动选择
custom_proxy_group=💬 社交媒体`select`[]🔒 隐私代理`[]🇭🇰 HK`[]🇸🇬 SG`[]🇯🇵 JP`[]🇺🇸 US`[]🧭 手动选择

custom_proxy_group=🎬 YouTube`select`[]🔒 隐私代理`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧭 手动选择
custom_proxy_group=🎥 Netflix`select`[]🇸🇬 SG`[]🇯🇵 JP`[]🇺🇸 US`[]🇹🇼 TW`[]🇭🇰 HK`[]🧊 冷门节点`[]🧭 手动选择
custom_proxy_group=🎵 TikTok`select`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇹🇼 TW`[]🔒 隐私代理`[]🧭 手动选择
custom_proxy_group=📸 Instagram`select`[]🔒 隐私代理`[]🇭🇰 HK`[]🇸🇬 SG`[]🇯🇵 JP`[]🇺🇸 US`[]🧭 手动选择
custom_proxy_group=🐦 X`select`[]🔒 隐私代理`[]🇭🇰 HK`[]🇸🇬 SG`[]🇯🇵 JP`[]🇺🇸 US`[]🧭 手动选择

custom_proxy_group=🛠 GitHub`select`[]🔒 隐私代理`[]🇭🇰 HK`[]🇸🇬 SG`[]🇯🇵 JP`[]🇺🇸 US`[]🧭 手动选择
custom_proxy_group=🚝 测速工具`select`[]DIRECT`[]🔒 隐私代理`[]♻️ 自动选择`[]🧭 手动选择
custom_proxy_group=🎮 Steam`select`[]DIRECT`[]🔒 隐私代理`[]🇭🇰 HK`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧭 手动选择

custom_proxy_group=🟦 OKX`select`[]🧭 手动选择`[]🇸🇬 SG`[]🇯🇵 JP`[]🇭🇰 HK`[]🇹🇼 TW`[]🇺🇸 US
custom_proxy_group=🟨 Binance`select`[]🧭 手动选择`[]🇸🇬 SG`[]🇯🇵 JP`[]🇭🇰 HK`[]🇹🇼 TW`[]🇺🇸 US
custom_proxy_group=🟪 Bybit`select`[]🧭 手动选择`[]🇸🇬 SG`[]🇯🇵 JP`[]🇭🇰 HK`[]🇹🇼 TW`[]🇺🇸 US

custom_proxy_group=🟥 Adobe`select`[]REJECT`[]DIRECT`[]🔒 隐私代理`[]🧭 手动选择
custom_proxy_group=🍎 Apple`select`[]DIRECT`[]🔒 隐私代理`[]🇭🇰 HK`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US
custom_proxy_group=🔎 Google`select`[]🔒 隐私代理`[]🇸🇬 SG`[]🇯🇵 JP`[]🇺🇸 US`[]🇹🇼 TW`[]🧭 手动选择
custom_proxy_group=☁️ Cloudflare`select`[]🔒 隐私代理`[]🇭🇰 HK`[]🇸🇬 SG`[]🇯🇵 JP`[]🇺🇸 US`[]🧭 手动选择
custom_proxy_group=🪟 Microsoft`select`[]DIRECT`[]🔒 隐私代理`[]🇭🇰 HK`[]🇸🇬 SG`[]🇯🇵 JP`[]🇺🇸 US

; ==========================================================
; 3. 总入口与隐私出口
; ==========================================================

; 只包含代理出口，供海外 DNS 和不允许裸连的应用使用；末尾 .* 直接加入全部物理节点
custom_proxy_group=🔒 隐私代理`select`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`.*

custom_proxy_group=🚀 手动选择`select`[]🔒 隐私代理`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]DIRECT
custom_proxy_group=🌐 Default`select`[]🔒 隐私代理`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🌐 Default`[]🔒 隐私代理`[]♻️ 自动选择`[]🧭 手动选择`[]DIRECT

; WebRTC 默认拒绝；切换到隐私代理可恢复一部分支持代理 UDP/TCP 的通话
custom_proxy_group=🛡️ WebRTC`select`[]REJECT`[]🔒 隐私代理

custom_proxy_group=🔀 非标端口`select`[]🐟 遵循规则`[]DIRECT
custom_proxy_group=🐟 遵循规则`select`[]🐟 漏网之鱼

; ==========================================================
; 4. 节点池
; 所有自动池均为 url-test，使用 Cloudflare HTTPS 测速，30 ms 容差降低频繁切换。
; 如果需要严格最低延迟，可把每行最后的 30 改为 0。
; ==========================================================

custom_proxy_group=🧭 手动选择`select`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`https://cp.cloudflare.com/generate_204`300,,30

custom_proxy_group=🇭🇰 HK`url-test`(?i)(🇭🇰|香港|Hong\s*Kong|(^|[\s_-])HK([\s_0-9-]|$))`https://cp.cloudflare.com/generate_204`300,,30
custom_proxy_group=🇹🇼 TW`url-test`(?i)(🇹🇼|台湾|Taiwan|Taipei|HiNet|(^|[\s_-])TW([\s_0-9-]|$))`https://cp.cloudflare.com/generate_204`300,,30
custom_proxy_group=🇯🇵 JP`url-test`(?i)(🇯🇵|日本|Tokyo|Osaka|(^|[\s_-])JP([\s_0-9-]|$))`https://cp.cloudflare.com/generate_204`300,,30
custom_proxy_group=🇸🇬 SG`url-test`(?i)(🇸🇬|新加坡|Singapore|(^|[\s_-])SG([\s_0-9-]|$))`https://cp.cloudflare.com/generate_204`300,,30
custom_proxy_group=🇺🇸 US`url-test`(?i)(🇺🇸|美国|United\s*States|Los\s*Angeles|San\s*Jose|Seattle|New\s*York|(^|[\s_-])US([\s_0-9-]|$))`https://cp.cloudflare.com/generate_204`300,,30

; 排除以上五个地区后的自动最低延迟池
custom_proxy_group=🧊 冷门节点`url-test`(?i)^(?!.*(🇭🇰|香港|Hong\s*Kong|🇹🇼|台湾|Taiwan|Taipei|HiNet|🇯🇵|日本|Tokyo|Osaka|🇸🇬|新加坡|Singapore|🇺🇸|美国|United\s*States|Los\s*Angeles|San\s*Jose|Seattle|New\s*York|\b(HK|TW|JP|SG|US)\b)).*`https://cp.cloudflare.com/generate_204`300,,30
